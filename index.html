<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L&V HOGAR - Tienda Oficial</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="bg-[#FAFAF7] text-gray-800 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SUPABASE_URL = "https://cleduaakmebcnldqeaoo.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsZWR1YWFrbWViY25sZHFlYW9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMjYxMzgsImV4cCI6MjEwODgwMjEzOH0.Wl1DsflvOJLNDCaCjdNyaGe91KpCH7zpqZGJVDOpH2s";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function CatalogApp() {
      const [products, setProducts] = useState([]);
      const [loading, setLoading] = useState(true);
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [selectedCategory, setSelectedCategory] = useState('Todos');
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [activeImage, setActiveImage] = useState('');
      const [fullScreenImage, setFullScreenImage] = useState(null); // Estado para la foto en Pantalla Completa
      const [clientName, setClientName] = useState('');

      const categories = ['Todos', 'Hogar', 'Cuidado Personal', 'Electrodomésticos', 'Bazar y Cocina', 'Aromas y Decoración', 'Accesorios'];

      useEffect(() => {
        async function fetchProducts() {
          try {
            const { data, error } = await supabaseClient.from('productos').select('*').order('id', { ascending: false });
            if (error) throw error;
            setProducts(data || []);
          } catch (err) {
            console.error("Error al cargar productos:", err);
          } finally {
            setLoading(false);
          }
        }
        fetchProducts();
      }, []);

      const getCategoryIcon = (cat) => {
        const lower = cat.toLowerCase();
        if (lower.includes('hogar')) return 'fa-house-chimney';
        if (lower.includes('cuidado') || lower.includes('personal')) return 'fa-spa';
        if (lower.includes('electro')) return 'fa-bolt';
        if (lower.includes('bazar') || lower.includes('cocina')) return 'fa-utensils';
        if (lower.includes('aroma') || lower.includes('deco')) return 'fa-wand-magic-sparkles';
        return 'fa-box-open';
      };

      const filteredProducts = selectedCategory === 'Todos' 
        ? products 
        : products.filter(p => p.category === selectedCategory);

      const addToCart = (product) => {
        setCart(prev => {
          const exists = prev.find(item => item.id === product.id);
          if (exists) return prev.map(i => i.id === product.id ? {...i, qty: i.qty + 1} : i);
          return [...prev, {...product, qty: 1}];
        });
        setIsCartOpen(true);
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Barra superior */}
          <div className="bg-[#768C77] text-white text-[11px] py-1.5 px-4 text-center">
            📍 Malvinas Argentinas y Córdoba Capital | ⏰ Lun a Sáb: 9 a 20hs
          </div>

          {/* Header */}
          <header className="bg-[#1C1F1D] text-white py-4 px-6 flex justify-between items-center shadow-md sticky top-0 z-40">
            <div>
              <h1 className="text-lg font-serif tracking-widest text-white">L&V HOGAR</h1>
              <p className="text-[10px] text-[#C8B297] uppercase">Artículos para el hogar y cuidado personal</p>
            </div>
            <button 
              onClick={() => setIsCartOpen(true)}
              className="bg-[#768C77] text-white px-4 py-2 rounded-full text-xs font-medium flex items-center gap-2 shadow"
            >
              <i className="fa-solid fa-bag-shopping"></i> Carrito ({cart.reduce((s, i) => s + i.qty, 0)})
            </button>
          </header>

          {/* Contenido Principal */}
          <main className="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
            <h2 className="text-xs font-bold uppercase tracking-wider text-gray-500 mb-3">Explorar por Categoría</h2>
            
            {/* Categorías */}
            <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-3 mb-8">
              {categories.map(cat => (
                <button
                  key={cat}
                  onClick={() => setSelectedCategory(cat)}
                  className={`p-3.5 rounded-2xl border text-left transition flex flex-col justify-between items-start shadow-xs ${
                    selectedCategory === cat 
                      ? 'bg-[#768C77] text-white border-[#768C77] shadow-md' 
                      : 'bg-white border-gray-200 text-gray-700 hover:bg-gray-50'
                  }`}
                >
                  <div className={`w-8 h-8 rounded-xl flex items-center justify-center text-xs ${selectedCategory === cat ? 'bg-white/20 text-white' : 'bg-gray-100 text-gray-600'}`}>
                    <i className={`fa-solid ${cat === 'Todos' ? 'fa-border-all' : getCategoryIcon(cat)}`}></i>
                  </div>
                  <span className="font-semibold text-xs mt-3 line-clamp-1">{cat}</span>
                </button>
              ))}
            </div>

            {/* Grilla de Productos */}
            {loading ? (
              <div className="text-center py-20 text-gray-500">
                <i className="fa-solid fa-spinner animate-spin text-2xl mb-2"></i>
                <p>Cargando productos...</p>
              </div>
            ) : filteredProducts.length === 0 ? (
              <div className="text-center py-20 text-gray-400">No hay productos disponibles en esta categoría.</div>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                {filteredProducts.map(product => (
                  <div key={product.id} className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden flex flex-col justify-between">
                    <div>
                      <div 
                        className="h-52 bg-gray-100 overflow-hidden relative cursor-pointer group"
                        onClick={() => { setSelectedProduct(product); setActiveImage(product.image); }}
                      >
                        <img src={product.image || 'https://images.unsplash.com/photo-1583847268964-b28dc8f51f92?auto=format&fit=crop&w=600&q=80'} alt={product.title} className="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
                        <span className="absolute top-3 right-3 bg-black/60 text-white text-[10px] px-2.5 py-1 rounded-full">
                          <i className="fa-solid fa-expand mr-1"></i> Ampliar
                        </span>
                      </div>
                      <div className="p-5">
                        <span className="text-[10px] font-semibold text-[#768C77] uppercase">{product.category}</span>
                        <h3 
                          className="font-serif text-base text-gray-800 mt-1 cursor-pointer hover:underline"
                          onClick={() => { setSelectedProduct(product); setActiveImage(product.image); }}
                        >
                          {product.title}
                        </h3>
                        <p className="text-gray-500 text-xs mt-2 line-clamp-2">{product.description}</p>
                      </div>
                    </div>
                    <div className="p-5 pt-0 flex justify-between items-center">
                      <span className="text-lg font-serif font-bold text-[#768C77]">${Number(product.price).toLocaleString('es-AR')}</span>
                      <button 
                        onClick={() => { setSelectedProduct(product); setActiveImage(product.image); }}
                        className="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-xs font-medium"
                      >
                        Ver Detalle
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </main>

          {/* Modal Ampliado de Detalle del Producto */}
          {selectedProduct && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/75 p-4 backdrop-blur-xs overflow-y-auto">
              <div className="bg-white rounded-2xl max-w-2xl w-full overflow-hidden shadow-2xl border border-gray-200 my-auto flex flex-col md:flex-row">
                
                {/* Contenedor de Imagen y Galería */}
                <div className="w-full md:w-1/2 bg-black p-4 flex flex-col justify-center items-center relative">
                  <div 
                    className="h-64 sm:h-80 w-full flex items-center justify-center cursor-zoom-in group"
                    onClick={() => setFullScreenImage(activeImage || selectedProduct.image)}
                    title="Toca para ver en pantalla completa"
                  >
                    <img src={activeImage || selectedProduct.image} alt={selectedProduct.title} className="max-h-full max-w-full object-contain" />
                    <span className="absolute bottom-2 right-2 bg-black/70 text-white text-[10px] px-2 py-1 rounded-md opacity-80 group-hover:opacity-100 transition">
                      <i className="fa-solid fa-[#768C77] fa-magnifying-glass-plus mr-1"></i> Ver gigante
                    </span>
                  </div>

                  {selectedProduct.gallery && selectedProduct.gallery.length > 0 && (
                    <div className="flex gap-2 mt-3 overflow-x-auto w-full pb-1">
                      <img src={selectedProduct.image} onClick={() => setActiveImage(selectedProduct.image)} className={`w-12 h-12 object-cover rounded cursor-pointer border ${activeImage === selectedProduct.image ? 'border-[#768C77]' : 'border-transparent'}`} />
                      {selectedProduct.gallery.map((img, idx) => (
                        <img key={idx} src={img} onClick={() => setActiveImage(img)} className={`w-12 h-12 object-cover rounded cursor-pointer border ${activeImage === img ? 'border-[#768C77]' : 'border-transparent'}`} />
                      ))}
                    </div>
                  )}
                </div>

                {/* Detalles y Compra */}
                <div className="w-full md:w-1/2 p-6 flex flex-col justify-between bg-white">
                  <div>
                    <div className="flex justify-between items-start">
                      <div>
                        <span className="text-[10px] font-semibold text-[#768C77] uppercase">{selectedProduct.category}</span>
                        <h3 className="text-xl font-serif font-bold text-gray-800 mt-1">{selectedProduct.title}</h3>
                      </div>
                      <button onClick={() => setSelectedProduct(null)} className="text-gray-400 hover:text-gray-600">
                        <i className="fa-solid fa-xmark text-lg"></i>
                      </button>
                    </div>
                    <p className="text-2xl font-serif font-bold text-[#768C77] mt-3">${Number(selectedProduct.price).toLocaleString('es-AR')}</p>
                    <p className="text-xs text-gray-600 mt-4 leading-relaxed font-light">{selectedProduct.description}</p>
                  </div>

                  <div className="mt-6 pt-4 border-t">
                    <button 
                      onClick={() => { addToCart(selectedProduct); setSelectedProduct(null); }}
                      className="w-full bg-[#768C77] text-white font-medium py-3 rounded-xl text-xs shadow hover:opacity-90 flex items-center justify-center gap-2"
                    >
                      <i className="fa-solid fa-bag-shopping"></i> Agregar al Carrito
                    </button>
                  </div>
                </div>

              </div>
            </div>
          )}

          {/* VISOR FULLSCREEN REAL (Pantalla Completa al 100%) */}
          {fullScreenImage && (
            <div 
              className="fixed inset-0 z-50 bg-black/95 flex items-center justify-center p-2 sm:p-6 backdrop-blur-md cursor-zoom-out"
              onClick={() => setFullScreenImage(null)}
            >
              <button 
                onClick={() => setFullScreenImage(null)} 
                className="absolute top-4 right-4 text-white bg-white/20 hover:bg-white/40 w-10 h-10 rounded-full flex items-center justify-center text-xl transition z-50"
              >
                <i className="fa-solid fa-xmark"></i>
              </button>
              <img 
                src={fullScreenImage} 
                alt="Foto Pantalla Completa" 
                className="max-w-full max-h-full object-contain rounded-lg shadow-2xl animate-fade-in"
              />
            </div>
          )}

          {/* Carrito Lateral */}
          {isCartOpen && (
            <div className="fixed inset-0 z-50 flex justify-end bg-black/40 backdrop-blur-xs">
              <div className="bg-white w-full max-w-md h-full flex flex-col justify-between shadow-2xl p-6 overflow-y-auto">
                <div>
                  <div className="flex justify-between items-center pb-4 border-b">
                    <h3 className="font-serif text-lg text-gray-800">Tu Pedido</h3>
                    <button onClick={() => setIsCartOpen(false)} className="text-gray-400 hover:text-gray-600">
                      <i className="fa-solid fa-xmark text-lg"></i>
                    </button>
                  </div>

                  {cart.length === 0 ? (
                    <div className="text-center py-12 text-gray-400 text-xs">Tu carrito está vacío.</div>
                  ) : (
                    <div className="divide-y my-4 max-h-40 overflow-y-auto">
                      {cart.map(item => (
                        <div key={item.id} className="py-3 flex items-center justify-between text-xs">
                          <div className="flex items-center gap-3">
                            <img src={item.image} className="w-12 h-12 object-cover rounded border" />
                            <div>
                              <p className="font-bold text-gray-800">{item.title}</p>
                              <p className="text-gray-500">${Number(item.price).toLocaleString('es-AR')} x {item.qty}</p>
                            </div>
                          </div>
                          <button onClick={() => setCart(cart.filter(i => i.id !== item.id))} className="text-red-400 hover:text-red-600"><i className="fa-solid fa-trash-can"></i></button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {cart.length > 0 && (
                  <div className="border-t pt-3 space-y-2 text-xs">
                    <div>
                      <label className="block font-semibold mb-1">Nombre y Apellido:</label>
                      <input type="text" placeholder="Tu nombre..." value={clientName} onChange={e => setClientName(e.target.value)} className="w-full p-2 border rounded-xl bg-gray-50" />
                    </div>
                    <button 
                      onClick={() => {
                        if (!clientName.trim()) { alert('Ingresá tu nombre'); return; }
                        const msg = `¡Hola L&V HOGAR! Mi nombre es ${clientName}. Quisiera pedir:\n` + cart.map(i => `• ${i.title} x${i.qty} ($${i.price * i.qty})`).join('\n') + `\n\nTotal: $${cart.reduce((s, i) => s + (i.price * i.qty), 0)}`;
                        window.open(`https://wa.me/5493512102238?text=${encodeURIComponent(msg)}`, '_blank');
                      }}
                      className="w-full bg-[#768C77] text-white font-medium py-2.5 rounded-xl flex items-center justify-center gap-2 shadow"
                    >
                      <i className="fa-brands fa-whatsapp text-lg"></i> Enviar Pedido por WhatsApp
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-[#1C1F1D] text-gray-400 py-6 text-center text-xs mt-auto">
            <p>© L&V HOGAR - Malvinas Argentinas y Córdoba Capital</p>
            <a href="admin.html" className="text-gray-500 hover:text-white text-[10px] block mt-2">Acceso Administrador</a>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CatalogApp />);
  </script>
</body>
</html>
