<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L&V HOGAR - Tienda Oficial</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Playfair Display', 'serif'],
            sans: ['Montserrat', 'sans-serif'],
            poppins: ['Poppins', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="antialiased transition-colors duration-300">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const DEFAULT_CONFIG = {
      storeName: "L&V HOGAR",
      storeSubtitle: "Artículos para el hogar y cuidado personal",
      whatsappNumber: "5493512102238",
      whatsappMsg: "¡Hola L&V HOGAR! Quisiera realizar la siguiente compra:\n\n",
      showBanner: true,
      bannerTitle: "Renueva tu Hogar con Estilo y Calidez",
      bannerText: "Envíos locales a domicilio y atención personalizada por WhatsApp.",
      paymentMethods: "Efectivo contra entrega, Transferencia bancaria (Alias: lvhogar.mp) y Mercado Pago.",
      brandColor: "#768C77",
      secondaryColor: "#C8B297",
      bgColor: "#FAFAF7",
      headerBg: "#1C1F1D",
      cardStyle: "rounded",
      fontFamily: "sans",
      bgImage: "",
      categories: ["Hogar", "Cuidado Personal", "Electrodomésticos", "Bazar y Cocina", "Aromas y Decoración", "Accesorios"],
      deliveryZones: [
        { name: "Malvinas Argentinas - 1ª Sección", price: 0 },
        { name: "Malvinas Argentinas - 2ª Sección", price: 500 },
        { name: "Malvinas Argentinas - 3ª Sección", price: 800 },
        { name: "Córdoba Capital (Otras zonas)", price: 1500 }
      ]
    };

    const DEFAULT_PRODUCTS = [
      {
        id: 1,
        sku: "LV-ESC-01",
        title: "Escritorio Portátil Multiuso",
        category: "Hogar",
        price: 18500,
        originalPrice: 22000,
        stock: 12,
        image: "https://images.unsplash.com/photo-1518455027359-f3f8164ba6bd?auto=format&fit=crop&w=600&q=80",
        video: "",
        description: "Escritorio plegable e ideal para trabajar o estudiar cómodamente desde el sofá o la cama.",
        badge: "OFERTA",
        variantsLabel: "Color",
        variants: "Natural, Roble, Negro"
      },
      {
        id: 2,
        sku: "LV-DIF-02",
        title: "Aroma Difusor Esencial",
        category: "Aromas y Decoración",
        price: 12900,
        originalPrice: 15000,
        stock: 8,
        image: "https://images.unsplash.com/photo-1608571423902-eed4a5ad8108?auto=format&fit=crop&w=600&q=80",
        video: "",
        description: "Difusor ultrasónico con luces LED ambientales para aceites esenciales.",
        badge: "NUEVO",
        variantsLabel: "Capacidad (ml)",
        variants: "200ml, 400ml, 500ml"
      }
    ];

    function CatalogApp() {
      const [config, setConfig] = useState(() => JSON.parse(localStorage.getItem('lv_config')) || DEFAULT_CONFIG);
      const [products, setProducts] = useState(() => JSON.parse(localStorage.getItem('lv_products')) || DEFAULT_PRODUCTS);
      
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('Todos');
      const [sortBy, setSortBy] = useState('default');
      const [selectedProductModal, setSelectedProductModal] = useState(null);
      
      const [isAiChatOpen, setIsAiChatOpen] = useState(false);
      const [aiMessages, setAiMessages] = useState([
        { sender: 'bot', text: '¡Hola! Soy el asistente virtual de L&V HOGAR. ¿En qué te puedo ayudar hoy?' }
      ]);
      const [aiInput, setAiInput] = useState('');
      const [isAiLoading, setIsAiLoading] = useState(false);

      const [fulfillmentType, setFulfillmentType] = useState('delivery');
      const [selectedDeliveryZone, setSelectedDeliveryZone] = useState(0);
      const [clientAddress, setClientAddress] = useState('');
      const [clientDni, setClientDni] = useState('');
      const [preferredTime, setPreferredTime] = useState('Indistinto');
      const [paymentMethodSelected, setPaymentMethodSelected] = useState('Efectivo contra entrega');
      
      const [addressError, setAddressError] = useState(false);
      const [copySuccess, setCopySuccess] = useState(false);
      const [quantities, setQuantities] = useState({});
      const [chosenVariant, setChosenVariant] = useState({});

      useEffect(() => {
        const syncData = () => {
          const storedConfig = JSON.parse(localStorage.getItem('lv_config'));
          const storedProducts = JSON.parse(localStorage.getItem('lv_products'));
          if (storedConfig) setConfig(storedConfig);
          if (storedProducts) setProducts(storedProducts);
        };
        window.addEventListener('storage', syncData);
        const interval = setInterval(syncData, 1000);
        return () => {
          window.removeEventListener('storage', syncData);
          clearInterval(interval);
        };
      }, []);

      const primaryColor = config.brandColor || '#768C77';
      const secondaryColor = config.secondaryColor || '#C8B297';
      const bgColor = config.bgColor || '#FAFAF7';
      const headerBg = config.headerBg || '#1C1F1D';
      
      const fontClass = config.fontFamily === 'serif' ? 'font-serif' : config.fontFamily === 'poppins' ? 'font-poppins' : 'font-sans';
      const cardRadius = config.cardStyle === 'modern' ? 'rounded-3xl shadow-lg' : config.cardStyle === 'glass' ? 'rounded-2xl backdrop-blur-md bg-white/80 shadow-lg' : 'rounded-2xl shadow-sm';

      const handleSendAiMessage = async (e) => {
        e.preventDefault();
        if (!aiInput.trim()) return;

        const userText = aiInput.trim();
        setAiMessages(prev => [...prev, { sender: 'user', text: userText }]);
        setAiInput('');
        setIsAiLoading(true);

        setTimeout(() => {
          const queryLower = userText.toLowerCase();
          let botReply = "";
          const matchedProducts = products.filter(p => 
            p.title.toLowerCase().includes(queryLower) || 
            p.description.toLowerCase().includes(queryLower) ||
            p.category.toLowerCase().includes(queryLower)
          );

          if (queryLower.includes('envio') || queryLower.includes('entrega') || queryLower.includes('zona')) {
            botReply = `Hacemos envíos locales en Malvinas Argentinas (1ª, 2ª y 3ª sección) y en Córdoba Capital. ¡Puedes seleccionar tu zona al confirmar el carrito!`;
          } else if (queryLower.includes('pago') || queryLower.includes('tarjeta') || queryLower.includes('transferencia')) {
            botReply = `Aceptamos: ${config.paymentMethods || 'Efectivo, Transferencia Bancaria y Mercado Pago'}.`;
          } else if (matchedProducts.length > 0) {
            const prodListStr = matchedProducts.slice(0, 3).map(p => `• ${p.title} - $${p.price.toLocaleString('es-AR')}`).join('\n');
            botReply = `Encontré estas opciones en nuestro catálogo:\n\n${prodListStr}\n\n¿Te gustaría ver alguno en detalle?`;
          } else {
            botReply = `¡Gracias por consultar! Contamos con una amplia variedad en artículos para el hogar y cuidado personal. Si quieres atención directa, escríbenos por WhatsApp al ${config.whatsappNumber}.`;
          }

          setAiMessages(prev => [...prev, { sender: 'bot', text: botReply }]);
          setIsAiLoading(false);
        }, 600);
      };

      const handleQtyChange = (productId, delta) => {
        setQuantities(prev => {
          const current = prev[productId] || 1;
          const updated = current + delta;
          return { ...prev, [productId]: updated > 0 ? updated : 1 };
        });
      };

      const handleVariantSelect = (productId, variantVal) => {
        setChosenVariant(prev => ({ ...prev, [productId]: variantVal }));
      };

      const addToCart = (product) => {
        const qtyToAdd = quantities[product.id] || 1;
        let variantString = "";
        if (product.variants && product.variants.trim()) {
          const optionsArray = product.variants.split(',').map(v => v.trim());
          variantString = chosenVariant[product.id] || optionsArray[0];
        }

        const cartItemId = variantString ? `${product.id}-${variantString}` : product.id;

        setCart(prev => {
          const exists = prev.find(item => item.cartItemId === cartItemId);
          if (exists) {
            return prev.map(item => item.cartItemId === cartItemId ? { ...item, qty: item.qty + qtyToAdd } : item);
          }
          return [...prev, { ...product, cartItemId, qty: qtyToAdd, selectedVariant: variantString }];
        });
        setIsCartOpen(true);
      };

      const updateQty = (cartItemId, delta) => {
        setCart(prev => prev.map(item => {
          if (item.cartItemId === cartItemId) {
            const newQty = item.qty + delta;
            return newQty > 0 ? { ...item, qty: newQty } : item;
          }
          return item;
        }));
      };

      const removeFromCart = (cartItemId) => setCart(prev => prev.filter(item => item.cartItemId !== cartItemId));

      const getSubtotal = () => cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const getDeliveryCost = () => {
        if (fulfillmentType === 'pickup') return 0;
        return config.deliveryZones ? config.deliveryZones[selectedDeliveryZone].price : 0;
      };
      const getTotal = () => getSubtotal() + getDeliveryCost();

      const handleSingleProductWhatsApp = (product) => {
        const varString = (product.variants && product.variants.trim()) ? ` (Opción: ${chosenVariant[product.id] || product.variants.split(',')[0].trim()})` : '';
        const skuStr = product.sku ? ` [SKU: ${product.sku}]` : '';
        const message = `¡Hola ${config.storeName}! Me interesa consultar por este producto:\n\n• *${product.title}*${skuStr}${varString} - $${product.price.toLocaleString('es-AR')}\n\n¿Hay stock disponible?`;
        window.open(`https://wa.me/${config.whatsappNumber}?text=${encodeURIComponent(message)}`, '_blank');
      };

      const handleShareProduct = (product) => {
        const text = `¡Mirá este producto de ${config.storeName}!\n*${product.title}* - $${product.price.toLocaleString('es-AR')}\n${product.description}`;
        if (navigator.share) {
          navigator.share({ title: product.title, text: text, url: window.location.href }).catch(() => {});
        } else {
          window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
        }
      };

      const generateOrderText = () => {
        let message = config.whatsappMsg || "¡Hola! Quisiera realizar la siguiente compra:\n\n";
        cart.forEach(item => {
          const varText = item.selectedVariant ? ` [${item.selectedVariant}]` : '';
          const skuText = item.sku ? ` (SKU: ${item.sku})` : '';
          message += `• *${item.title}*${skuText}${varText} x${item.qty} - $${(item.price * item.qty).toLocaleString('es-AR')}\n`;
        });

        message += `\n*Subtotal:* $${getSubtotal().toLocaleString('es-AR')}`;

        if (fulfillmentType === 'delivery') {
          const zone = config.deliveryZones ? config.deliveryZones[selectedDeliveryZone] : { name: "Estándar", price: 0 };
          message += `\n*Tipo de Entrega:* Envío a Domicilio`;
          message += `\n*Zona:* ${zone.name} ($${zone.price.toLocaleString('es-AR')})`;
          message += `\n*Dirección:* ${clientAddress.trim()}`;
        } else {
          message += `\n*Tipo de Entrega:* Retiro en Local`;
        }

        if (clientDni.trim()) message += `\n*DNI:* ${clientDni.trim()}`;
        message += `\n*Horario:* ${preferredTime}`;
        message += `\n*Pago:* ${paymentMethodSelected}`;
        message += `\n*TOTAL FINAL:* $${getTotal().toLocaleString('es-AR')}\n\n¿Cómo coordinamos?`;
        return message;
      };

      const handleCheckoutWhatsApp = () => {
        if (cart.length === 0) return;
        if (fulfillmentType === 'delivery' && !clientAddress.trim()) {
          setAddressError(true);
          return;
        }
        setAddressError(false);
        window.open(`https://wa.me/${config.whatsappNumber}?text=${encodeURIComponent(generateOrderText())}`, '_blank');
      };

      const handleCopyOrder = () => {
        if (fulfillmentType === 'delivery' && !clientAddress.trim()) {
          setAddressError(true);
          return;
        }
        setAddressError(false);
        navigator.clipboard.writeText(generateOrderText()).then(() => {
          setCopySuccess(true);
          setTimeout(() => setCopySuccess(false), 3000);
        });
      };

      const categories = ['Todos', ...(config.categories || ["Hogar", "Cuidado Personal", "Electrodomésticos"])];
      
      const filteredProducts = products.filter(p => {
        const matchesCat = selectedCategory === 'Todos' || p.category === selectedCategory;
        const matchesSearch = p.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              p.description.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              (p.sku && p.sku.toLowerCase().includes(searchQuery.toLowerCase()));
        return matchesCat && matchesSearch;
      }).sort((a, b) => {
        if (sortBy === 'low-high') return a.price - b.price;
        if (sortBy === 'high-low') return b.price - a.price;
        return 0;
      });

      return (
        <div 
          style={{ 
            backgroundColor: bgColor,
            backgroundImage: config.bgImage ? `url(${config.bgImage})` : 'none',
            backgroundSize: 'cover',
            backgroundAttachment: 'fixed'
          }} 
          className={`min-h-screen flex flex-col relative text-gray-800 ${fontClass}`}
        >
          <div style={{ backgroundColor: primaryColor }} className="text-white text-[11px] py-1.5 px-4 text-center tracking-wide font-light flex justify-center items-center gap-4">
            <span><i className="fa-solid fa-truck-fast mr-1"></i> Envíos locales en Malvinas Argentinas y Córdoba</span>
            <span className="hidden md:inline">|</span>
            <span className="hidden md:inline"><i className="fa-solid fa-wallet mr-1"></i> {config.paymentMethods}</span>
          </div>

          <header style={{ backgroundColor: headerBg }} className="text-white shadow-md sticky top-0 z-40 border-b border-white/10">
            <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
              <div className="flex items-center space-x-3">
                <div style={{ borderColor: secondaryColor }} className="w-11 h-11 border rounded-full flex flex-col items-center justify-center bg-black/40 shadow">
                  <span style={{ color: primaryColor }} className="font-serif font-bold text-sm tracking-widest leading-none">L&V</span>
                  <span style={{ color: secondaryColor }} className="font-serif text-[7px] tracking-tighter uppercase">HOGAR</span>
                </div>
                <div>
                  <h1 className="text-lg md:text-xl font-serif tracking-widest text-white">{config.storeName}</h1>
                  <p className="text-[10px] tracking-wide uppercase hidden sm:block" style={{ color: secondaryColor }}>{config.storeSubtitle}</p>
                </div>
              </div>

              <button 
                onClick={() => setIsCartOpen(true)}
                style={{ backgroundColor: primaryColor }}
                className="text-white px-4 py-2 rounded-full flex items-center space-x-2 transition shadow text-xs font-medium border border-white/20 hover:opacity-90"
              >
                <i className="fa-solid fa-bag-shopping text-sm"></i>
                <span className="hidden sm:inline">Mi Carrito</span>
                <span style={{ backgroundColor: secondaryColor }} className="text-black text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center">
                  {cart.reduce((s, i) => s + i.qty, 0)}
                </span>
              </button>
            </div>
          </header>

          {config.showBanner && (
            <section style={{ backgroundColor: headerBg }} className="text-white py-10 px-4 text-center border-b border-white/10">
              <div className="max-w-3xl mx-auto">
                <span style={{ backgroundColor: secondaryColor + '30', color: secondaryColor }} className="text-[10px] font-semibold uppercase tracking-widest px-4 py-1 rounded-full border border-white/20">
                  CATÁLOGO OFICIAL
                </span>
                <h2 className="text-2xl md:text-3xl font-serif font-normal text-white mt-3 tracking-wide">{config.bannerTitle}</h2>
                <p className="mt-2 text-gray-300 text-xs md:text-sm tracking-wide font-light">{config.bannerText}</p>
              </div>
            </section>
          )}

          <main className="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
            <div className="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 bg-white/90 backdrop-blur p-4 rounded-2xl shadow-sm border border-gray-200">
              <div className="flex gap-2 overflow-x-auto w-full md:w-auto pb-1 md:pb-0">
                {categories.map(cat => (
                  <button
                    key={cat}
                    onClick={() => setSelectedCategory(cat)}
                    style={selectedCategory === cat ? { backgroundColor: primaryColor } : {}}
                    className={`px-5 py-2 rounded-full text-xs font-medium tracking-wide whitespace-nowrap transition ${
                      selectedCategory === cat ? 'text-white shadow-sm' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                    }`}
                  >
                    {cat}
                  </button>
                ))}
              </div>

              <div className="flex gap-2 w-full md:w-auto">
                <select 
                  value={sortBy} 
                  onChange={(e) => setSortBy(e.target.value)}
                  className="bg-gray-100 border border-gray-200 rounded-full px-3 py-2 text-xs text-gray-700 focus:outline-none"
                >
                  <option value="default">Ordenar: Destacados</option>
                  <option value="low-high">Precio: Menor a Mayor</option>
                  <option value="high-low">Precio: Mayor a Menor</option>
                </select>

                <div className="relative w-full md:w-60">
                  <i style={{ color: primaryColor }} className="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-xs"></i>
                  <input
                    type="text"
                    placeholder="Buscar producto o SKU..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full pl-9 pr-4 py-2 bg-gray-100 border border-gray-200 rounded-full text-xs focus:outline-none"
                  />
                </div>
              </div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
              {filteredProducts.map(product => {
                const isAvailable = product.stock > 0;
                const currentQty = quantities[product.id] || 1;
                const hasVariants = product.variants && product.variants.trim().length > 0;
                const variantsList = hasVariants ? product.variants.split(',').map(v => v.trim()) : [];
                const activeVariant = chosenVariant[product.id] || (variantsList.length > 0 ? variantsList[0] : '');

                return (
                  <div key={product.id} className={`bg-white transition overflow-hidden border border-gray-200 flex flex-col justify-between ${cardRadius}`}>
                    <div>
                      <div className="relative h-52 bg-gray-100 overflow-hidden cursor-pointer group" onClick={() => setSelectedProductModal(product)}>
                        <img src={product.image} alt={product.title} className="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
                        {product.badge && (
                          <span style={{ backgroundColor: secondaryColor }} className="absolute top-3 left-3 text-black text-[10px] font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full shadow">
                            {product.badge}
                          </span>
                        )}
                        {product.video && (
                          <span style={{ backgroundColor: primaryColor }} className="absolute bottom-3 left-3 text-white text-[10px] px-2 py-0.5 rounded-md flex items-center gap-1 shadow">
                            <i className="fa-solid fa-video"></i> Video
                          </span>
                        )}
                        <span className={`absolute top-3 right-3 text-[10px] font-semibold px-2.5 py-0.5 rounded-full shadow ${
                          isAvailable ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'
                        }`}>
                          {isAvailable ? 'Disponible' : 'Agotado'}
                        </span>
                      </div>

                      <div className="p-5">
                        <div className="flex justify-between items-start">
                          <span style={{ color: primaryColor }} className="text-[10px] font-semibold uppercase tracking-widest">{product.category}</span>
                          <button onClick={() => handleShareProduct(product)} className="text-gray-400 hover:text-gray-600 text-xs">
                            <i className="fa-solid fa-share-nodes"></i>
                          </button>
                        </div>
                        <h3 className="font-serif text-base text-gray-800 mt-1 cursor-pointer hover:opacity-80 transition" onClick={() => setSelectedProductModal(product)}>
                          {product.title}
                        </h3>
                        {product.sku && <p className="text-[10px] text-gray-400 font-mono">SKU: {product.sku}</p>}
                        <p className="text-gray-500 text-xs mt-2 font-light line-clamp-2">{product.description}</p>
                      </div>
                    </div>

                    <div className="p-5 pt-0 space-y-3">
                      <div className="flex justify-between items-center">
                        <div>
                          <span style={{ color: primaryColor }} className="text-lg font-serif font-bold">${product.price.toLocaleString('es-AR')}</span>
                          {product.originalPrice && product.originalPrice > product.price && (
                            <span className="text-xs text-gray-400 line-through ml-2">${product.originalPrice.toLocaleString('es-AR')}</span>
                          )}
                        </div>
                        <button onClick={() => handleSingleProductWhatsApp(product)} style={{ color: primaryColor }} className="hover:opacity-80 text-xs font-semibold flex items-center gap-1 bg-gray-100 px-2.5 py-1.5 rounded-lg">
                          <i className="fa-brands fa-whatsapp text-sm"></i> Consultar
                        </button>
                      </div>

                      {hasVariants && (
                        <div className="space-y-1">
                          <label className="block text-[11px] font-semibold text-gray-700">{product.variantsLabel || 'Variante'}:</label>
                          <select 
                            value={activeVariant}
                            onChange={(e) => handleVariantSelect(product.id, e.target.value)}
                            className="w-full p-2 bg-gray-100 border border-gray-200 rounded-xl text-xs text-gray-700"
                          >
                            {variantsList.map((v, idx) => (<option key={idx} value={v}>{v}</option>))}
                          </select>
                        </div>
                      )}

                      {isAvailable ? (
                        <div className="flex items-center justify-between bg-gray-100 p-1 rounded-xl border border-gray-200">
                          <div className="flex items-center gap-2 px-2">
                            <span className="text-[11px] text-gray-500">Cant:</span>
                            <button onClick={() => handleQtyChange(product.id, -1)} className="w-6 h-6 bg-white rounded-md font-bold text-gray-600 shadow-xs">-</button>
                            <span className="text-xs font-bold w-4 text-center">{currentQty}</span>
                            <button onClick={() => handleQtyChange(product.id, 1)} className="w-6 h-6 bg-white rounded-md font-bold text-gray-600 shadow-xs">+</button>
                          </div>
                          <button onClick={() => addToCart(product)} style={{ backgroundColor: primaryColor }} className="text-white px-3 py-1.5 rounded-lg font-medium text-xs shadow-xs hover:opacity-90">
                            Agregar
                          </button>
                        </div>
                      ) : (
                        <button disabled className="w-full bg-gray-200 text-gray-400 font-medium text-xs py-2 rounded-xl cursor-not-allowed">Agotado</button>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </main>

          {selectedProductModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4 backdrop-blur-xs">
              <div className="bg-white rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl border border-gray-200 max-h-[90vh] overflow-y-auto">
                {selectedProductModal.video ? (
                  <div className="relative bg-black">
                    <video src={selectedProductModal.video} controls autoPlay className="w-full h-64 object-contain"></video>
                    <button onClick={() => setSelectedProductModal(null)} className="absolute top-3 right-3 bg-black/60 text-white w-8 h-8 rounded-full flex items-center justify-center">
                      <i className="fa-solid fa-xmark"></i>
                    </button>
                  </div>
                ) : (
                  <div className="relative h-64 bg-gray-100">
                    <img src={selectedProductModal.image} alt={selectedProductModal.title} className="w-full h-full object-cover" />
                    <button onClick={() => setSelectedProductModal(null)} className="absolute top-3 right-3 bg-black/60 text-white w-8 h-8 rounded-full flex items-center justify-center">
                      <i className="fa-solid fa-xmark"></i>
                    </button>
                  </div>
                )}

                <div className="p-6 space-y-4">
                  <span style={{ color: primaryColor }} className="text-[10px] font-semibold uppercase tracking-widest">{selectedProductModal.category}</span>
                  <h3 className="text-xl font-serif font-bold text-gray-800">{selectedProductModal.title}</h3>
                  <p style={{ color: primaryColor }} className="text-2xl font-serif font-bold">${selectedProductModal.price.toLocaleString('es-AR')}</p>
                  <p className="text-xs text-gray-600 font-light leading-relaxed">{selectedProductModal.description}</p>
                  
                  <div className="border-t pt-4 flex gap-3">
                    <button onClick={() => { handleSingleProductWhatsApp(selectedProductModal); setSelectedProductModal(null); }} className="flex-1 bg-emerald-700 text-white text-xs font-medium py-3 rounded-xl flex items-center justify-center gap-2">
                      <i className="fa-brands fa-whatsapp"></i> Consultar WhatsApp
                    </button>
                    <button onClick={() => { addToCart(selectedProductModal); setSelectedProductModal(null); }} style={{ backgroundColor: primaryColor }} className="flex-1 text-white text-xs font-medium py-3 rounded-xl flex items-center justify-center gap-2">
                      <i className="fa-solid fa-bag-shopping"></i> Agregar
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          <div className="fixed bottom-6 right-6 flex flex-col gap-3 z-40">
            <button 
              onClick={() => setIsAiChatOpen(!isAiChatOpen)}
              style={{ backgroundColor: secondaryColor }}
              className="text-black w-14 h-14 rounded-full flex items-center justify-center shadow-2xl transition transform hover:scale-105 border-2 border-white"
              title="Asistente Virtual IA"
            >
              <i className="fa-solid fa-robot text-2xl"></i>
            </button>
            <a href={`https://wa.me/${config.whatsappNumber}`} target="_blank" rel="noopener noreferrer" style={{ backgroundColor: primaryColor }} className="text-white w-14 h-14 rounded-full flex items-center justify-center shadow-2xl transition transform hover:scale-105 border-2 border-white">
              <i className="fa-brands fa-whatsapp text-3xl"></i>
            </a>
          </div>

          {isAiChatOpen && (
            <div className="fixed bottom-24 right-6 w-80 sm:w-96 bg-white rounded-2xl shadow-2xl border border-gray-200 z-50 overflow-hidden flex flex-col h-96">
              <div style={{ backgroundColor: headerBg }} className="p-3 text-white flex justify-between items-center border-b border-white/10">
                <div className="flex items-center gap-2">
                  <i style={{ color: secondaryColor }} className="fa-solid fa-robot text-lg"></i>
                  <div>
                    <h4 className="text-xs font-bold">Asistente IA - L&V HOGAR</h4>
                    <p className="text-[9px] text-gray-300">Responde consultas al instante</p>
                  </div>
                </div>
                <button onClick={() => setIsAiChatOpen(false)} className="text-gray-400 hover:text-white">
                  <i className="fa-solid fa-xmark text-sm"></i>
                </button>
              </div>

              <div className="p-3 flex-grow overflow-y-auto space-y-2 text-xs bg-gray-50">
                {aiMessages.map((msg, idx) => (
                  <div key={idx} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                    <div className={`p-2.5 rounded-xl max-w-[80%] whitespace-pre-line ${
                      msg.sender === 'user' ? 'bg-[#768C77] text-white rounded-br-none' : 'bg-white border text-gray-800 shadow-xs rounded-bl-none'
                    }`}>
                      {msg.text}
                    </div>
                  </div>
                ))}
                {isAiLoading && (
                  <div className="flex justify-start">
                    <div className="bg-white p-2.5 rounded-xl border text-gray-400 text-xs flex items-center gap-1">
                      <i className="fa-solid fa-spinner animate-spin"></i> Pensando respuesta...
                    </div>
                  </div>
                )}
              </div>

              <form onSubmit={handleSendAiMessage} className="p-2 bg-white border-t flex gap-1">
                <input 
                  type="text" 
                  placeholder="Pregunta sobre productos o envíos..." 
                  value={aiInput} 
                  onChange={e => setAiInput(e.target.value)} 
                  className="flex-grow p-2 border rounded-xl text-xs bg-gray-50 focus:outline-none"
                />
                <button type="submit" style={{ backgroundColor: primaryColor }} className="text-white px-3 py-2 rounded-xl text-xs">
                  <i className="fa-solid fa-paper-plane"></i>
                </button>
              </form>
            </div>
          )}

          {isCartOpen && (
            <div className="fixed inset-0 z-50 flex justify-end bg-black/40 backdrop-blur-xs">
              <div className="bg-white w-full max-w-md h-full flex flex-col justify-between shadow-2xl p-6 overflow-y-auto">
                <div>
                  <div className="flex justify-between items-center pb-4 border-b">
                    <h3 className="font-serif text-lg text-gray-800 flex items-center gap-2">
                      <i style={{ color: primaryColor }} className="fa-solid fa-bag-shopping"></i> Carrito de Compras
                    </h3>
                    <button onClick={() => setIsCartOpen(false)} className="text-gray-400 hover:text-gray-600">
                      <i className="fa-solid fa-xmark text-lg"></i>
                    </button>
                  </div>

                  {cart.length === 0 ? (
                    <div className="text-center py-12 text-gray-400">Tu carrito está vacío.</div>
                  ) : (
                    <div className="divide-y my-4 max-h-40 overflow-y-auto pr-1">
                      {cart.map(item => (
                        <div key={item.cartItemId} className="py-3 flex items-center justify-between text-xs">
                          <div className="flex items-center gap-3">
                            <img src={item.image} alt={item.title} className="w-12 h-12 object-cover rounded-xl" />
                            <div>
                              <p className="font-serif font-bold text-gray-800">{item.title}</p>
                              {item.selectedVariant && <p className="text-[10px] text-gray-500">Opción: {item.selectedVariant}</p>}
                              <p className="text-gray-500">${item.price.toLocaleString('es-AR')}</p>
                            </div>
                          </div>
                          <div className="flex items-center gap-2">
                            <button onClick={() => updateQty(item.cartItemId, -1)} className="bg-gray-100 px-2 py-0.5 rounded font-bold">-</button>
                            <span className="font-bold">{item.qty}</span>
                            <button onClick={() => updateQty(item.cartItemId, 1)} className="bg-gray-100 px-2 py-0.5 rounded font-bold">+</button>
                            <button onClick={() => removeFromCart(item.cartItemId)} className="text-red-400 hover:text-red-600 ml-2"><i className="fa-solid fa-trash-can"></i></button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {cart.length > 0 && (
                  <div className="border-t pt-3 space-y-2.5 text-xs">
                    <div>
                      <label className="block font-semibold text-gray-700 mb-1">Método de Entrega:</label>
                      <div className="grid grid-cols-2 gap-2">
                        <button type="button" onClick={() => setFulfillmentType('delivery')} className={`p-2 rounded-xl border text-[11px] font-medium transition ${fulfillmentType === 'delivery' ? 'bg-gray-100 border-gray-400 font-bold' : 'border-gray-200'}`}>🚚 Envío a Domicilio</button>
                        <button type="button" onClick={() => setFulfillmentType('pickup')} className={`p-2 rounded-xl border text-[11px] font-medium transition ${fulfillmentType === 'pickup' ? 'bg-gray-100 border-gray-400 font-bold' : 'border-gray-200'}`}>🏪 Retiro en Local</button>
                      </div>
                    </div>

                    {fulfillmentType === 'delivery' && (
                      <>
                        <div>
                          <label className="block font-semibold text-gray-700 mb-1">Zona de Envío:</label>
                          <select value={selectedDeliveryZone} onChange={(e) => setSelectedDeliveryZone(Number(e.target.value))} className="w-full p-2 border rounded-xl bg-gray-100">
                            {config.deliveryZones && config.deliveryZones.map((zone, idx) => (
                              <option key={idx} value={idx}>{zone.name} - ${zone.price.toLocaleString('es-AR')}</option>
                            ))}
                          </select>
                        </div>
                        <div>
                          <label className="block font-semibold text-gray-700 mb-1">Dirección de Entrega: <span className="text-red-500">*</span></label>
                          <input type="text" placeholder="Calle, Número, Barrio..." value={clientAddress} onChange={(e) => { setClientAddress(e.target.value); if(e.target.value.trim()) setAddressError(false); }} className={`w-full p-2 border rounded-xl bg-gray-100 ${addressError ? 'border-red-500' : 'border-gray-200'}`} />
                        </div>
                      </>
                    )}

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block font-semibold text-gray-700 mb-1">DNI (Opcional):</label>
                        <input type="text" placeholder="Ej: 35123456" value={clientDni} onChange={(e) => setClientDni(e.target.value)} className="w-full p-2 border rounded-xl bg-gray-100" />
                      </div>
                      <div>
                        <label className="block font-semibold text-gray-700 mb-1">Horario Preferido:</label>
                        <select value={preferredTime} onChange={(e) => setPreferredTime(e.target.value)} className="w-full p-2 border rounded-xl bg-gray-100">
                          <option value="Indistinto">Indistinto</option>
                          <option value="Mañana (9hs a 13hs)">Mañana (9hs a 13hs)</option>
                          <option value="Tarde (14hs a 18hs)">Tarde (14hs a 18hs)</option>
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="block font-semibold text-gray-700 mb-1">Medio de Pago:</label>
                      <select value={paymentMethodSelected} onChange={(e) => setPaymentMethodSelected(e.target.value)} className="w-full p-2 border rounded-xl bg-gray-100">
                        <option value="Efectivo contra entrega">Efectivo contra entrega</option>
                        <option value="Transferencia Bancaria / Alias">Transferencia Bancaria / Alias</option>
                        <option value="Mercado Pago">Mercado Pago</option>
                      </select>
                    </div>

                    <div className="bg-gray-100 p-2.5 rounded-xl space-y-1">
                      <div className="flex justify-between text-gray-600"><span>Subtotal:</span><span>${getSubtotal().toLocaleString('es-AR')}</span></div>
                      <div className="flex justify-between text-gray-600"><span>Envío:</span><span>${getDeliveryCost().toLocaleString('es-AR')}</span></div>
                      <div style={{ color: primaryColor }} className="flex justify-between font-serif font-bold border-t pt-1"><span>Total:</span><span>${getTotal().toLocaleString('es-AR')}</span></div>
                    </div>

                    <button onClick={handleCheckoutWhatsApp} style={{ backgroundColor: primaryColor }} className="w-full text-white font-medium py-2.5 rounded-xl flex items-center justify-center gap-2 shadow">
                      <i className="fa-brands fa-whatsapp text-lg"></i> Confirmar Pedido por WhatsApp
                    </button>
                    <button onClick={handleCopyOrder} className="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-2 rounded-xl flex items-center justify-center gap-2 border">
                      <i className="fa-solid fa-copy"></i> {copySuccess ? '¡Copiado!' : 'Copiar Resumen'}
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          <footer style={{ backgroundColor: headerBg }} className="text-gray-400 py-8 text-center text-xs mt-auto border-t border-white/10">
            <p>© {new Date().getFullYear()} {config.storeName}. Todos los derechos reservados.</p>
            <a href="admin.html" className="text-gray-500 hover:text-white text-[10px] block mt-2">Acceso Administrador</a>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CatalogApp />);
  </script>
</body>
</html>
