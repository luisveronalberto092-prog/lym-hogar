<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L&V HOGAR - Tienda Oficial</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    h1, h2, h3, .font-serif-custom { font-family: 'Outfit', sans-serif; }
    .num-style { font-variant-numeric: tabular-nums; letter-spacing: -0.025em; }
  </style>
</head>
<body class="bg-[#FAFAF7] text-gray-800 relative min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const supabaseClient = supabase.createClient(
      "https://cleduaakmebcnldqeaoo.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsZWR1YWFrbWViY25sZHFlYW9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMjYxMzgsImV4cCI6MjEwODgwMjEzOH0.Wl1DsflvOJLNDCaCjdNyaGe91KpCH7zpqZGJVDOpH2s"
    );

    const categoriesList = ["Todos"].concat(
      JSON.parse(localStorage.getItem('lv_store_categories')) || ["Hogar", "Cuidado Personal", "Electrodomésticos", "Bazar y Cocina", "Aromas y Decoración", "Accesorios"]
    );

    const deliveryZones = [
      { name: "Malvinas Argentinas - 1ª Sección", price: 0 },
      { name: "Malvinas Argentinas - 2ª Sección", price: 500 },
      { name: "Malvinas Argentinas - 3ª Sección", price: 800 },
      { name: "Córdoba Capital (Otras zonas)", price: 1500 }
    ];

    function CatalogApp() {
      const [products, setProducts] = useState([]);
      const [loading, setLoading] = useState(true);
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [selectedCategory, setSelectedCategory] = useState('Todos');
      const [searchQuery, setSearchQuery] = useState('');
      
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [activeImageIndex, setActiveImageIndex] = useState(0);
      const [fullScreenImage, setFullScreenImage] = useState(null);
      
      const [quantities, setQuantities] = useState({});
      const [chosenVariant, setChosenVariant] = useState({});
      const [chosenColor, setChosenColor] = useState({});

      const [storeConfig] = useState(() => {
        return JSON.parse(localStorage.getItem('lv_store_design')) || {
          brandColor: '#768C77',
          headerBg: '#1C1F1D',
          bgLogoUrl: '',
          bgOpacity: 0.1,
          bgSize: 50,
          bgRepeat: 'no-repeat'
        };
      });

      const [fulfillmentType, setFulfillmentType] = useState('delivery');
      const [selectedDeliveryZone, setSelectedDeliveryZone] = useState(0);
      const [clientName, setClientName] = useState('');
      const [clientAddress, setClientAddress] = useState('');
      const [clientDni, setClientDni] = useState('');
      const [preferredTime, setPreferredTime] = useState('Indistinto');
      const [paymentMethod, setPaymentMethod] = useState('Efectivo contra entrega');

      const fetchProducts = async () => {
        const { data, error } = await supabaseClient.from('productos').select('*').order('id', { ascending: false });
        if (!error && data) {
          setProducts(data);
        }
        setLoading(false);
      };

      // Carga inicial y Suscripción en Tiempo Real con Supabase
      useEffect(() => {
        fetchProducts();
        const channel = supabaseClient
          .channel('public:productos')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'productos' }, () => {
            fetchProducts();
          })
          .subscribe();

        return () => {
          supabaseClient.removeChannel(channel);
        };
      }, []);

      const getCategoryIcon = (cat) => {
        const lower = cat.toLowerCase();
        if (lower.includes('todos')) return 'fa-border-all';
        if (lower.includes('hogar')) return 'fa-house-chimney';
        if (lower.includes('cuidado') || lower.includes('personal')) return 'fa-spa';
        if (lower.includes('electro')) return 'fa-bolt';
        if (lower.includes('bazar') || lower.includes('cocina')) return 'fa-utensils';
        if (lower.includes('aroma') || lower.includes('deco')) return 'fa-wand-magic-sparkles';
        if (lower.includes('accesorio')) return 'fa-gem';
        return 'fa-box-open';
      };

      const handleQtyChange = (productId, delta) => {
        setQuantities(prev => {
          const current = prev[productId] || 1;
          const updated = current + delta;
          return { ...prev, [productId]: updated > 0 ? updated : 1 };
        });
      };

      const addToCart = (product) => {
        const qtyToAdd = quantities[product.id] || 1;
        const variants = product.variants ? product.variants.split(',').map(v => v.trim()) : [];
        const colors = product.colors ? product.colors.split(',').map(c => c.trim()) : [];

        const selVar = variants.length > 0 ? (chosenVariant[product.id] || variants[0]) : '';
        const selCol = colors.length > 0 ? (chosenColor[product.id] || colors[0]) : '';

        const selectionText = [selVar, selCol].filter(Boolean).join(' / ');
        const cartItemId = selectionText ? `${product.id}-${selectionText}` : product.id;

        setCart(prev => {
          const exists = prev.find(item => item.cartItemId === cartItemId);
          if (exists) {
            return prev.map(item => item.cartItemId === cartItemId ? { ...item, qty: item.qty + qtyToAdd } : item);
          }
          return [...prev, { ...product, cartItemId, qty: qtyToAdd, selectedOptions: selectionText }];
        });
        setIsCartOpen(true);
      };

      const getSubtotal = () => cart.reduce((sum, item) => sum + (Number(item.price) * item.qty), 0);
      const getDeliveryCost = () => fulfillmentType === 'pickup' ? 0 : deliveryZones[selectedDeliveryZone].price;
      const getTotal = () => getSubtotal() + getDeliveryCost();

      const handleCheckoutWhatsApp = () => {
        if (cart.length === 0) return;
        if (!clientName.trim()) { alert('Por favor ingresá tu Nombre y Apellido.'); return; }
        if (fulfillmentType === 'delivery' && !clientAddress.trim()) { alert('Por favor ingresá tu Dirección de entrega.'); return; }

        let msg = `¡Hola L&V HOGAR! Quisiera realizar el siguiente pedido:\n\n👤 *Cliente:* ${clientName.trim()}\n`;
        if (clientDni.trim()) msg += `🆔 *DNI:* ${clientDni.trim()}\n`;
        
        msg += `\n🛒 *PRODUCTOS:*\n`;
        cart.forEach(item => {
          const optText = item.selectedOptions ? ` [${item.selectedOptions}]` : '';
          msg += `• ${item.title}${optText} x${item.qty} - $${(item.price * item.qty).toLocaleString('es-AR')}\n`;
        });

        msg += `\n💵 *Subtotal:* $${getSubtotal().toLocaleString('es-AR')}`;
        if (fulfillmentType === 'delivery') {
          const zone = deliveryZones[selectedDeliveryZone];
          msg += `\n🚚 *Envío:* ${zone.name} ($${zone.price.toLocaleString('es-AR')})`;
          msg += `\n📍 *Dirección:* ${clientAddress.trim()}`;
        } else {
          msg += `\n🏪 *Entrega:* Retiro en Local`;
        }

        msg += `\n⏰ *Horario:* ${preferredTime}`;
        msg += `\n💳 *Pago:* ${paymentMethod}`;
        msg += `\n\n💰 *TOTAL FINAL:* $${getTotal().toLocaleString('es-AR')}\n\n¿Me confirman la disponibilidad?`;

        window.open(`https://wa.me/5493512102238?text=${encodeURIComponent(msg)}`, '_blank');
      };

      const getProductImages = (p) => {
        if (!p) return [];
        const main = p.image || 'https://images.unsplash.com/photo-1583847268964-b28dc8f51f92?auto=format&fit=crop&w=600&q=80';
        const gal = (p.gallery && Array.isArray(p.gallery)) ? p.gallery : [];
        return [main, ...gal];
      };

      const filtered = products.filter(p => {
        const matchesCat = selectedCategory === 'Todos' || p.category === selectedCategory;
        const matchesSearch = p.title?.toLowerCase().includes(searchQuery.toLowerCase()) || p.description?.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCat && matchesSearch;
      });

      return (
        <div className="min-h-screen flex flex-col relative overflow-x-hidden">
          {storeConfig.bgLogoUrl && (
            <div 
              className="fixed inset-0 pointer-events-none z-0"
              style={{
                backgroundImage: `url(${storeConfig.bgLogoUrl})`,
                backgroundPosition: 'center',
                backgroundRepeat: storeConfig.bgRepeat || 'no-repeat',
                backgroundSize: storeConfig.bgRepeat === 'repeat' ? '150px' : `${storeConfig.bgSize || 50}%`,
                opacity: storeConfig.bgOpacity || 0.1
              }}
            />
          )}

          <div style={{ backgroundColor: storeConfig.brandColor || '#768C77' }} className="text-white text-[11px] py-2 px-4 text-center z-10 font-medium tracking-wide">
            📍 Malvinas Argentinas y Córdoba Capital | ⏰ Lun a Sáb: 9 a 20hs
          </div>

          <header style={{ backgroundColor: storeConfig.headerBg || '#1C1F1D' }} className="text-white py-4 px-6 md:px-10 flex justify-between items-center shadow-md sticky top-0 z-40 border-b border-white/10">
            <div>
              <h1 className="text-lg md:text-xl font-serif-custom font-bold tracking-widest text-white">L&V HOGAR</h1>
              <p className="text-[10px] text-[#C8B297] uppercase tracking-wider font-semibold">Artículos para el hogar y cuidado personal</p>
            </div>
            <button 
              onClick={() => setIsCartOpen(true)}
              style={{ backgroundColor: storeConfig.brandColor || '#768C77' }}
              className="text-white px-5 py-2.5 rounded-full text-xs font-semibold flex items-center gap-2.5 shadow hover:opacity-95 transition"
            >
              <i className="fa-solid fa-bag-shopping text-sm"></i> Carrito <span className="bg-white/20 px-2 py-0.5 rounded-full text-[11px] num-style">{cart.reduce((s, i) => s + i.qty, 0)}</span>
            </button>
          </header>

          <main className="max-w-7xl mx-auto px-4 py-8 flex-grow w-full z-10 relative">
            <div className="mb-8 space-y-3">
              <div className="flex justify-between items-center">
                <h2 className="font-serif-custom font-bold text-sm text-gray-700 tracking-wider uppercase">Categorías</h2>
                <input 
                  type="text" 
                  placeholder="Buscar producto..." 
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  className="w-48 sm:w-64 p-2.5 bg-white/90 backdrop-blur-xs border rounded-full text-xs shadow-xs focus:outline-none focus:ring-2 focus:ring-[#768C77]/30"
                />
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-7 gap-3">
                {categoriesList.map(cat => {
                  const isSelected = selectedCategory === cat;
                  return (
                    <button
                      key={cat}
                      onClick={() => setSelectedCategory(cat)}
                      style={{ 
                        backgroundColor: isSelected ? (storeConfig.brandColor || '#768C77') : 'white',
                        borderColor: isSelected ? (storeConfig.brandColor || '#768C77') : '#e5e7eb'
                      }}
                      className={`p-3.5 rounded-2xl border flex flex-col items-center justify-center gap-2 transition shadow-xs hover:shadow group ${
                        isSelected ? 'text-white scale-105 font-bold' : 'text-gray-700 hover:border-gray-400 font-medium'
                      }`}
                    >
                      <div className={`w-10 h-10 rounded-xl flex items-center justify-center text-base transition ${
                        isSelected ? 'bg-white/20 text-white' : 'bg-gray-100 text-[#768C77] group-hover:bg-[#768C77]/10'
                      }`}>
                        <i className={`fa-solid ${getCategoryIcon(cat)}`}></i>
                      </div>
                      <span className="text-xs text-center leading-tight">{cat}</span>
                    </button>
                  );
                })}
              </div>
            </div>

            {loading ? (
              <div className="text-center py-20 text-gray-400 text-sm">Cargando catálogo...</div>
            ) : filtered.length === 0 ? (
              <div className="text-center py-20 text-gray-400 text-sm">No se encontraron productos en esta categoría.</div>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                {filtered.map(p => {
                  const isAvailable = Number(p.stock) > 0;
                  const currentQty = quantities[p.id] || 1;
                  
                  const variants = p.variants ? p.variants.split(',').map(v => v.trim()) : [];
                  const colors = p.colors ? p.colors.split(',').map(c => c.trim()) : [];

                  const activeVar = chosenVariant[p.id] || variants[0];
                  const activeCol = chosenColor[p.id] || colors[0];

                  return (
                    <div key={p.id} className="bg-white/95 backdrop-blur-xs rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between hover:shadow-md transition">
                      <div>
                        <div 
                          className="h-52 bg-gray-100 relative cursor-pointer group overflow-hidden"
                          onClick={() => { setSelectedProduct(p); setActiveImageIndex(0); }}
                        >
                          <img src={p.image || 'https://images.unsplash.com/photo-1583847268964-b28dc8f51f92?auto=format&fit=crop&w=600&q=80'} className="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
                          <span className={`absolute top-3 right-3 text-[10px] font-bold px-2.5 py-1 rounded-full shadow backdrop-blur-md ${isAvailable ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-red-50 text-red-700 border border-red-200'}`}>
                            {isAvailable ? `Stock: ${p.stock}` : 'Agotado'}
                          </span>
                        </div>
                        <div className="p-5 pb-3">
                          <span style={{ color: storeConfig.brandColor || '#768C77' }} className="text-[10px] font-bold uppercase tracking-wider">{p.category}</span>
                          <h3 className="font-serif-custom text-base font-bold text-gray-800 mt-1 cursor-pointer hover:underline line-clamp-1" onClick={() => { setSelectedProduct(p); setActiveImageIndex(0); }}>{p.title}</h3>
                          <p className="text-gray-500 text-xs mt-1.5 line-clamp-2 leading-relaxed font-light">{p.description}</p>
                        </div>
                      </div>

                      <div className="p-5 pt-0 space-y-3">
                        <div className="flex justify-between items-center pt-2 border-t border-gray-50">
                          <span style={{ color: storeConfig.brandColor || '#768C77' }} className="text-lg font-serif-custom font-bold num-style">${Number(p.price).toLocaleString('es-AR')}</span>
                          <button onClick={() => { setSelectedProduct(p); setActiveImageIndex(0); }} className="text-xs text-gray-400 hover:text-gray-700 underline font-medium">Ver detalle</button>
                        </div>

                        {variants.length > 0 && (
                          <select value={activeVar} onChange={e => setChosenVariant({...chosenVariant, [p.id]: e.target.value})} className="w-full p-2 bg-gray-50 border rounded-xl text-xs font-medium text-gray-700">
                            {variants.map((v, i) => <option key={i} value={v}>Talle: {v}</option>)}
                          </select>
                        )}

                        {colors.length > 0 && (
                          <select value={activeCol} onChange={e => setChosenColor({...chosenColor, [p.id]: e.target.value})} className="w-full p-2 bg-gray-50 border rounded-xl text-xs font-medium text-gray-700">
                            {colors.map((c, i) => <option key={i} value={c}>Color: {c}</option>)}
                          </select>
                        )}

                        {isAvailable ? (
                          <div className="flex items-center justify-between bg-gray-50 p-1 rounded-xl border border-gray-200">
                            <div className="flex items-center gap-2 px-2">
                              <button onClick={() => handleQtyChange(p.id, -1)} className="w-6 h-6 bg-white shadow-xs rounded font-bold num-style">-</button>
                              <span className="text-xs font-bold w-4 text-center num-style">{currentQty}</span>
                              <button onClick={() => handleQtyChange(p.id, 1)} className="w-6 h-6 bg-white shadow-xs rounded font-bold num-style">+</button>
                            </div>
                            <button onClick={() => addToCart(p)} style={{ backgroundColor: storeConfig.brandColor || '#768C77' }} className="text-white px-3.5 py-2 rounded-lg text-xs font-semibold shadow-xs hover:opacity-95 transition">Agregar</button>
                          </div>
                        ) : (
                          <button disabled className="w-full bg-gray-100 text-gray-400 py-2.5 rounded-xl text-xs font-medium cursor-not-allowed">Agotado</button>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </main>

          {selectedProduct && (() => {
            const productImages = getProductImages(selectedProduct);
            const currentImg = productImages[activeImageIndex] || selectedProduct.image;
            
            const variants = selectedProduct.variants ? selectedProduct.variants.split(',').map(v => v.trim()) : [];
            const colors = selectedProduct.colors ? selectedProduct.colors.split(',').map(c => c.trim()) : [];

            const activeVar = chosenVariant[selectedProduct.id] || variants[0];
            const activeCol = chosenColor[selectedProduct.id] || colors[0];

            return (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4 overflow-y-auto backdrop-blur-xs">
                <div className="bg-white rounded-3xl max-w-2xl w-full overflow-hidden shadow-2xl my-auto flex flex-col md:flex-row border border-white/20">
                  <div className="w-full md:w-1/2 bg-black p-4 flex flex-col justify-center items-center relative">
                    <div className="h-72 w-full flex items-center justify-center relative group">
                      <img src={currentImg} className="max-h-full max-w-full object-contain cursor-zoom-in" onClick={() => setFullScreenImage(currentImg)} />
                      
                      {productImages.length > 1 && (
                        <button onClick={(e) => { e.stopPropagation(); setActiveImageIndex(prev => (prev === 0 ? productImages.length - 1 : prev - 1)); }} className="absolute left-2 bg-black/60 text-white w-8 h-8 rounded-full flex items-center justify-center"><i className="fa-solid fa-chevron-left text-xs"></i></button>
                      )}
                      {productImages.length > 1 && (
                        <button onClick={(e) => { e.stopPropagation(); setActiveImageIndex(prev => (prev === productImages.length - 1 ? 0 : prev + 1)); }} className="absolute right-2 bg-black/60 text-white w-8 h-8 rounded-full flex items-center justify-center"><i className="fa-solid fa-chevron-right text-xs"></i></button>
                      )}
                    </div>
                  </div>

                  <div className="w-full md:w-1/2 p-6 md:p-8 flex flex-col justify-between bg-white">
                    <div>
                      <div className="flex justify-between items-start">
                        <div>
                          <span style={{ color: storeConfig.brandColor || '#768C77' }} className="text-[10px] font-bold uppercase tracking-wider">{selectedProduct.category}</span>
                          <h3 className="text-xl font-serif-custom font-bold text-gray-900 mt-1">{selectedProduct.title}</h3>
                        </div>
                        <button onClick={() => setSelectedProduct(null)} className="text-gray-400 hover:text-black w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center"><i className="fa-solid fa-xmark"></i></button>
                      </div>
                      <p style={{ color: storeConfig.brandColor || '#768C77' }} className="text-2xl font-serif-custom font-bold mt-3 num-style">${Number(selectedProduct.price).toLocaleString('es-AR')}</p>
                      <p className="text-xs text-gray-600 mt-4 leading-relaxed font-light">{selectedProduct.description}</p>
                    </div>

                    <div className="mt-8 pt-4 border-t border-gray-100 space-y-2">
                      <button onClick={() => { addToCart(selectedProduct); setSelectedProduct(null); }} style={{ backgroundColor: storeConfig.brandColor || '#768C77' }} className="w-full text-white py-3 rounded-xl text-xs font-bold shadow-md hover:opacity-95 transition">
                        Agregar al Carrito
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            );
          })()}

          {fullScreenImage && (
            <div className="fixed inset-0 z-50 bg-black/95 flex items-center justify-center p-4 cursor-zoom-out backdrop-blur-xs" onClick={() => setFullScreenImage(null)}>
              <img src={fullScreenImage} className="max-h-full max-w-full object-contain rounded-2xl shadow-2xl" />
            </div>
          )}

          <a href="https://wa.me/5493512102238?text=¡Hola%20L&V%20HOGAR!%20Tengo%20una%20consulta." target="_blank" rel="noopener noreferrer" className="fixed bottom-6 right-6 z-40 bg-[#25D366] text-white w-14 h-14 rounded-full flex items-center justify-center shadow-2xl hover:scale-110 transition">
            <i className="fa-brands fa-whatsapp text-3xl"></i>
          </a>

          {isCartOpen && (
            <div className="fixed inset-0 z-50 flex justify-end bg-black/50 backdrop-blur-xs">
              <div className="bg-white w-full max-w-md h-full flex flex-col justify-between shadow-2xl p-6 overflow-y-auto">
                <div>
                  <div className="flex justify-between items-center pb-4 border-b">
                    <h3 className="font-serif-custom text-lg font-bold text-gray-800">Tu Pedido</h3>
                    <button onClick={() => setIsCartOpen(false)} className="text-gray-400 hover:text-black w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center"><i className="fa-solid fa-xmark"></i></button>
                  </div>

                  {cart.length === 0 ? (
                    <div className="text-center py-16 text-gray-400 text-xs font-medium">Tu carrito está vacío.</div>
                  ) : (
                    <div className="divide-y my-4 max-h-48 overflow-y-auto">
                      {cart.map(item => (
                        <div key={item.cartItemId} className="py-3 flex items-center justify-between text-xs">
                          <div className="flex items-center gap-3">
                            <img src={item.image} className="w-12 h-12 object-cover rounded-xl border shadow-xs" />
                            <div>
                              <p className="font-bold text-gray-800">{item.title}</p>
                              <p className="text-gray-500 num-style">${Number(item.price).toLocaleString('es-AR')} x {item.qty}</p>
                            </div>
                          </div>
                          <button onClick={() => setCart(cart.filter(i => i.cartItemId !== item.cartItemId))} className="text-red-400 hover:text-red-600 p-2"><i className="fa-solid fa-trash-can"></i></button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {cart.length > 0 && (
                  <div className="border-t pt-4 space-y-3 text-xs">
                    <div>
                      <label className="block font-semibold mb-1 text-gray-700">Nombre y Apellido: <span className="text-red-500">*</span></label>
                      <input type="text" placeholder="Tu nombre..." value={clientName} onChange={e => setClientName(e.target.value)} className="w-full p-2.5 border rounded-xl bg-gray-50" />
                    </div>
                    <div>
                      <label className="block font-semibold mb-1 text-gray-700">Dirección: <span className="text-red-500">*</span></label>
                      <input type="text" placeholder="Calle, Número, Barrio..." value={clientAddress} onChange={e => setClientAddress(e.target.value)} className="w-full p-2.5 border rounded-xl bg-gray-50" />
                    </div>

                    <div className="bg-gray-50 p-3 rounded-xl border space-y-1 num-style">
                      <div className="flex justify-between font-bold text-sm text-[#768C77]"><span>Total:</span><span>${getTotal().toLocaleString('es-AR')}</span></div>
                    </div>

                    <button onClick={handleCheckoutWhatsApp} style={{ backgroundColor: storeConfig.brandColor || '#768C77' }} className="w-full text-white py-3 rounded-xl font-bold shadow flex items-center justify-center gap-2 hover:opacity-95 transition">
                      <i className="fa-brands fa-whatsapp text-base"></i> Confirmar Pedido por WhatsApp
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}
