<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L&V HOGAR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#FAFAF7] text-gray-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const supabaseClient = supabase.createClient(
      "https://cleduaakmebcnldqeaoo.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsZWR1YWFrbWViY25sZHFlYW9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMjYxMzgsImV4cCI6MjEwODgwMjEzOH0.Wl1DsflvOJLNDCaCjdNyaGe91KpCH7zpqZGJVDOpH2s"
    );

    function App() {
      const [products, setProducts] = useState([]);
      const [loading, setLoading] = useState(true);
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [fullImg, setFullImg] = useState(null);

      useEffect(() => {
        supabaseClient.from('productos').select('*').then(({ data }) => {
          setProducts(data || []);
          setLoading(false);
        });
      }, []);

      return (
        <div className="min-h-screen flex flex-col">
          <header className="bg-[#1C1F1D] text-white p-4 flex justify-between items-center">
            <h1 className="font-serif text-lg tracking-widest">L&V HOGAR</h1>
            <a href="admin.html" className="text-xs text-[#C8B297] underline">Admin</a>
          </header>

          <main className="max-w-6xl mx-auto p-4 flex-grow w-full">
            <h2 className="text-sm font-bold uppercase text-gray-500 mb-4">Catálogo de Productos</h2>

            {loading ? (
              <p className="text-center py-10 text-gray-400">Cargando...</p>
            ) : products.length === 0 ? (
              <p className="text-center py-10 text-gray-400">No hay productos cargados.</p>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                {products.map(p => (
                  <div key={p.id} className="bg-white rounded-xl shadow border p-3 flex flex-col justify-between">
                    <div>
                      <div 
                        className="h-48 bg-gray-100 rounded-lg overflow-hidden cursor-pointer relative"
                        onClick={() => setSelectedProduct(p)}
                      >
                        <img src={p.image} className="w-full h-full object-cover" />
                        <span className="absolute bottom-2 right-2 bg-black/60 text-white text-[10px] px-2 py-1 rounded">Ver Detalle</span>
                      </div>
                      <h3 className="font-serif font-bold mt-2 text-sm">{p.title}</h3>
                      <p className="text-xs text-gray-500 line-clamp-2">{p.description}</p>
                    </div>
                    <div className="mt-4 flex justify-between items-center">
                      <span className="font-bold text-[#768C77]">${Number(p.price).toLocaleString('es-AR')}</span>
                      <button onClick={() => setSelectedProduct(p)} className="bg-[#768C77] text-white text-xs px-3 py-1.5 rounded-lg">Ver</button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </main>

          {/* Modal Detalle */}
          {selectedProduct && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 relative max-h-[90vh] overflow-y-auto">
                <button onClick={() => setSelectedProduct(null)} className="absolute top-4 right-4 text-gray-400 hover:text-black"><i className="fa-solid fa-xmark text-lg"></i></button>
                <div className="h-64 bg-black rounded-lg overflow-hidden cursor-pointer flex items-center justify-center mb-4" onClick={() => setFullImg(selectedProduct.image)}>
                  <img src={selectedProduct.image} className="max-h-full max-w-full object-contain" />
                </div>
                <h3 className="font-serif text-xl font-bold">{selectedProduct.title}</h3>
                <p className="text-lg font-bold text-[#768C77] mt-1">${Number(selectedProduct.price).toLocaleString('es-AR')}</p>
                <p className="text-xs text-gray-600 mt-3">{selectedProduct.description}</p>
              </div>
            </div>
          )}

          {/* Pantalla Completa */}
          {fullImg && (
            <div className="fixed inset-0 bg-black/95 flex items-center justify-center p-4 z-50 cursor-zoom-out" onClick={() => setFullImg(null)}>
              <img src={fullImg} className="max-h-full max-w-full object-contain rounded" />
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
