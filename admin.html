<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - L&V HOGAR</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Playfair Display', 'serif'],
            sans: ['Montserrat', 'sans-serif'],
            poppins: ['Poppins', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#FAFAF7] text-gray-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyDemoKeyForLyVHogarSync2026",
      authDomain: "lyv-hogar.firebaseapp.com",
      projectId: "lyv-hogar",
      storageBucket: "lyv-hogar.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:demo"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    const DEFAULT_CONFIG = {
      storeName: "L&V HOGAR",
      storeSubtitle: "Artículos para el hogar y cuidado personal",
      whatsappNumber: "5493512102238",
      whatsappMsg: "¡Hola L&V HOGAR! Quisiera realizar la siguiente compra:\n\n",
      showBanner: true,
      bannerTitle: "Renueva tu Hogar con Estilo y Calidez",
      bannerText: "Envíos locales a domicilio y atención personalizada por WhatsApp.",
      paymentMethods: "Efectivo contra entrega, Transferencia bancaria (Alias: lvhogar.mp) y Mercado Pago.",
      brandColor: "#768C77",
      secondaryColor: "#C8B297",
      bgColor: "#FAFAF7",
      headerBg: "#1C1F1D",
      cardStyle: "rounded",
      fontFamily: "sans",
      bgImage: "",
      adminPassword: "admin123",
      secretRecoveryKey: "cordoba2026",
      aiApiKey: "",
      categories: ["Hogar", "Cuidado Personal", "Electrodomésticos", "Bazar y Cocina", "Aromas y Decoración", "Accesorios"],
      deliveryZones: [
        { name: "Malvinas Argentinas - 1ª Sección", price: 0 },
        { name: "Malvinas Argentinas - 2ª Sección", price: 500 },
        { name: "Malvinas Argentinas - 3ª Sección", price: 800 },
        { name: "Córdoba Capital (Otras zonas)", price: 1500 }
      ]
    };

    function AdminApp() {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [user, setUser] = useState('');
      const [pass, setPass] = useState('');
      const [error, setError] = useState('');
      const [tab, setTab] = useState('products');

      const [isRecovering, setIsRecovering] = useState(false);
      const [recoveryStep, setRecoveryStep] = useState(1);
      const [recoverySecretInput, setRecoverySecretInput] = useState('');
      const [newPasswordInput, setNewPasswordInput] = useState('');
      const [recoveryMsg, setRecoveryMsg] = useState('');

      const [config, setConfig] = useState(() => JSON.parse(localStorage.getItem('lv_config')) || DEFAULT_CONFIG);
      const [products, setProducts] = useState(() => JSON.parse(localStorage.getItem('lv_products')) || []);
      
      const [newProd, setNewProd] = useState({ 
        sku: '', title: '', price: '', originalPrice: '', stock: '', category: 'Hogar', image: '', video: '', description: '', badge: '', variantsLabel: 'Color', variants: '' 
      });
      const [newCategoryInput, setNewCategoryInput] = useState('');
      const [savedMessage, setSavedMessage] = useState('');
      const [isGeneratingAi, setIsGeneratingAi] = useState(false);

      const [currentPassChange, setCurrentPassChange] = useState('');
      const [newPassChange, setNewPassChange] = useState('');
      const [passChangeMsg, setPassChangeMsg] = useState('');

      useEffect(() => {
        const unsubscribeConfig = db.collection('settings').doc('general_config')
          .onSnapshot((doc) => {
            if (doc.exists) {
              const data = doc.data();
              setConfig(data);
              localStorage.setItem('lv_config', JSON.stringify(data));
            }
          });

        const unsubscribeProducts = db.collection('products')
          .onSnapshot((snapshot) => {
            const list = [];
            snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
            setProducts(list);
            localStorage.setItem('lv_products', JSON.stringify(list));
          });

        return () => {
          unsubscribeConfig();
          unsubscribeProducts();
        };
      }, []);

      const saveConfigToFirestore = (updatedConfig) => {
        setConfig(updatedConfig);
        localStorage.setItem('lv_config', JSON.stringify(updatedConfig));
        db.collection('settings').doc('general_config').set(updatedConfig, { merge: true });
      };

      const primaryColor = config.brandColor || '#768C77';

      const handleGenerateAiDescription = () => {
        if (!newProd.title.trim()) {
          alert('Por favor escribe primero el título del producto.');
          return;
        }

        setIsGeneratingAi(true);

        setTimeout(() => {
          const autoDesc = `${newProd.title} ideal para transformar tus espacios. Fabricado con materiales resistentes y de excelente terminación. Producto práctico, cómodo y perfecto para el uso diario en tu hogar u oficina. ¡Disponible para entrega en Malvinas Argentinas y Córdoba Capital!`;
          setNewProd(prev => ({ ...prev, description: autoDesc }));
          setIsGeneratingAi(false);
        }, 1000);
      };

      const handleGenerateWhatsAppPromo = (prod) => {
        const text = `🔥 *OFERTA IMPERDIBLE EN L&V HOGAR* 🔥\n\n✨ *${prod.title}*\n💰 Precio especial: *$${prod.price.toLocaleString('es-AR')}*\n\n📦 Envíos en Malvinas Argentinas y Córdoba Capital.\n\n📲 Pedilo directo haciendo clic acá:\nhttps://luisveronalberto092-prog.github.io/LyV-Hogar-admi/`;
        navigator.clipboard.writeText(text).then(() => {
          alert('¡Texto promocional para WhatsApp copiado al portapapeles!');
        });
      };

      const handleLogin = (e) => {
        e.preventDefault();
        const validPass = config.adminPassword || 'admin123';
        if (user === 'admin' && pass === validPass) {
          setIsAuthenticated(true);
        } else {
          setError('Usuario o contraseña incorrectos');
        }
      };

      const handleRecoverWhatsApp = () => {
        const text = `¡Hola! Necesito recuperar la contraseña de administrador de L&V HOGAR. Mi clave secreta es: ${config.secretRecoveryKey || 'cordoba2026'}`;
        window.open(`https://wa.me/${config.whatsappNumber}?text=${encodeURIComponent(text)}`, '_blank');
      };

      const handleRecoverSecretSubmit = (e) => {
        e.preventDefault();
        if (recoverySecretInput.trim() === (config.secretRecoveryKey || 'cordoba2026')) {
          setRecoveryStep(2);
          setRecoveryMsg('');
        } else {
          setRecoveryMsg('Clave secreta incorrecta.');
        }
      };

      const handleSaveNewPassword = (e) => {
        e.preventDefault();
        if (newPasswordInput.trim().length < 4) {
          setRecoveryMsg('La contraseña debe tener al menos 4 caracteres.');
          return;
        }
        saveConfigToFirestore({ ...config, adminPassword: newPasswordInput.trim() });
        setIsRecovering(false);
        setRecoveryStep(1);
        setNewPasswordInput('');
        setRecoverySecretInput('');
        alert('¡Contraseña actualizada con éxito! Ya puedes iniciar sesión.');
      };

      const handleChangePasswordInPanel = (e) => {
        e.preventDefault();
        const validPass = config.adminPassword || 'admin123';
        if (currentPassChange !== validPass) {
          setPassChangeMsg('La contraseña actual es incorrecta.');
          return;
        }
        if (newPassChange.trim().length < 4) {
          setPassChangeMsg('La nueva contraseña es muy corta.');
          return;
        }
        saveConfigToFirestore({ ...config, adminPassword: newPassChange.trim() });
        setCurrentPassChange('');
        setNewPassChange('');
        setPassChangeMsg('¡Contraseña modificada correctamente!');
        setTimeout(() => setPassChangeMsg(''), 4000);
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setNewProd(prev => ({ ...prev, image: reader.result }));
          reader.readAsDataURL(file);
        }
      };

      const handleAddProduct = (e) => {
        e.preventDefault();
        const created = { 
          ...newProd, 
          price: parseFloat(newProd.price), 
          originalPrice: newProd.originalPrice ? parseFloat(newProd.originalPrice) : null,
          stock: parseInt(newProd.stock),
          image: newProd.image || 'https://images.unsplash.com/photo-1583847268964-b28dc8f51f92?auto=format&fit=crop&w=600&q=80'
        };
        
        db.collection('products').add(created);
        setNewProd({ sku: '', title: '', price: '', originalPrice: '', stock: '', category: config.categories?.[0] || 'Hogar', image: '', video: '', description: '', badge: '', variantsLabel: 'Color', variants: '' });
      };

      const handleDelete = (id) => db.collection('products').doc(id).delete();
      const handleToggleStock = (p) => db.collection('products').doc(p.id).update({ stock: p.stock > 0 ? 0 : 10 });

      const handleAddCategory = () => {
        if (!newCategoryInput.trim()) return;
        const currentCats = config.categories || [];
        if (!currentCats.includes(newCategoryInput.trim())) {
          saveConfigToFirestore({ ...config, categories: [...currentCats, newCategoryInput.trim()] });
          setNewCategoryInput('');
        }
      };

      const handleRemoveCategory = (cat) => {
        saveConfigToFirestore({ ...config, categories: config.categories.filter(c => c !== cat) });
      };

      const handleSaveConfig = (e) => {
        e.preventDefault();
        saveConfigToFirestore(config);
        setSavedMessage('¡Diseño y configuración guardados en la nube con éxito!');
        setTimeout(() => setSavedMessage(''), 4000);
      };

      if (!isAuthenticated) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-gray-100">
            <div className="bg-white p-8 rounded-2xl shadow-lg border border-gray-200 w-full max-w-sm space-y-4">
              <div className="text-center mb-4">
                <div className="w-12 h-12 border rounded-full flex flex-col items-center justify-center mx-auto mb-2 bg-[#1C1F1D]">
                  <span className="font-serif font-bold text-[#768C77] text-sm">L&V</span>
                </div>
                <h2 className="text-xl font-serif text-gray-800">Panel Privado</h2>
                <p className="text-xs text-gray-500">L&V HOGAR Administración</p>
              </div>

              {!isRecovering ? (
                <form onSubmit={handleLogin} className="space-y-3">
                  {error && <p className="text-xs text-red-500 text-center bg-red-50 p-2 rounded">{error}</p>}
                  <div>
                    <label className="block text-xs font-semibold mb-1">Usuario</label>
                    <input type="text" value={user} onChange={e=>setUser(e.target.value)} className="w-full p-2.5 border rounded-xl text-xs bg-gray-50" required />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold mb-1">Contraseña</label>
                    <input type="password" value={pass} onChange={e=>setPass(e.target.value)} className="w-full p-2.5 border rounded-xl text-xs bg-gray-50" required />
                  </div>
                  <button type="submit" style={{ backgroundColor: primaryColor }} className="w-full text-white py-2.5 rounded-xl text-xs font-medium shadow">Ingresar</button>
                  <div className="text-center pt-2">
                    <button type="button" onClick={() => setIsRecovering(true)} className="text-[11px] text-gray-500 hover:underline">¿Olvidaste tu contraseña?</button>
                  </div>
                </form>
              ) : (
                <div className="space-y-3">
                  <h3 className="font-serif font-bold text-sm text-center">Recuperar Contraseña</h3>
                  {recoveryMsg && <p className="text-xs text-red-500 bg-red-50 p-2 rounded text-center">{recoveryMsg}</p>}

                  {recoveryStep === 1 ? (
                    <form onSubmit={handleRecoverSecretSubmit} className="space-y-3">
                      <p className="text-[11px] text-gray-600">Ingresa tu Clave Secreta de Recuperación o solicítala por WhatsApp:</p>
                      <input type="password" placeholder="Clave secreta" value={recoverySecretInput} onChange={e=>setRecoverySecretInput(e.target.value)} className="w-full p-2.5 border rounded-xl text-xs bg-gray-50" required />
                      <button type="submit" style={{ backgroundColor: primaryColor }} className="w-full text-white py-2 rounded-xl text-xs">Verificar Clave Secreta</button>
                      <button type="button" onClick={handleRecoverWhatsApp} className="w-full bg-emerald-600 text-white py-2 rounded-xl text-xs flex items-center justify-center gap-1"><i className="fa-brands fa-whatsapp"></i> Solicitar por WhatsApp</button>
                    </form>
                  ) : (
                    <form onSubmit={handleSaveNewPassword} className="space-y-3">
                      <p className="text-[11px] text-emerald-700 font-semibold">¡Clave verificada! Ingresa tu nueva contraseña:</p>
                      <input type="password" placeholder="Nueva contraseña" value={newPasswordInput} onChange={e=>setNewPasswordInput(e.target.value)} className="w-full p-2.5 border rounded-xl text-xs bg-gray-50" required />
                      <button type="submit" style={{ backgroundColor: primaryColor }} className="w-full text-white py-2 rounded-xl text-xs">Guardar Nueva Contraseña</button>
                    </form>
                  )}

                  <button type="button" onClick={() => { setIsRecovering(false); setRecoveryStep(1); }} className="w-full text-xs text-gray-500 hover:underline mt-2">Volver al inicio de sesión</button>
                </div>
              )}

              <a href="index.html" className="block text-center text-xs text-gray-400 hover:underline pt-2">Volver a la tienda</a>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col">
          <header className="bg-[#1C1F1D] text-white p-4 flex justify-between items-center text-xs border-b border-white/10">
            <div className="flex items-center space-x-2">
              <span className="font-serif font-bold text-[#C8B297] text-sm">L&V HOGAR</span>
              <span className="text-gray-400">| Panel de Administración</span>
            </div>
            <div className="flex gap-4">
              <a href="index.html" target="_blank" className="text-[#C8B297] hover:underline flex items-center gap-1">Ver Tienda <i className="fa-solid fa-external-link text-[10px]"></i></a>
              <button onClick={() => setIsAuthenticated(false)} className="text-red-400 hover:underline">Cerrar Sesión</button>
            </div>
          </header>

          <div className="bg-white border-b">
            <div className="max-w-6xl mx-auto px-4 flex space-x-4 text-xs font-medium">
              <button onClick={() => setTab('products')} style={tab === 'products' ? { borderColor: primaryColor, color: primaryColor } : {}} className={`py-3.5 px-3 border-b-2 flex items-center gap-2 ${tab === 'products' ? 'font-bold' : 'border-transparent text-gray-600'}`}>
                <i className="fa-solid fa-boxes-stacked"></i> Productos
              </button>
              <button onClick={() => setTab('design')} style={tab === 'design' ? { borderColor: primaryColor, color: primaryColor } : {}} className={`py-3.5 px-3 border-b-2 flex items-center gap-2 ${tab === 'design' ? 'font-bold' : 'border-transparent text-gray-600'}`}>
                <i className="fa-solid fa-palette"></i> Diseño Gráfico y Tienda
              </button>
              <button onClick={() => setTab('security')} style={tab === 'security' ? { borderColor: primaryColor, color: primaryColor } : {}} className={`py-3.5 px-3 border-b-2 flex items-center gap-2 ${tab === 'security' ? 'font-bold' : 'border-transparent text-gray-600'}`}>
                <i className="fa-solid fa-shield-halved"></i> Seguridad
              </button>
            </div>
          </div>

          <main className="max-w-6xl mx-auto p-6 w-full flex-grow">
            {savedMessage && (
              <div className="mb-4 p-3 bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs rounded-xl flex items-center gap-2">
                <i className="fa-solid fa-check-circle text-base"></i> {savedMessage}
              </div>
            )}

            {tab === 'products' && (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div className="bg-white p-5 rounded-2xl shadow-sm border space-y-3 text-xs">
                  <h3 className="font-serif font-bold text-sm">Agregar Producto</h3>
                  <form onSubmit={handleAddProduct} className="space-y-3">
                    <div className="grid grid-cols-3 gap-2">
                      <div className="col-span-2"><label className="block font-medium mb-1">Título</label><input type="text" value={newProd.title} onChange={e=>setNewProd({...newProd, title: e.target.value})} className="w-full p-2 border rounded-xl bg-gray-50" required /></div>
                      <div><label className="block font-medium mb-1">SKU</label><input type="text" value={newProd.sku} onChange={e=>setNewProd({...newProd, sku: e.target.value})} className="w-full p-2 border rounded-xl font-mono text-[11px] bg-gray-50" /></div>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div><label className="block font-medium mb-1">Categoría</label><select value={newProd.category} onChange={e=>setNewProd({...newProd, category: e.target.value})} className="w-full p-2 border rounded-xl bg-gray-50">{(config.categories || []).map(c=>(<option key={c} value={c}>{c}</option>))}</select></div>
                      <div><label className="block font-medium mb-1">Etiqueta</label><input type="text" placeholder="OFERTA" value={newProd.badge} onChange={e=>setNewProd({...newProd, badge: e.target.value})} className="w-full p-2 border rounded-xl bg-gray-50" /></div>
                    </div>
                    <div className="grid grid-cols-3 gap-2">
                      <div><label className="block font-medium mb-1">Precio ($)</label><input type="number" value={newProd.price} onChange={e=>setNewProd({...newProd, price: e.target.value})} className="w-full p-2 border rounded-xl font-bold bg-gray-50" required /></div>
                      <div><label className="block font-medium mb-1">Tachado</label><input type="number" value={newProd.originalPrice} onChange={e=>setNewProd({...newProd, originalPrice: e.target.value})} className="w-full p-2 border rounded-xl bg-gray-50" /></div>
                      <div><label className="block font-medium mb-1">Stock</label><input type="number" value={newProd.stock} onChange={e=>setNewProd({...newProd, stock: e.target.value})} className="w-full p-2 border rounded-xl bg-gray-50" required /></div>
                    </div>
                    <div className="bg-gray-50 p-3 rounded-xl border space-y-2">
                      <label className="block font-semibold">Variantes (Color/Talle):</label>
                      <div className="grid grid-cols-2 gap-2">
                        <input type="text" placeholder="Tipo (Color)" value={newProd.variantsLabel} onChange={e=>setNewProd({...newProd, variantsLabel: e.target.value})} className="w-full p-1.5 border rounded-lg bg-white text-[11px]" />
                        <input type="text" placeholder="Rojo, Azul" value={newProd.variants} onChange={e=>setNewProd({...newProd, variants: e.target.value})} className="w-full p-1.5 border rounded-lg bg-white text-[11px]" />
                      </div>
                    </div>
                    <div className="bg-gray-50 p-3 rounded-xl border space-y-1">
                      <label className="block font-semibold">Foto Principal:</label>
                      <input type="file" accept="image/*" onChange={handleImageUpload} className="w-full text-xs text-gray-500 file:mr-4 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-gray-700 file:text-white cursor-pointer" />
                      <input type="text" placeholder="O URL de imagen..." value={newProd.image.startsWith('data:') ? '' : newProd.image} onChange={e=>setNewProd({...newProd, image: e.target.value})} className="w-full p-1.5 border rounded-lg bg-white text-[11px] mt-1" />
                    </div>
                    
                    <div>
                      <div className="flex justify-between items-center mb-1">
                        <label className="font-medium">Descripción</label>
                        <button 
                          type="button" 
                          onClick={handleGenerateAiDescription} 
                          disabled={isGeneratingAi}
                          className="text-[10px] text-amber-700 bg-amber-100 hover:bg-amber-200 px-2 py-0.5 rounded-md font-semibold flex items-center gap-1"
                        >
                          <i className="fa-solid fa-wand-magic-sparkles"></i> {isGeneratingAi ? 'Redactando...' : 'Redactar con IA'}
                        </button>
                      </div>
                      <textarea value={newProd.description} onChange={e=>setNewProd({...newProd, description: e.target.value})} className="w-full p-2 border rounded-xl h-20 bg-gray-50"></textarea>
                    </div>

                    <button type="submit" style={{ backgroundColor: primaryColor }} className="w-full text-white font-medium py-2.5 rounded-xl shadow">Guardar Producto</button>
                  </form>
                </div>

                <div className="bg-white p-5 rounded-2xl shadow-sm border space-y-3 text-xs md:col-span-2">
                  <h3 className="font-serif font-bold text-sm">Inventario ({products.length})</h3>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse">
                      <thead>
                        <tr className="border-b bg-gray-50 text-gray-600">
                          <th className="p-2.5">Foto</th><th className="p-2.5">SKU</th><th className="p-2.5">Producto</th><th className="p-2.5">Precio</th><th className="p-2.5">Estado</th><th className="p-2.5 text-right">Acciones</th>
                        </tr>
                      </thead>
                      <tbody>
                        {products.map(p => (
                          <tr key={p.id} className="border-b hover:bg-gray-50">
                            <td className="p-2.5"><img src={p.image} className="w-10 h-10 object-cover rounded-lg border" /></td>
                            <td className="p-2.5 font-mono text-[11px]">{p.sku || '-'}</td>
                            <td className="p-2.5 font-semibold">{p.title}</td>
                            <td style={{ color: primaryColor }} className="p-2.5 font-serif font-bold">${p.price.toLocaleString('es-AR')}</td>
                            <td className="p-2.5"><button onClick={()=>handleToggleStock(p)} className={`px-2.5 py-1 rounded-full text-[10px] font-bold ${p.stock > 0 ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}`}>{p.stock > 0 ? 'Disponible' : 'Agotado'}</button></td>
                            <td className="p-2.5 text-right flex justify-end gap-2 mt-2">
                              <button onClick={() => handleGenerateWhatsAppPromo(p)} className="text-amber-600 hover:text-amber-800" title="Copiar Promo IA para WhatsApp">
                                <i className="fa-solid fa-share-nodes"></i>
                              </button>
                              <button onClick={()=>handleDelete(p.id)} className="text-red-400 hover:text-red-600"><i className="fa-solid fa-trash"></i></button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {tab === 'design' && (
              <div className="bg-white p-6 rounded-2xl shadow-sm border max-w-2xl mx-auto space-y-4 text-xs">
                <h3 className="font-serif font-bold text-base border-b pb-3 flex items-center gap-2"><i className="fa-solid fa-palette text-lg"></i> Control de Diseño Gráfico y Tienda</h3>
                <form onSubmit={handleSaveConfig} className="space-y-4">
                  <div className="grid grid-cols-2 gap-4">
                    <div className="bg-gray-50 p-3 rounded-xl border">
                      <label className="block font-semibold mb-1">Color Principal:</label>
                      <div className="flex items-center gap-2"><input type="color" value={config.brandColor || '#768C77'} onChange={e=>setConfig({...config, brandColor: e.target.value})} className="w-10 h-8 rounded cursor-pointer" /><span className="font-mono">{config.brandColor}</span></div>
                    </div>
                    <div className="bg-gray-50 p-3 rounded-xl border">
                      <label className="block font-semibold mb-1">Color Secundario / Acento:</label>
                      <div className="flex items-center gap-2"><input type="color" value={config.secondaryColor || '#C8B297'} onChange={e=>setConfig({...config, secondaryColor: e.target.value})} className="w-10 h-8 rounded cursor-pointer" /><span className="font-mono">{config.secondaryColor}</span></div>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div className="bg-gray-50 p-3 rounded-xl border">
                      <label className="block font-semibold mb-1">Color Fondo Tienda:</label>
                      <div className="flex items-center gap-2"><input type="color" value={config.bgColor || '#FAFAF7'} onChange={e=>setConfig({...config, bgColor: e.target.value})} className="w-10 h-8 rounded cursor-pointer" /><span className="font-mono">{config.bgColor}</span></div>
                    </div>
                    <div className="bg-gray-50 p-3 rounded-xl border">
                      <label className="block font-semibold mb-1">Color Cabecera / Footer:</label>
                      <div className="flex items-center gap-2"><input type="color" value={config.headerBg || '#1C1F1D'} onChange={e=>setConfig({...config, headerBg: e.target.value})} className="w-10 h-8 rounded cursor-pointer" /><span className="font-mono">{config.headerBg}</span></div>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block font-semibold mb-1">Estilo de Tarjetas:</label>
                      <select value={config.cardStyle || 'rounded'} onChange={e=>setConfig({...config, cardStyle: e.target.value})} className="w-full p-2.5 border rounded-xl bg-gray-50">
                        <option value="rounded">Bordes Suaves y Sombra</option>
                        <option value="modern">Moderno Redondeado (3XL)</option>
                        <option value="glass">Cristal / Glassmorphism</option>
                      </select>
                    </div>
                    <div>
                      <label className="block font-semibold mb-1">Tipografía:</label>
                      <select value={config.fontFamily || 'sans'} onChange={e=>setConfig({...config, fontFamily: e.target.value})} className="w-full p-2.5 border rounded-xl bg-gray-50">
                        <option value="sans">Montserrat (Moderna)</option>
                        <option value="serif">Playfair Display (Clásica/Elegante)</option>
                        <option value="poppins">Poppins (Limpia)</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block font-semibold mb-1">Imagen de Fondo (URL opcional):</label>
                    <input type="text" placeholder="https://imagen.com/fondo.jpg" value={config.bgImage || ''} onChange={e=>setConfig({...config, bgImage: e.target.value})} className="w-full p-2.5 border rounded-xl bg-gray-50 font-mono text-[11px]" />
                  </div>

                  <div className="border-t pt-3">
                    <label className="block font-semibold mb-1">WhatsApp y Medios de Pago:</label>
                    <div className="grid grid-cols-2 gap-2">
                      <input type="text" value={config.whatsappNumber} onChange={e=>setConfig({...config, whatsappNumber: e.target.value})} className="p-2 border rounded-xl bg-gray-50 font-mono" />
                      <input type="text" value={config.paymentMethods} onChange={e=>setConfig({...config, paymentMethods: e.target.value})} className="p-2 border rounded-xl bg-gray-50" />
                    </div>
                  </div>

                  <div className="border-t pt-3">
                    <label className="block font-semibold mb-1">Categorías de la Tienda</label>
                    <div className="flex gap-2 mb-2">
                      <input type="text" placeholder="Nueva categoría" value={newCategoryInput} onChange={e=>setNewCategoryInput(e.target.value)} className="flex-grow p-2 border rounded-xl bg-gray-50" />
                      <button type="button" onClick={handleAddCategory} style={{ backgroundColor: primaryColor }} className="text-white px-4 py-2 rounded-xl">Agregar</button>
                    </div>
                    <div className="flex flex-wrap gap-2">
                      {(config.categories || []).map(cat => (
                        <span key={cat} className="bg-gray-100 border px-3 py-1 rounded-full flex items-center gap-2">
                          {cat} <button type="button" onClick={()=>handleRemoveCategory(cat)} className="text-red-500 font-bold">×</button>
                        </span>
                      ))}
                    </div>
                  </div>

                  <button type="submit" style={{ backgroundColor: primaryColor }} className="w-full text-white font-medium py-3 rounded-xl shadow">Guardar Cambios de Diseño</button>
                </form>
              </div>
            )}

            {tab === 'security' && (
              <div className="bg-white p-6 rounded-2xl shadow-sm border max-w-lg mx-auto space-y-4 text-xs">
                <h3 className="font-serif font-bold text-base border-b pb-3 flex items-center gap-2"><i className="fa-solid fa-shield-halved text-lg"></i> Seguridad y Contraseña</h3>
                
                <form onSubmit={handleChangePasswordInPanel} className="space-y-3">
                  <p className="text-gray-600">Modifica tu contraseña de acceso al panel de administración:</p>
                  {passChangeMsg && <p className={`p-2 rounded text-center ${passChangeMsg.includes('correctamente') ? 'bg-emerald-50 text-emerald-800' : 'bg-red-50 text-red-600'}`}>{passChangeMsg}</p>}
                  <div><label className="block font-semibold mb-1">Contraseña Actual:</label><input type="password" value={currentPassChange} onChange={e=>setCurrentPassChange(e.target.value)} className="w-full p-2.5 border rounded-xl bg-gray-50" required /></div>
                  <div><label className="block font-semibold mb-1">Nueva Contraseña:</label><input type="password" value={newPassChange} onChange={e=>setNewPassChange(e.target.value)} className="w-full p-2.5 border rounded-xl bg-gray-50" required /></div>
                  <button type="submit" style={{ backgroundColor: primaryColor }} className="w-full text-white py-2.5 rounded-xl font-medium shadow">Actualizar Contraseña</button>
                </form>

                <div className="border-t pt-4 space-y-2">
                  <label className="block font-semibold">Clave Secreta de Recuperación (para emergencias):</label>
                  <input type="text" value={config.secretRecoveryKey || 'cordoba2026'} onChange={e=>saveConfigToFirestore({...config, secretRecoveryKey: e.target.value})} className="w-full p-2.5 border rounded-xl bg-gray-50 font-mono" />
                  <p className="text-[11px] text-gray-500">Esta clave te permite restablecer el acceso si olvidas tu contraseña.</p>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);
  </script>
</body>
</html>
