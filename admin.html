<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - L&V HOGAR</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Playfair Display', 'serif'],
            sans: ['Montserrat', 'sans-serif'],
          },
          colors: {
            brand: {
              olive: '#768C77',
              oliveDark: '#5B6F5C',
              sand: '#C8B297',
              sandLight: '#F5EFEE',
              sandBg: '#FAFAF7',
              darkBg: '#1C1F1D',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-brand-sandBg text-gray-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const DEFAULT_CONFIG = {
      storeName: "L&V HOGAR",
      storeSubtitle: "Artículos para el hogar y cuidado personal",
      whatsappNumber: "5493512102238",
      whatsappMsg: "¡Hola L&V HOGAR! Quisiera realizar la siguiente compra:\n\n",
      showBanner: true,
      bannerTitle: "Renueva tu Hogar con Estilo y Calidez",
      bannerText: "Envíos locales a domicilio y atención personalizada por WhatsApp.",
      paymentMethods: "Efectivo contra entrega, Transferencia bancaria y Mercado Pago.",
      brandColor: "#768C77",
      categories: ["Hogar", "Cuidado Personal", "Electrodomésticos", "Accesorios"],
      deliveryZones: [
        { name: "Malvinas Argentinas - 1ª Sección", price: 0 },
        { name: "Malvinas Argentinas - 2ª Sección", price: 500 },
        { name: "Malvinas Argentinas - 3ª Sección", price: 800 },
        { name: "Córdoba Capital (Otras zonas)", price: 1500 }
      ]
    };

    function AdminApp() {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [user, setUser] = useState('');
      const [pass, setPass] = useState('');
      const [error, setError] = useState('');
      const [tab, setTab] = useState('products');

      const [config, setConfig] = useState(() => JSON.parse(localStorage.getItem('lv_config')) || DEFAULT_CONFIG);
      const [products, setProducts] = useState(() => JSON.parse(localStorage.getItem('lv_products')) || []);
      const [newProd, setNewProd] = useState({ 
        title: '', price: '', stock: '', category: 'Hogar', image: '', video: '', description: '', badge: '', variantsLabel: 'Color', variants: '' 
      });
      const [newCategoryInput, setNewCategoryInput] = useState('');
      const [savedMessage, setSavedMessage] = useState('');

      useEffect(() => { localStorage.setItem('lv_config', JSON.stringify(config)); }, [config]);
      useEffect(() => { localStorage.setItem('lv_products', JSON.stringify(products)); }, [products]);

      const primaryColor = config.brandColor || '#768C77';

      const handleLogin = (e) => {
        e.preventDefault();
        if (user === 'admin' && pass === 'admin123') {
          setIsAuthenticated(true);
        } else {
          setError('Credenciales incorrectas');
        }
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setNewProd(prev => ({ ...prev, image: reader.result }));
          };
          reader.readAsDataURL(file);
        }
      };

      const handleVideoUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setNewProd(prev => ({ ...prev, video: reader.result }));
          };
          reader.readAsDataURL(file);
        }
      };

      const handleAddProduct = (e) => {
        e.preventDefault();
        const created = { 
          ...newProd, 
          id: Date.now(), 
          price: parseFloat(newProd.price), 
          stock: parseInt(newProd.stock),
          image: newProd.image || 'https://images.unsplash.com/photo-1583847268964-b28dc8f51f92?auto=format&fit=crop&w=600&q=80'
        };
        setProducts([created, ...products]);
        setNewProd({ title: '', price: '', stock: '', category: config.categories?.[0] || 'Hogar', image: '', video: '', description: '', badge: '', variantsLabel: 'Color', variants: '' });
      };

      const handleDelete = (id) => setProducts(products.filter(p => p.id !== id));

      const handleToggleStock = (id) => {
        setProducts(products.map(p => {
          if (p.id === id) {
            return { ...p, stock: p.stock > 0 ? 0 : 10 };
          }
          return p;
        }));
      };

      const handleAddCategory = () => {
        if (!newCategoryInput.trim()) return;
        const currentCats = config.categories || ["Hogar", "Cuidado Personal", "Electrodomésticos", "Accesorios"];
        if (!currentCats.includes(newCategoryInput.trim())) {
          setConfig({ ...config, categories: [...currentCats, newCategoryInput.trim()] });
          setNewCategoryInput('');
        }
      };

      const handleRemoveCategory = (catToRemove) => {
        const currentCats = config.categories || [];
        setConfig({ ...config, categories: currentCats.filter(c => c !== catToRemove) });
      };

      const handleSaveConfig = (e) => {
        e.preventDefault();
        localStorage.setItem('lv_config', JSON.stringify(config));
        setSavedMessage('¡Configuración y diseño guardados con éxito en la tienda!');
        setTimeout(() => setSavedMessage(''), 4000);
      };

      if (!isAuthenticated) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <form onSubmit={handleLogin} className="bg-white p-8 rounded-2xl shadow-lg border border-brand-sand/30 w-full max-w-sm space-y-4">
              <div className="text-center mb-4">
                <div className="w-12 h-12 border border-brand-sand rounded-full flex flex-col items-center justify-center mx-auto mb-2 bg-brand-darkBg">
                  <span className="font-serif font-bold text-brand-olive text-sm">L&V</span>
                </div>
                <h2 className="text-xl font-serif text-gray-800">Panel Privado</h2>
                <p className="text-xs text-gray-500">L&V HOGAR Administración</p>
              </div>

              {error && <p className="text-xs text-red-500 text-center bg-red-50 p-2 rounded">{error}</p>}
              
              <div>
                <label className="block text-xs font-semibold mb-1 text-gray-700">Usuario</label>
                <input type="text" placeholder="admin" value={user} onChange={e=>setUser(e.target.value)} className="w-full p-2.5 border border-brand-sand/40 rounded-xl text-xs" required />
              </div>

              <div>
                <label className="block text-xs font-semibold mb-1 text-gray-700">Contraseña</label>
                <input type="password" placeholder="admin123" value={pass} onChange={e=>setPass(e.target.value)} className="w-full p-2.5 border border-brand-sand/40 rounded-xl text-xs" required />
              </div>

              <button type="submit" style={{ backgroundColor: primaryColor }} className="w-full text-white py-2.5 rounded-xl text-xs font-medium transition shadow">
                Ingresar al Panel
              </button>
              <a href="index.html" className="block text-center text-xs text-gray-500 hover:underline">Volver a la tienda</a>
            </form>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col">
          <header className="bg-brand-darkBg text-white p-4 flex justify-between items-center text-xs border-b border-brand-sand/20">
            <div className="flex items-center space-x-2">
              <span className="font-serif font-bold text-brand-sand text-sm">L&V HOGAR</span>
              <span className="text-gray-400">| Panel de Administración</span>
            </div>
            <div className="flex gap-4">
              <a href="index.html" target="_blank" className="text-brand-sand hover:underline flex items-center gap-1">
                <span>Ver Tienda Pública</span>
                <i className="fa-solid fa-external-link text-[10px]"></i>
              </a>
              <button onClick={() => setIsAuthenticated(false)} className="text-red-400 hover:underline">Cerrar Sesión</button>
            </div>
          </header>

          <div className="bg-white border-b border-brand-sand/30">
            <div className="max-w-6xl mx-auto px-4 flex space-x-4 text-xs font-medium">
              <button 
                onClick={() => setTab('products')} 
                style={tab === 'products' ? { borderColor: primaryColor, color: primaryColor } : {}}
                className={`py-3.5 px-3 border-b-2 flex items-center gap-2 ${tab === 'products' ? 'font-bold' : 'border-transparent text-gray-600'}`}
              >
                <i className="fa-solid fa-boxes-stacked"></i> Productos ({products.length})
              </button>
              <button 
                onClick={() => setTab('config')} 
                style={tab === 'config' ? { borderColor: primaryColor, color: primaryColor } : {}}
                className={`py-3.5 px-3 border-b-2 flex items-center gap-2 ${tab === 'config' ? 'font-bold' : 'border-transparent text-gray-600'}`}
              >
                <i className="fa-solid fa-palette"></i> Diseño, Tienda y WhatsApp
              </button>
            </div>
          </div>

          <main className="max-w-6xl mx-auto p-6 w-full flex-grow">
            {savedMessage && (
              <div className="mb-4 p-3 bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs rounded-xl flex items-center gap-2">
                <i style={{ color: primaryColor }} className="fa-solid fa-check-circle text-base"></i>
                <span>{savedMessage}</span>
              </div>
            )}

            {tab === 'products' && (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div className="bg-white p-5 rounded-2xl shadow-sm border border-brand-sand/30 space-y-3 text-xs">
                  <h3 className="font-serif font-bold text-sm text-gray-800">Agregar Producto con Opciones y Variantes</h3>
                  <form onSubmit={handleAddProduct} className="space-y-3">
                    <div>
                      <label className="block font-medium mb-1">Título del Producto</label>
                      <input type="text" placeholder="Ej: Escritorio Portátil" value={newProd.title} onChange={e=>setNewProd({...newProd, title: e.target.value})} className="w-full p-2 border border-brand-sand/40 rounded-xl" required />
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block font-medium mb-1">Categoría</label>
                        <select value={newProd.category} onChange={e=>setNewProd({...newProd, category: e.target.value})} className="w-full p-2 border border-brand-sand/40 rounded-xl">
                          {(config.categories || ["Hogar", "Cuidado Personal", "Electrodomésticos", "Accesorios"]).map(c => (
                            <option key={c} value={c}>{c}</option>
                          ))}
                        </select>
                      </div>
                      <div>
                        <label className="block font-medium mb-1">Etiqueta</label>
                        <input type="text" placeholder="Ej: Oferta" value={newProd.badge} onChange={e=>setNewProd({...newProd, badge: e.target.value})} className="w-full p-2 border border-brand-sand/40 rounded-xl" />
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block font-medium mb-1">Precio ($)</label>
                        <input type="number" placeholder="18500" value={newProd.price} onChange={e=>setNewProd({...newProd, price: e.target.value})} className="w-full p-2 border border-brand-sand/40 rounded-xl" required />
                      </div>
                      <div>
                        <label className="block font-medium mb-1">Stock</label>
                        <input type="number" placeholder="10" value={newProd.stock} onChange={e=>setNewProd({...newProd, stock: e.target.value})} className="w-full p-2 border border-brand-sand/40 rounded-xl" required />
                      </div>
                    </div>

                    <div className="bg-brand-sandLight p-3 rounded-xl border border-brand-sand/30 space-y-2">
                      <label className="block font-semibold text-gray-750">⚙️ Opciones / Variantes (Opcional):</label>
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="block text-[11px] font-medium text-gray-600 mb-0.5">Tipo (ej: Color / Talle / ml):</label>
                          <input 
                            type="text" 
                            placeholder="Ej: Color o Capacidad" 
                            value={newProd.variantsLabel} 
                            onChange={e=>setNewProd({...newProd, variantsLabel: e.target.value})} 
                            className="w-full p-1.5 border border-brand-sand/40 rounded-lg bg-white text-[11px]" 
                          />
                        </div>
                        <div>
                          <label className="block text-[11px] font-medium text-gray-600 mb-0.5">Valores (separados por coma):</label>
                          <input 
                            type="text" 
                            placeholder="Ej: Rojo, Azul, Negro" 
                            value={newProd.variants} 
                            onChange={e=>setNewProd({...newProd, variants: e.target.value})} 
                            className="w-full p-1.5 border border-brand-sand/40 rounded-lg bg-white text-[11px]" 
                          />
                        </div>
                      </div>
                    </div>

                    <div className="space-y-1 bg-brand-sandLight p-3 rounded-xl border border-brand-sand/30">
                      <label className="block font-semibold text-gray-700">Foto del Producto (Principal):</label>
                      <input 
                        type="file" 
                        accept="image/*" 
                        onChange={handleImageUpload} 
                        style={{ '--brand-color': primaryColor }}
                        className="w-full text-xs text-gray-500 file:mr-4 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-[var(--brand-color)] file:text-white cursor-pointer" 
                      />
                      <input 
                        type="text" 
                        placeholder="O pega URL de imagen..." 
                        value={newProd.image.startsWith('data:') ? '' : newProd.image} 
                        onChange={e=>setNewProd({...newProd, image: e.target.value})} 
                        className="w-full p-1.5 border border-brand-sand/40 rounded-lg bg-white text-[11px] mt-1" 
                      />
                    </div>

                    <div className="space-y-1 bg-brand-sandLight p-3 rounded-xl border border-brand-sand/30">
                      <label className="block font-semibold text-gray-700">
                        <i style={{ color: primaryColor }} className="fa-solid fa-video mr-1"></i> Video Demostrativo (Opcional):
                      </label>
                      <input 
                        type="file" 
                        accept="video/*" 
                        onChange={handleVideoUpload} 
                        style={{ '--brand-color': primaryColor }}
                        className="w-full text-xs text-gray-500 file:mr-4 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-[var(--brand-color)] file:text-white cursor-pointer" 
                      />
                      <input 
                        type="text" 
                        placeholder="O pega URL de video (MP4 / WebM)..." 
                        value={newProd.video.startsWith('data:') ? '' : newProd.video} 
                        onChange={e=>setNewProd({...newProd, video: e.target.value})} 
                        className="w-full p-1.5 border border-brand-sand/40 rounded-lg bg-white text-[11px] mt-1" 
                      />
                    </div>

                    <div>
                      <label className="block font-medium mb-1">Descripción</label>
                      <textarea placeholder="Detalles del producto..." value={newProd.description} onChange={e=>setNewProd({...newProd, description: e.target.value})} className="w-full p-2 border border-brand-sand/40 rounded-xl h-16"></textarea>
                    </div>
                    <button type="submit" style={{ backgroundColor: primaryColor }} className="w-full text-white font-medium py-2.5 rounded-xl shadow-sm hover:opacity-90">Guardar Producto</button>
                  </form>
                </div>

                <div className="bg-white p-5 rounded-2xl shadow-sm border border-brand-sand/30 space-y-3 text-xs md:col-span-2">
                  <h3 className="font-serif font-bold text-sm text-gray-800">Inventario de Productos ({products.length})</h3>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse">
                      <thead>
                        <tr className="border-b border-brand-sand/30 bg-brand-sandLight text-gray-600">
                          <th className="p-2.5 font-serif">Multimedia</th>
                          <th className="p-2.5 font-serif">Producto</th>
                          <th className="p-2.5">Categoría</th>
                          <th className="p-2.5">Precio</th>
                          <th className="p-2.5">Variantes</th>
                          <th className="p-2.5">Estado / Stock</th>
                          <th className="p-2.5 text-right">Acción</th>
                        </tr>
                      </thead>
                      <tbody>
                        {products.map(p => {
                          const isAvailable = p.stock > 0;
                          return (
                            <tr key={p.id} className="border-b border-gray-100 hover:bg-brand-sandBg">
                              <td className="p-2.5 flex items-center gap-1">
                                <img src={p.image} alt={p.title} className="w-10 h-10 object-cover rounded-lg border border-brand-sand/30" />
                                {p.video && <span style={{ backgroundColor: primaryColor }} className="text-white text-[9px] px-1.5 py-0.5 rounded font-bold">VIDEO</span>}
                              </td>
                              <td className="p-2.5 font-semibold text-gray-800">{p.title}</td>
                              <td className="p-2.5 text-gray-500">{p.category}</td>
                              <td style={{ color: primaryColor }} className="p-2.5 font-serif font-bold">${p.price.toLocaleString('es-AR')}</td>
                              <td className="p-2.5 text-gray-600 text-[11px]">
                                {p.variants ? <span className="bg-brand-sandLight px-2 py-0.5 rounded font-medium border border-brand-sand/30">{p.variantsLabel}: {p.variants}</span> : <span className="text-gray-400">Sin variantes</span>}
                              </td>
                              <td className="p-2.5">
                                <button 
                                  onClick={() => handleToggleStock(p.id)} 
                                  className={`px-2.5 py-1 rounded-full text-[10px] font-bold transition ${
                                    isAvailable ? 'bg-emerald-100 text-emerald-800 hover:bg-emerald-200' : 'bg-red-100 text-red-800 hover:bg-red-200'
                                  }`}
                                >
                                  {isAvailable ? `Disponible (${p.stock})` : 'Agotado (Pausado)'}
                                </button>
                              </td>
                              <td className="p-2.5 text-right">
                                <button onClick={()=>handleDelete(p.id)} className="text-red-400 hover:text-red-600 font-bold p-1">
                                  <i className="fa-solid fa-trash"></i>
                                </button>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {tab === 'config' && (
              <div className="bg-white p-6 rounded-2xl shadow-sm border border-brand-sand/30 max-w-2xl mx-auto space-y-4 text-xs">
                <h3 className="font-serif font-bold text-base text-gray-800 border-b border-brand-sand/30 pb-3 flex items-center gap-2">
                  <i style={{ color: primaryColor }} className="fa-solid fa-palette text-lg"></i>
                  <span>Diseño y Configuración General de L&V HOGAR</span>
                </h3>

                <form onSubmit={handleSaveConfig} className="space-y-4">
                  <div className="bg-brand-sandLight border border-brand-sand/40 p-4 rounded-xl space-y-2">
                    <label className="block font-semibold text-gray-800">
                      🎨 Color Principal de la Marca (Diseño de la Tienda):
                    </label>
                    <div className="flex items-center gap-3">
                      <input 
                        type="color" 
                        value={config.brandColor || '#768C77'} 
                        onChange={e => setConfig({...config, brandColor: e.target.value})} 
                        className="w-12 h-10 rounded-lg cursor-pointer border border-brand-sand bg-white p-1" 
                      />
                      <span className="text-gray-600 text-xs font-mono">Código actual: {config.brandColor || '#768C77'}</span>
                    </div>
                  </div>

                  <div className="bg-brand-sandLight border border-brand-sand/40 p-4 rounded-xl">
                    <label className="block font-semibold text-gray-800 mb-1">
                      Número de WhatsApp de Contacto:
                    </label>
                    <input 
                      type="text" 
                      value={config.whatsappNumber} 
                      onChange={e => setConfig({...config, whatsappNumber: e.target.value})} 
                      className="w-full p-2.5 border border-brand-sand/40 rounded-xl font-mono text-sm bg-white" 
                      placeholder="5493512102238" 
                      required 
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block font-semibold mb-1">Nombre de la Tienda</label>
                      <input 
                        type="text" 
                        value={config.storeName} 
                        onChange={e => setConfig({...config, storeName: e.target.value})} 
                        className="w-full p-2.5 border border-brand-sand/40 rounded-xl" 
                        required 
                      />
                    </div>
                    <div>
                      <label className="block font-semibold mb-1">Subtítulo / Eslogan</label>
                      <input 
                        type="text" 
                        value={config.storeSubtitle} 
                        onChange={e => setConfig({...config, storeSubtitle: e.target.value})} 
                        className="w-full p-2.5 border border-brand-sand/40 rounded-xl" 
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block font-semibold mb-1">Medios de Pago (Alias / Transferencia / Mercado Pago)</label>
                    <input 
                      type="text" 
                      value={config.paymentMethods || ''} 
                      onChange={e => setConfig({...config, paymentMethods: e.target.value})} 
                      className="w-full p-2.5 border border-brand-sand/40 rounded-xl" 
                      placeholder="Ej: Transferencia Bancaria (Alias: lvhogar.mp)" 
                    />
                  </div>

                  <div className="border-t border-brand-sand/30 pt-3">
                    <label className="block font-semibold mb-1">Categorías de la Tienda</label>
                    <div className="flex gap-2 mb-2">
                      <input 
                        type="text" 
                        placeholder="Nueva categoría (ej: Aromas)" 
                        value={newCategoryInput} 
                        onChange={e => setNewCategoryInput(e.target.value)} 
                        className="flex-grow p-2 border border-brand-sand/40 rounded-xl" 
                      />
                      <button type="button" onClick={handleAddCategory} style={{ backgroundColor: primaryColor }} className="text-white px-4 py-2 rounded-xl font-medium hover:opacity-90">
                        Agregar
                      </button>
                    </div>
                    <div className="flex flex-wrap gap-2">
                      {(config.categories || ["Hogar", "Cuidado Personal", "Electrodomésticos", "Accesorios"]).map(cat => (
                        <span key={cat} className="bg-brand-sandLight border border-brand-sand/40 px-3 py-1 rounded-full text-gray-700 flex items-center gap-2">
                          {cat}
                          {cat !== 'Hogar' && (
                            <button type="button" onClick={() => handleRemoveCategory(cat)} className="text-red-400 hover:text-red-600 font-bold">×</button>
                          )}
                        </span>
                      ))}
                    </div>
                  </div>

                  <div className="border-t border-brand-sand/30 pt-3">
                    <label className="block font-semibold mb-1">Mensaje Inicial para Pedidos por WhatsApp</label>
                    <textarea 
                      value={config.whatsappMsg} 
                      onChange={e => setConfig({...config, whatsappMsg: e.target.value})} 
                      className="w-full p-2.5 border border-brand-sand/40 rounded-xl h-16 font-mono text-xs" 
                    ></textarea>
                  </div>

                  <button type="submit" style={{ backgroundColor: primaryColor }} className="w-full text-white font-medium py-3 rounded-xl shadow transition hover:opacity-90">
                    Guardar Cambios de Diseño y Tienda
                  </button>
                </form>
              </div>
            )}
          </main>
        </div>
      );
    }
