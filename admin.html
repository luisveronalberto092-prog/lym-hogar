<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - L&V HOGAR</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="bg-[#FAFAF7] text-gray-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SUPABASE_URL = "https://cleduaakmebcnldqeaoo.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsZWR1YWFrbWViY25sZHFlYW9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMjYxMzgsImV4cCI6MjEwODgwMjEzOH0.Wl1DsflvOJLNDCaCjdNyaGe91KpCH7zpqZGJVDOpH2s";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const DEFAULT_CONFIG = {
      storeName: "L&V HOGAR",
      whatsappNumber: "5493512102238",
      locationText: "Malvinas Argentinas y Córdoba Capital",
      locationHours: "Lunes a Sábados: 09:00 a 20:00 hs",
      brandColor: "#768C77",
      adminPassword: "admin123",
      categories: ["Hogar", "Cuidado Personal", "Electrodomésticos", "Bazar y Cocina", "Aromas y Decoración", "Accesorios"]
    };

    function AdminApp() {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [user, setUser] = useState('');
      const [pass, setPass] = useState('');
      const [error, setError] = useState('');

      const [config, setConfig] = useState(() => JSON.parse(localStorage.getItem('lv_config')) || DEFAULT_CONFIG);
      const [products, setProducts] = useState([]);
      const [loadingList, setLoadingList] = useState(true);
      
      const [editingId, setEditingId] = useState(null); // ID del producto que se está editando
      const [newProd, setNewProd] = useState({ 
        title: '', price: '', stock: '10', category: 'Hogar', image: '', video: '', description: '', variants: '' 
      });
      const [additionalImages, setAdditionalImages] = useState([]);
      const [savedMessage, setSavedMessage] = useState('');

      const fetchProductsFromSupabase = async () => {
        try {
          const { data, error } = await supabaseClient
            .from('productos')
            .select('*')
            .order('id', { ascending: false });

          if (error) throw error;
          setProducts(data || []);
        } catch (err) {
          console.error("Error al cargar productos:", err);
        } finally {
          setLoadingList(false);
        }
      };

      useEffect(() => {
        if (isAuthenticated) fetchProductsFromSupabase();
      }, [isAuthenticated]);

      const primaryColor = config.brandColor || '#768C77';

      const handleFileSelection = (e, type) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        if (type === 'main') {
          const reader = new FileReader();
          reader.onload = (uploadEvent) => setNewProd(prev => ({ ...prev, image: uploadEvent.target.result }));
          reader.readAsDataURL(files[0]);
        } else if (type === 'gallery') {
          files.forEach(file => {
            const reader = new FileReader();
            reader.onload = (uploadEvent) => setAdditionalImages(prev => [...prev, uploadEvent.target.result]);
            reader.readAsDataURL(file);
          });
        } else if (type === 'video') {
          const reader = new FileReader();
          reader.onload = (uploadEvent) => setNewProd(prev => ({ ...prev, video: uploadEvent.target.result }));
          reader.readAsDataURL(files[0]);
        }
      };

      const handleLogin = (e) => {
        e.preventDefault();
        const validPass = config.adminPassword || 'admin123';
        if (user === 'admin' && pass === validPass) {
          setIsAuthenticated(true);
        } else {
          setError('Usuario o contraseña incorrectos');
        }
      };

      const handleSaveProduct = async (e) => {
        e.preventDefault();
        try {
          const payload = {
            title: newProd.title.trim(),
            price: parseFloat(newProd.price),
            category: newProd.category,
            stock: parseInt(newProd.stock),
            image: newProd.image.trim() || 'https://images.unsplash.com/photo-1583847268964-b28dc8f51f92?auto=format&fit=crop&w=600&q=80',
            video: newProd.video.trim(),
            gallery: additionalImages,
            description: newProd.description.trim(),
            variants: newProd.variants.trim()
          };

          if (editingId) {
            // Actualizar producto existente
            const { error } = await supabaseClient
              .from('productos')
              .update(payload)
              .eq('id', editingId);

            if (error) throw error;
            setSavedMessage('¡Producto actualizado con éxito en Supabase!');
          } else {
            // Crear producto nuevo
            const { error } = await supabaseClient
              .from('productos')
              .insert([payload]);

            if (error) throw error;
            setSavedMessage('¡Producto cargado con éxito en Supabase!');
          }

          resetForm();
          fetchProductsFromSupabase();
          setTimeout(() => setSavedMessage(''), 3000);
        } catch (err) {
          alert('Error al guardar el producto: ' + err.message);
        }
      };

      const handleEditClick = (product) => {
        setEditingId(product.id);
        setNewProd({
          title: product.title || '',
          price: product.price || '',
          stock: product.stock !== undefined ? product.stock : '10',
          category: product.category || 'Hogar',
          image: product.image || '',
          video: product.video || '',
          description: product.description || '',
          variants: product.variants || ''
        });
        setAdditionalImages(product.gallery || []);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const resetForm = () => {
        setEditingId(null);
        setNewProd({ title: '', price: '', stock: '10', category: config.categories?.[0] || 'Hogar', image: '', video: '', description: '', variants: '' });
        setAdditionalImages([]);
      };

      const handleDeleteProduct = async (id) => {
        if (!confirm('¿Seguro que querés eliminar este producto?')) return;
        try {
          const { error } = await supabaseClient.from('productos').delete().eq('id', id);
          if (error) throw error;
          fetchProductsFromSupabase();
        } catch (err) {
          alert('Error al eliminar: ' + err.message);
        }
      };

      if (!isAuthenticated) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-gray-100">
            <div className="bg-white p-8 rounded-2xl shadow-lg border border-gray-200 w-full max-w-sm space-y-4">
              <div className="text-center mb-4">
                <h2 className="text-xl font-serif text-gray-800">Panel Privado</h2>
                <p className="text-xs text-gray-500">L&V HOGAR Administración</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-3">
                {error && <p className="text-xs text-red-500 text-center bg-red-50 p-2 rounded">{error}</p>}
                <div>
                  <label className="block text-xs font-semibold mb-1">Usuario</label>
                  <input type="text" value={user} onChange={e=>setUser(e.target.value)} className="w-full p-2.5 border rounded-xl text-xs bg-gray-50" required />
                </div>
                <div>
                  <label className="block text-xs font-semibold mb-1">Contraseña</label>
                  <input type="password" value={pass} onChange={e=>setPass(e.target.value)} className="w-full p-2.5 border rounded-xl text-xs bg-gray-50" required />
                </div>
                <button type="submit" style={{ backgroundColor: primaryColor }} className="w-full text-white py-2.5 rounded-xl text-xs font-medium shadow">Ingresar</button>
              </form>
              <a href="index.html" className="block text-center text-xs text-gray-400 hover:underline pt-2">Volver a la tienda</a>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col">
          <header className="bg-[#1C1F1D] text-white p-4 flex justify-between items-center text-xs border-b border-white/10">
            <div className="flex items-center space-x-2">
              <span className="font-serif font-bold text-[#C8B297] text-sm">L&V HOGAR</span>
              <span className="text-gray-400">| Panel Admin</span>
            </div>
            <div className="flex gap-4">
              <a href="index.html" target="_blank" className="text-[#C8B297] hover:underline flex items-center gap-1">Ver Tienda <i className="fa-solid fa-external-link text-[10px]"></i></a>
              <button onClick={() => setIsAuthenticated(false)} className="text-red-400 hover:underline">Cerrar Sesión</button>
            </div>
          </header>

          <main className="max-w-6xl mx-auto p-6 w-full flex-grow">
            {savedMessage && (
              <div className="mb-4 p-3 bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs rounded-xl flex items-center gap-2">
                <i className="fa-solid fa-check-circle text-base"></i> {savedMessage}
              </div>
            )}

            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              
              {/* Formulario de Carga / Edición */}
              <div className="bg-white p-5 rounded-2xl shadow-sm border space-y-3 text-xs">
                <div className="flex justify-between items-center">
                  <h3 className="font-serif font-bold text-sm">
                    {editingId ? '✏️ Editando Producto' : '📦 Cargar Producto'}
                  </h3>
                  {editingId && (
                    <button onClick={resetForm} className="text-[10px] text-gray-500 underline hover:text-red-500">
                      Cancelar edición
                    </button>
                  )}
                </div>

                <form onSubmit={handleSaveProduct} className="space-y-3">
                  <div>
                    <label className="block font-medium mb-1">Nombre</label>
                    <input type="text" value={newProd.title} onChange={e=>setNewProd({...newProd, title: e.target.value})} className="w-full p-2 border rounded-xl bg-gray-50" required />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-medium mb-1">Categoría</label>
                      <select value={newProd.category} onChange={e=>setNewProd({...newProd, category: e.target.value})} className="w-full p-2 border rounded-xl bg-gray-50">
                        {(config.categories || []).map(c=>(<option key={c} value={c}>{c}</option>))}
                      </select>
                    </div>
                    <div>
                      <label className="block font-medium mb-1">Precio ($)</label>
                      <input type="number" value={newProd.price} onChange={e=>setNewProd({...newProd, price: e.target.value})} className="w-full p-2 border rounded-xl font-bold bg-gray-50" required />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-medium mb-1">Stock</label>
                      <input type="number" value={newProd.stock} onChange={e=>setNewProd({...newProd, stock: e.target.value})} className="w-full p-2 border rounded-xl bg-gray-50" required />
                    </div>
                    <div>
                      <label className="block font-medium mb-1">Variantes</label>
                      <input type="text" placeholder="Ej: Rojo, Azul" value={newProd.variants} onChange={e=>setNewProd({...newProd, variants: e.target.value})} className="w-full p-2 border rounded-xl bg-gray-50" />
                    </div>
                  </div>

                  <div className="bg-gray-50 p-2 rounded-xl border space-y-1">
                    <label className="block font-medium text-gray-700">📸 Foto Principal:</label>
                    <input type="file" accept="image/*" onChange={(e) => handleFileSelection(e, 'main')} className="w-full text-[10px]" />
                    <input type="text" placeholder="O pegá URL..." value={newProd.image} onChange={e=>setNewProd({...newProd, image: e.target.value})} className="w-full p-1.5 border rounded-lg bg-white text-[11px]" />
                  </div>

                  <div className="bg-gray-50 p-2 rounded-xl border space-y-1">
                    <label className="block font-medium text-gray-700">🖼️ Galería Secundaria:</label>
                    <input type="file" accept="image/*" multiple onChange={(e) => handleFileSelection(e, 'gallery')} className="w-full text-[10px]" />
                    {additionalImages.length > 0 && (
                      <div className="flex gap-1 mt-1 overflow-x-auto">
                        {additionalImages.map((img, idx) => (
                          <div key={idx} className="relative">
                            <img src={img} className="w-10 h-10 object-cover rounded border" />
                            <button type="button" onClick={() => setAdditionalImages(additionalImages.filter((_, i) => i !== idx))} className="absolute -top-1 -right-1 bg-red-500 text-white rounded-full w-3.5 h-3.5 text-[8px] flex items-center justify-center">×</button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  <div className="bg-gray-50 p-2 rounded-xl border space-y-1">
                    <label className="block font-medium text-gray-700">🎬 Video Demostrativo:</label>
                    <input type="file" accept="video/*" onChange={(e) => handleFileSelection(e, 'video')} className="w-full text-[10px]" />
                  </div>

                  <div>
                    <label className="block font-medium mb-1">Descripción</label>
                    <textarea value={newProd.description} onChange={e=>setNewProd({...newProd, description: e.target.value})} className="w-full p-2 border rounded-xl h-20 bg-gray-50 text-xs"></textarea>
                  </div>

                  <button type="submit" style={{ backgroundColor: primaryColor }} className="w-full text-white font-medium py-2.5 rounded-xl shadow">
                    {editingId ? 'Actualizar Producto en Supabase' : 'Guardar Producto en Supabase'}
                  </button>
                </form>
              </div>

              {/* Lista de Inventario con Botón de Editar */}
              <div className="bg-white p-5 rounded-2xl shadow-sm border space-y-3 text-xs md:col-span-2">
                <h3 className="font-serif font-bold text-sm">Inventario en Tiempo Real ({products.length})</h3>
                {loadingList ? (
                  <div className="text-center py-10 text-gray-400">Cargando inventario...</div>
                ) : (
                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse">
                      <thead>
                        <tr className="border-b bg-gray-50 text-gray-600">
                          <th className="p-2">Foto</th>
                          <th className="p-2">Producto</th>
                          <th className="p-2">Categoría</th>
                          <th className="p-2">Precio</th>
                          <th className="p-2">Stock</th>
                          <th className="p-2 text-right">Acciones</th>
                        </tr>
                      </thead>
                      <tbody>
                        {products.map(p => (
                          <tr key={p.id} className="border-b hover:bg-gray-50">
                            <td className="p-2"><img src={p.image || 'https://images.unsplash.com/photo-1583847268964-b28dc8f51f92?auto=format&fit=crop&w=600&q=80'} className="w-8 h-8 object-cover rounded-lg border" /></td>
                            <td className="p-2 font-semibold">{p.title}</td>
                            <td className="p-2 text-gray-500">{p.category}</td>
                            <td style={{ color: primaryColor }} className="p-2 font-bold">${Number(p.price).toLocaleString('es-AR')}</td>
                            <td className="p-2"><span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${Number(p.stock) > 0 ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}`}>{p.stock} un.</span></td>
                            <td className="p-2 text-right space-x-2">
                              <button onClick={() => handleEditClick(p)} className="text-blue-500 hover:text-blue-700" title="Editar producto"><i className="fa-solid fa-pen-to-square"></i></button>
                              <button onClick={() => handleDeleteProduct(p.id)} className="text-red-400 hover:text-red-600" title="Eliminar producto"><i className="fa-solid fa-trash"></i></button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);
  </script>
</body>
</html>
