<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - L&V HOGAR</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-receipt, #printable-receipt * { visibility: visible; }
      #printable-receipt { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-[#FAFAF7] text-gray-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const supabaseClient = supabase.createClient(
      "https://cleduaakmebcnldqeaoo.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsZWR1YWFrbWViY25sZHFlYW9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMjYxMzgsImV4cCI6MjEwODgwMjEzOH0.Wl1DsflvOJLNDCaCjdNyaGe91KpCH7zpqZGJVDOpH2s"
    );

    function AdminApp() {
      const [authConfig, setAuthConfig] = useState(() => {
        return JSON.parse(localStorage.getItem('lv_admin_credentials')) || {
          user: 'admin',
          pass: 'admin123',
          email: 'luisveron@ejemplo.com',
          wsp: '3512102238'
        };
      });

      const [isAuth, setIsAuth] = useState(false);
      const [user, setUser] = useState('');
      const [pass, setPass] = useState('');
      const [error, setError] = useState('');
      
      const [isRecovering, setIsRecovering] = useState(false);
      const [recoveryMethod, setRecoveryMethod] = useState('wsp');
      const [recoveryInput, setRecoveryInput] = useState('');
      const [recoveryMsg, setRecoveryMsg] = useState('');

      const [activeTab, setActiveTab] = useState('inventory');
      const [products, setProducts] = useState([]);
      const [orderHistory, setOrderHistory] = useState(() => {
        return JSON.parse(localStorage.getItem('lv_order_history')) || [
          {
            id: 'LV-1001',
            date: new Date().toLocaleDateString('es-AR'),
            clientName: 'Cliente Ejemplo',
            clientAddress: 'Malvinas Argentinas 1ra Sección',
            clientPhone: '3512102238',
            paymentMethod: 'Efectivo contra entrega',
            fulfillmentType: 'delivery',
            deliveryCost: 0,
            status: 'Entregado',
            total: 12500,
            items: [
              { title: 'Humidificador Ultrasónico', qty: 1, price: 12500, selectedOptions: 'Blanco' }
            ]
          }
        ];
      });

      const [loading, setLoading] = useState(true);
      const [editingId, setEditingId] = useState(null);
      const [msg, setMsg] = useState('');

      // Estado para visualizar / imprimir comprobante
      const [selectedReceipt, setSelectedReceipt] = useState(null);

      // Categorías
      const [categoriesList, setCategoriesList] = useState(() => {
        return JSON.parse(localStorage.getItem('lv_store_categories')) || [
          "Hogar", "Cuidado Personal", "Electrodomésticos", "Bazar y Cocina", "Aromas y Decoración", "Accesorios"
        ];
      });
      const [newCategoryName, setNewCategoryName] = useState('');

      const [storeConfig, setStoreConfig] = useState(() => {
        return JSON.parse(localStorage.getItem('lv_store_design')) || {
          brandColor: '#768C77',
          headerBg: '#1C1F1D',
          bgLogoUrl: '',
          bgOpacity: 0.1,
          bgSize: 50,
          bgRepeat: 'no-repeat'
        };
      });

      const [form, setForm] = useState({
        title: '', price: '', stock: '10', category: categoriesList[0] || 'Hogar', image: '', video: '', description: '', variants: '', colors: '', specifications: ''
      });
      const [additionalImages, setAdditionalImages] = useState([]);

      const fetchProducts = async () => {
        try {
          const { data, error } = await supabaseClient.from('productos').select('*').order('id', { ascending: false });
          if (error) throw error;
          setProducts(data || []);
        } catch (err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        if (isAuth) {
          fetchProducts();
        }
      }, [isAuth]);

      const handleLogin = e => {
        e.preventDefault();
        if (user.trim() === authConfig.user && pass.trim() === authConfig.pass) {
          setIsAuth(true);
          setError('');
        } else {
          setError('Usuario o contraseña incorrectos.');
        }
      };

      const handleUpdateOrderStatus = (orderId, newStatus) => {
        const updated = orderHistory.map(ord => ord.id === orderId ? { ...ord, status: newStatus } : ord);
        setOrderHistory(updated);
        localStorage.setItem('lv_order_history', JSON.stringify(updated));
        setMsg(`Estado del pedido ${orderId} actualizado a "${newStatus}"`);
        setTimeout(() => setMsg(''), 3000);
      };

      const handleDeleteOrder = (orderId) => {
        if (!confirm(`¿Eliminar el registro de venta ${orderId}?`)) return;
        const updated = orderHistory.filter(ord => ord.id !== orderId);
        setOrderHistory(updated);
        localStorage.setItem('lv_order_history', JSON.stringify(updated));
      };

      const handleSave = async e => {
        e.preventDefault();
        try {
          const payload = {
            title: form.title.trim(),
            price: parseFloat(form.price),
            stock: parseInt(form.stock) || 10,
            category: form.category,
            image: form.image || 'https://images.unsplash.com/photo-1583847268964-b28dc8f51f92?auto=format&fit=crop&w=600&q=80',
            video: form.video ? form.video.trim() : '',
            gallery: additionalImages,
            description: form.description ? form.description.trim() : '',
            variants: form.variants ? form.variants.trim() : '',
            colors: form.colors ? form.colors.trim() : '',
            specifications: form.specifications ? form.specifications.trim() : ''
          };

          if (editingId) {
            const { error } = await supabaseClient.from('productos').update(payload).eq('id', editingId);
            if (error) throw error;
            setMsg('¡Producto actualizado con éxito!');
          } else {
            const { error } = await supabaseClient.from('productos').insert([payload]);
            if (error) throw error;
            setMsg('¡Producto guardado con éxito!');
          }

          resetForm();
          fetchProducts();
          setTimeout(() => setMsg(''), 3000);
        } catch (err) {
          alert('Error: ' + err.message);
        }
      };

      const handleEdit = p => {
        setEditingId(p.id);
        setForm({
          title: p.title || '',
          price: p.price || '',
          stock: p.stock || 10,
          category: p.category || categoriesList[0],
          image: p.image || '',
          video: p.video || '',
          description: p.description || '',
          variants: p.variants || '',
          colors: p.colors || '',
          specifications: p.specifications || ''
        });
        setAdditionalImages(p.gallery || []);
        setActiveTab('inventory');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleDelete = async id => {
        if (!confirm('¿Seguro que querés eliminar este producto?')) return;
        try {
          const { error } = await supabaseClient.from('productos').delete().eq('id', id);
          if (error) throw error;
          fetchProducts();
        } catch (err) {
          alert('Error al eliminar: ' + err.message);
        }
      };

      const resetForm = () => {
        setEditingId(null);
        setForm({ title: '', price: '', stock: '10', category: categoriesList[0], image: '', video: '', description: '', variants: '', colors: '', specifications: '' });
        setAdditionalImages([]);
      };

      const totalInventoryValue = products.reduce((acc, p) => acc + (Number(p.price) * Number(p.stock || 0)), 0);
      const totalSalesRevenue = orderHistory.filter(o => o.status !== 'Cancelado').reduce((acc, o) => acc + Number(o.total || 0), 0);

      if (!isAuth) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-gray-100">
            <div className="bg-white p-8 rounded-2xl shadow-lg border w-full max-w-sm space-y-4">
              <div className="text-center">
                <h2 className="text-xl font-serif font-bold text-gray-800">L&V HOGAR</h2>
                <p className="text-xs text-gray-500">Panel de Administración</p>
              </div>

              {error && <p className="text-xs text-red-500 bg-red-50 p-2 rounded text-center">{error}</p>}
              <form onSubmit={handleLogin} className="space-y-3">
                <div>
                  <label className="block text-xs font-semibold mb-1">Usuario</label>
                  <input type="text" value={user} onChange={e => setUser(e.target.value)} className="w-full p-2.5 border rounded-xl text-xs bg-gray-50" required />
                </div>
                <div>
                  <label className="block text-xs font-semibold mb-1">Contraseña</label>
                  <input type="password" value={pass} onChange={e => setPass(e.target.value)} className="w-full p-2.5 border rounded-xl text-xs bg-gray-50" required />
                </div>
                <button type="submit" className="w-full bg-[#768C77] text-white py-2.5 rounded-xl text-xs font-medium shadow">Ingresar</button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col">
          <header className="bg-[#1C1F1D] text-white p-4 flex justify-between items-center text-xs no-print">
            <span className="font-serif font-bold text-[#C8B297]">L&V HOGAR | Panel Admin</span>
            <div className="space-x-4">
              <a href="index.html" target="_blank" className="text-[#C8B297] underline">Ver Tienda</a>
              <button onClick={() => setIsAuth(false)} className="text-red-400">Salir</button>
            </div>
          </header>

          <main className="max-w-6xl mx-auto p-6 w-full flex-grow space-y-6 no-print">
            {msg && <div className="p-3 bg-emerald-50 text-emerald-800 text-xs rounded-xl font-medium">{msg}</div>}

            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs">
              <div className="bg-white p-4 rounded-2xl border shadow-sm flex items-center justify-between">
                <div>
                  <p className="text-gray-400 uppercase font-semibold">Recaudación Total</p>
                  <h4 className="text-2xl font-serif font-bold text-[#768C77] mt-1">${totalSalesRevenue.toLocaleString('es-AR')}</h4>
                </div>
                <div className="w-10 h-10 rounded-full bg-emerald-100 text-emerald-800 flex items-center justify-center text-base"><i className="fa-solid fa-receipt"></i></div>
              </div>

              <div className="bg-white p-4 rounded-2xl border shadow-sm flex items-center justify-between">
                <div>
                  <p className="text-gray-400 uppercase font-semibold">Total de Pedidos</p>
                  <h4 className="text-2xl font-serif font-bold text-gray-800 mt-1">{orderHistory.length}</h4>
                </div>
                <div className="w-10 h-10 rounded-full bg-blue-100 text-blue-800 flex items-center justify-center text-base"><i className="fa-solid fa-cart-shopping"></i></div>
              </div>

              <div className="bg-white p-4 rounded-2xl border shadow-sm flex items-center justify-between">
                <div>
                  <p className="text-gray-400 uppercase font-semibold">Valor del Inventario</p>
                  <h4 className="text-2xl font-serif font-bold text-gray-800 mt-1">${totalInventoryValue.toLocaleString('es-AR')}</h4>
                </div>
                <div className="w-10 h-10 rounded-full bg-[#768C77]/10 text-[#768C77] flex items-center justify-center text-base"><i className="fa-solid fa-boxes-stacked"></i></div>
              </div>
            </div>

            <div className="flex gap-2 border-b pb-2 overflow-x-auto">
              <button onClick={() => setActiveTab('sales')} className={`px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap ${activeTab === 'sales' ? 'bg-[#768C77] text-white' : 'bg-white border text-gray-700'}`}>📊 Control de Ventas & Comprobantes</button>
              <button onClick={() => setActiveTab('inventory')} className={`px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap ${activeTab === 'inventory' ? 'bg-[#768C77] text-white' : 'bg-white border text-gray-700'}`}>📦 Inventario Productos</button>
              <button onClick={() => setActiveTab('categories')} className={`px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap ${activeTab === 'categories' ? 'bg-[#768C77] text-white' : 'bg-white border text-gray-700'}`}>🏷️ Pestañas</button>
            </div>

            {activeTab === 'sales' ? (
              <div className="bg-white p-5 rounded-2xl border space-y-4 text-xs">
                <div className="flex justify-between items-center">
                  <h3 className="font-serif font-bold text-sm text-gray-800">Historial de Ventas & Emisión de Comprobantes</h3>
                  <span className="text-gray-400">Total: {orderHistory.length} registros</span>
                </div>

                {orderHistory.length === 0 ? (
                  <p className="text-center py-10 text-gray-400">No hay ventas registradas todavía.</p>
                ) : (
                  <div className="overflow-x-auto">
                    <table className="w-full text-left">
                      <thead>
                        <tr className="border-b bg-gray-50 text-gray-600">
                          <th className="p-2">ID</th>
                          <th className="p-2">Fecha</th>
                          <th className="p-2">Cliente</th>
                          <th className="p-2">Método Pago</th>
                          <th className="p-2">Total</th>
                          <th className="p-2">Estado</th>
                          <th className="p-2 text-right">Comprobante / Acciones</th>
                        </tr>
                      </thead>
                      <tbody>
                        {orderHistory.map(ord => (
                          <tr key={ord.id} className="border-b hover:bg-gray-50">
                            <td className="p-2 font-mono font-bold text-[#768C77]">{ord.id}</td>
                            <td className="p-2 text-gray-500">{ord.date}</td>
                            <td className="p-2 font-medium">{ord.clientName || 'Cliente Web'}</td>
                            <td className="p-2 text-gray-600">{ord.paymentMethod || 'Efectivo'}</td>
                            <td className="p-2 font-bold text-gray-800">${Number(ord.total).toLocaleString('es-AR')}</td>
                            <td className="p-2">
                              <select 
                                value={ord.status || 'Pendiente'} 
                                onChange={e => handleUpdateOrderStatus(ord.id, e.target.value)}
                                className="p-1 border rounded text-[11px] font-semibold bg-white"
                              >
                                <option value="Pendiente">⏳ Pendiente</option>
                                <option value="Pagado">💳 Pagado</option>
                                <option value="Entregado">✅ Entregado</option>
                                <option value="Cancelado">❌ Cancelado</option>
                              </select>
                            </td>
                            <td className="p-2 text-right space-x-2">
                              <button 
                                onClick={() => setSelectedReceipt(ord)} 
                                className="bg-[#768C77] text-white px-2.5 py-1 rounded-lg font-medium text-[11px]"
                              >
                                📄 Comprobante
                              </button>
                              <button onClick={() => handleDeleteOrder(ord.id)} className="text-red-400" title="Eliminar"><i className="fa-solid fa-trash"></i></button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            ) : activeTab === 'inventory' ? (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div className="bg-white p-5 rounded-2xl border space-y-3 text-xs">
                  <h3 className="font-serif font-bold text-sm">{editingId ? '✏️ Editar Producto' : '📦 Cargar Producto'}</h3>
                  <form onSubmit={handleSave} className="space-y-3">
                    <div>
                      <label className="block font-medium mb-1">Título</label>
                      <input type="text" value={form.title} onChange={e => setForm({...form, title: e.target.value})} className="w-full p-2 border rounded-xl bg-gray-50" required />
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block font-medium mb-1">Categoría</label>
                        <select value={form.category} onChange={e => setForm({...form, category: e.target.value})} className="w-full p-2 border rounded-xl bg-gray-50">
                          {categoriesList.map(c => <option key={c} value={c}>{c}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="block font-medium mb-1">Precio ($)</label>
                        <input type="number" value={form.price} onChange={e => setForm({...form, price: e.target.value})} className="w-full p-2 border rounded-xl bg-gray-50 font-bold" required />
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block font-medium mb-1">Stock</label>
                        <input type="number" value={form.stock} onChange={e => setForm({...form, stock: e.target.value})} className="w-full p-2 border rounded-xl bg-gray-50" required />
                      </div>
                      <div>
                        <label className="block font-medium mb-1">Talles / Medidas</label>
                        <input type="text" value={form.variants} onChange={e => setForm({...form, variants: e.target.value})} className="w-full p-2 border rounded-xl bg-gray-50" />
                      </div>
                    </div>
                    <button type="submit" className="w-full bg-[#768C77] text-white py-2.5 rounded-xl font-medium shadow">Guardar Producto</button>
                  </form>
                </div>

                <div className="bg-white p-5 rounded-2xl border space-y-3 text-xs md:col-span-2">
                  <h3 className="font-serif font-bold text-sm">Inventario en Supabase ({products.length})</h3>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left">
                      <thead>
                        <tr className="border-b bg-gray-50 text-gray-600">
                          <th className="p-2">Foto</th>
                          <th className="p-2">Título</th>
                          <th className="p-2">Precio</th>
                          <th className="p-2">Stock</th>
                          <th className="p-2 text-right">Acciones</th>
                        </tr>
                      </thead>
                      <tbody>
                        {products.map(p => (
                          <tr key={p.id} className="border-b hover:bg-gray-50">
                            <td className="p-2"><img src={p.image} className="w-8 h-8 object-cover rounded border" /></td>
                            <td className="p-2 font-semibold">{p.title}</td>
                            <td className="p-2 font-bold text-[#768C77]">${Number(p.price).toLocaleString('es-AR')}</td>
                            <td className="p-2">{p.stock} un.</td>
                            <td className="p-2 text-right space-x-2">
                              <button onClick={() => handleEdit(p)} className="text-blue-500"><i className="fa-solid fa-pen"></i></button>
                              <button onClick={() => handleDelete(p.id)} className="text-red-400"><i className="fa-solid fa-trash"></i></button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            ) : null}
          </main>

          {/* MODAL / PLANTILLA DE COMPROBANTE DE COMPRA IMPRIMIBLE */}
          {selectedReceipt && (
            <div className="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-white max-w-md w-full p-6 rounded-2xl shadow-2xl relative space-y-4" id="printable-receipt">
                
                {/* Encabezado Ticket */}
                <div className="text-center border-b pb-3">
                  <h2 className="font-serif text-xl font-bold tracking-widest text-gray-800">L&V HOGAR</h2>
                  <p className="text-[10px] text-gray-500 uppercase">Comprobante de Venta no Válido como Factura Fiscal</p>
                  <p className="text-[11px] text-gray-600 mt-1">Malvinas Argentinas, Córdoba</p>
                  <p className="text-[11px] text-gray-600">WhatsApp: 3512102238</p>
                </div>

                {/* Detalles Operación */}
                <div className="text-xs space-y-1 bg-gray-50 p-3 rounded-xl border">
                  <div className="flex justify-between font-mono font-bold">
                    <span>Comprobante N°:</span>
                    <span>{selectedReceipt.id}</span>
                  </div>
                  <div className="flex justify-between">
                    <span>Fecha:</span>
                    <span>{selectedReceipt.date}</span>
                  </div>
                  <div className="flex justify-between">
                    <span>Cliente:</span>
                    <span>{selectedReceipt.clientName || 'Consumidor Final'}</span>
                  </div>
                  {selectedReceipt.clientAddress && (
                    <div className="flex justify-between">
                      <span>Dirección:</span>
                      <span>{selectedReceipt.clientAddress}</span>
                    </div>
                  )}
                  <div className="flex justify-between">
                    <span>Forma de Pago:</span>
                    <span>{selectedReceipt.paymentMethod || 'Efectivo'}</span>
                  </div>
                </div>

                {/* Tabla de Artículos */}
                <div className="space-y-2 text-xs">
                  <p className="font-bold border-b pb-1">Detalle del Pedido:</p>
                  {selectedReceipt.items && selectedReceipt.items.map((it, idx) => (
                    <div key={idx} className="flex justify-between items-center text-[11px] border-b pb-1">
                      <div>
                        <p className="font-semibold">{it.title}</p>
                        {it.selectedOptions && <p className="text-[9px] text-gray-400">[{it.selectedOptions}]</p>}
                      </div>
                      <div className="text-right font-mono">
                        <span>{it.qty} x ${Number(it.price).toLocaleString('es-AR')}</span>
                        <p className="font-bold text-gray-800">${Number(it.price * it.qty).toLocaleString('es-AR')}</p>
                      </div>
                    </div>
                  ))}
                </div>

                {/* Totales */}
                <div className="border-t pt-2 space-y-1 text-xs">
                  {selectedReceipt.deliveryCost > 0 && (
                    <div className="flex justify-between text-gray-500">
                      <span>Costo de Envío:</span>
                      <span>${Number(selectedReceipt.deliveryCost).toLocaleString('es-AR')}</span>
                    </div>
                  )}
                  <div className="flex justify-between text-sm font-bold text-[#768C77]">
                    <span>Total Abonado:</span>
                    <span>${Number(selectedReceipt.total).toLocaleString('es-AR')}</span>
                  </div>
                </div>

                {/* Pie Comprobante */}
                <div className="text-center pt-2 text-[10px] text-gray-400 border-t">
                  <p>¡Muchas gracias por tu compra en L&V HOGAR!</p>
                </div>

                {/* Botones no imprimibles */}
                <div className="flex gap-2 pt-2 no-print">
                  <button onClick={() => window.print()} className="w-1/2 bg-[#768C77] text-white py-2 rounded-xl text-xs font-medium">
                    🖨️ Imprimir Ticket
                  </button>
                  <button onClick={() => setSelectedReceipt(null)} className="w-1/2 bg-gray-200 text-gray-700 py-2 rounded-xl text-xs font-medium">
                    Cerrar
                  </button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(AdminApp));
  </script>
</body>
</html>
