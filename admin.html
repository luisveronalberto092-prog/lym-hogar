<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - L&V HOGAR</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#FAFAF7] text-gray-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const supabaseClient = supabase.createClient(
      "https://cleduaakmebcnldqeaoo.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsZWR1YWFrbWViY25sZHFlYW9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMjYxMzgsImV4cCI6MjEwODgwMjEzOH0.Wl1DsflvOJLNDCaCjdNyaGe91KpCH7zpqZGJVDOpH2s"
    );

    const categoriesList = ["Hogar", "Cuidado Personal", "Electrodomésticos", "Bazar y Cocina", "Aromas y Decoración", "Accesorios"];

    function AdminApp() {
      const [isAuth, setIsAuth] = useState(false);
      const [user, setUser] = useState('');
      const [pass, setPass] = useState('');
      const [error, setError] = useState('');
      
      // Pestañas: 'inventory', 'design', 'history'
      const [activeTab, setActiveTab] = useState('inventory');

      const [products, setProducts] = useState([]);
      const [orderHistory, setOrderHistory] = useState([]);
      const [loading, setLoading] = useState(true);
      const [editingId, setEditingId] = useState(null);
      const [msg, setMsg] = useState('');

      // Configuración de Diseño Gráfico y Estilos guardada en localStorage
      const [storeConfig, setStoreConfig] = useState(() => {
        return JSON.parse(localStorage.getItem('lv_store_design')) || {
          brandColor: '#768C77',
          headerBg: '#1C1F1D',
          bannerTitle: 'Renueva tu Hogar con Estilo y Calidez',
          bannerText: 'Envíos locales a domicilio y atención personalizada.'
        };
      });

      const [form, setForm] = useState({
        title: '', price: '', stock: '10', category: 'Hogar', image: '', video: '', description: '', variants: ''
      });
      const [additionalImages, setAdditionalImages] = useState([]);

      const fetchProducts = async () => {
        try {
          const { data, error } = await supabaseClient.from('productos').select('*').order('id', { ascending: false });
          if (error) throw error;
          setProducts(data || []);
        } catch (err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        if (isAuth) {
          fetchProducts();
          const history = JSON.parse(localStorage.getItem('lv_order_history')) || [];
          setOrderHistory(history);
        }
      }, [isAuth]);

      const handleFileSelection = (e, type) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        if (type === 'main') {
          const reader = new FileReader();
          reader.onload = evt => setForm(prev => ({ ...prev, image: evt.target.result }));
          reader.readAsDataURL(files[0]);
        } else if (type === 'gallery') {
          files.forEach(file => {
            const reader = new FileReader();
            reader.onload = evt => setAdditionalImages(prev => [...prev, evt.target.result]);
            reader.readAsDataURL(file);
          });
        } else if (type === 'video') {
          const reader = new FileReader();
          reader.onload = evt => setForm(prev => ({ ...prev, video: evt.target.result }));
          reader.readAsDataURL(files[0]);
        }
      };

      const handleLogin = e => {
        e.preventDefault();
        if (user === 'admin' && pass === 'admin123') {
          setIsAuth(true);
        } else {
          setError('Usuario o clave incorrectos (admin / admin123)');
        }
      };

      const handleSave = async e => {
        e.preventDefault();
        try {
          const payload = {
            title: form.title.trim(),
            price: parseFloat(form.price),
            stock: parseInt(form.stock) || 10,
            category: form.category,
            image: form.image || 'https://images.unsplash.com/photo-1583847268964-b28dc8f51f92?auto=format&fit=crop&w=600&q=80',
            video: form.video ? form.video.trim() : '',
            gallery: additionalImages,
            description: form.description ? form.description.trim() : '',
            variants: form.variants ? form.variants.trim() : ''
          };

          if (editingId) {
            const { error } = await supabaseClient.from('productos').update(payload).eq('id', editingId);
            if (error) throw error;
            setMsg('¡Producto actualizado con éxito!');
          } else {
            const { error } = await supabaseClient.from('productos').insert([payload]);
            if (error) throw error;
            setMsg('¡Producto guardado con éxito!');
          }

          resetForm();
          fetchProducts();
          setTimeout(() => setMsg(''), 3000);
        } catch (err) {
          alert('Error: ' + err.message);
        }
      };

      const handleEdit = p => {
        setEditingId(p.id);
        setForm({
          title: p.title || '',
          price: p.price || '',
          stock: p.stock || 10,
          category: p.category || 'Hogar',
          image: p.image || '',
          video: p.video || '',
          description: p.description || '',
          variants: p.variants || ''
        });
        setAdditionalImages(p.gallery || []);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleDelete = async id => {
        if (!confirm('¿Seguro que querés eliminar este producto?')) return;
        try {
          const { error } = await supabaseClient.from('productos').delete().eq('id', id);
          if (error) throw error;
          fetchProducts();
        } catch (err) {
          alert('Error al eliminar: ' + err.message);
        }
      };

      const resetForm = () => {
        setEditingId(null);
        setForm({ title: '', price: '', stock: '10', category: 'Hogar', image: '', video: '', description: '', variants: '' });
        setAdditionalImages([]);
      };

      const handleSaveDesign = e => {
        e.preventDefault();
        localStorage.setItem('lv_store_design', JSON.stringify(storeConfig));
        setMsg('¡Diseño y estilos guardados con éxito!');
        setTimeout(() => setMsg(''), 3000);
      };

      // Estadísticas
      const totalInventoryValue = products.reduce((acc, p) => acc + (Number(p.price) * Number(p.stock || 0)), 0);
      const outOfStockCount = products.filter(p => Number(p.stock) === 0).length;

      if (!isAuth) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-gray-100">
            <div className="bg-white p-8 rounded-2xl shadow-lg border w-full max-w-sm space-y-4">
              <h2 className="text-xl font-serif text-center font-bold">Panel Administrador</h2>
              {error && <p className="text-xs text-red-500 bg-red-50 p-2 rounded text-center">{error}</p>}
              <form onSubmit={handleLogin} className="space-y-3">
                <div>
                  <label className="block text-xs font-semibold mb-1">Usuario</label>
                  <input type="text" value={user} onChange={e => setUser(e.target.value)} className="w-full p-2.5 border rounded-xl text-xs bg-gray-50" required />
                </div>
                <div>
                  <label className="block text-xs font-semibold mb-1">Contraseña</label>
                  <input type="password" value={pass} onChange={e => setPass(e.target.value)} className="w-full p-2.5 border rounded-xl text-xs bg-gray-50" required />
                </div>
                <button type="submit" className="w-full bg-[#768C77] text-white py-2.5 rounded-xl text-xs font-medium">Ingresar</button>
              </form>
              <a href="index.html" className="block text-center text-xs text-gray-400 underline pt-2">Volver a la tienda</a>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col">
          <header className="bg-[#1C1F1D] text-white p-4 flex justify-between items-center text-xs">
            <span className="font-serif font-bold text-[#C8B297]">L&V HOGAR | Panel Admin</span>
            <div className="space-x-4">
              <a href="index.html" target="_blank" className="text-[#C8B297] underline">Ver Tienda</a>
              <button onClick={() => setIsAuth(false)} className="text-red-400">Salir</button>
            </div>
          </header>

          <main className="max-w-6xl mx-auto p-6 w-full flex-grow space-y-6">
            {msg && <div className="p-3 bg-emerald-50 text-emerald-800 text-xs rounded-xl font-medium">{msg}</div>}

            {/* Panel de Métricas / Gráficos */}
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs">
              <div className="bg-white p-4 rounded-2xl border shadow-sm flex items-center justify-between">
                <div>
                  <p className="text-gray-400 uppercase font-semibold">Total de Productos</p>
                  <h4 className="text-2xl font-serif font-bold text-gray-800 mt-1">{products.length}</h4>
                </div>
                <div className="w-10 h-10 rounded-full bg-[#768C77]/10 text-[#768C77] flex items-center justify-center text-base"><i className="fa-solid fa-box"></i></div>
              </div>

              <div className="bg-white p-4 rounded-2xl border shadow-sm flex items-center justify-between">
                <div>
                  <p className="text-gray-400 uppercase font-semibold">Valor del Inventario</p>
                  <h4 className="text-2xl font-serif font-bold text-[#768C77] mt-1">${totalInventoryValue.toLocaleString('es-AR')}</h4>
                </div>
                <div className="w-10 h-10 rounded-full bg-emerald-100 text-emerald-800 flex items-center justify-center text-base"><i className="fa-solid fa-dollar-sign"></i></div>
              </div>

              <div className="bg-white p-4 rounded-2xl border shadow-sm flex items-center justify-between">
                <div>
                  <p className="text-gray-400 uppercase font-semibold">Productos Agotados</p>
                  <h4 className="text-2xl font-serif font-bold text-red-600 mt-1">{outOfStockCount}</h4>
                </div>
                <div className="w-10 h-10 rounded-full bg-red-100 text-red-600 flex items-center justify-center text-base"><i className="fa-solid fa-triangle-exclamation"></i></div>
              </div>
            </div>

            {/* Pestañas de Navegación Admin */}
            <div className="flex gap-2 border-b pb-2 overflow-x-auto">
              <button onClick={() => setActiveTab('inventory')} className={`px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap ${activeTab === 'inventory' ? 'bg-[#768C77] text-white' : 'bg-white border text-gray-700'}`}>📦 Inventario</button>
              <button onClick={() => setActiveTab('design')} className={`px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap ${activeTab === 'design' ? 'bg-[#768C77] text-white' : 'bg-white border text-gray-700'}`}>🎨 Área de Diseño Gráfico</button>
              <button onClick={() => setActiveTab('history')} className={`px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap ${activeTab === 'history' ? 'bg-[#768C77] text-white' : 'bg-white border text-gray-700'}`}>📋 Historial de Pedidos ({orderHistory.length})</button>
            </div>

            {activeTab === 'inventory' ? (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                
                {/* Formulario de Carga / Edición */}
                <div className="bg-white p-5 rounded-2xl border space-y-3 text-xs">
                  <div className="flex justify-between items-center">
                    <h3 className="font-serif font-bold text-sm">{editingId ? '✏️ Editar Producto' : '📦 Cargar Producto'}</h3>
                    {editingId && <button onClick={resetForm} className="text-gray-400 underline">Cancelar</button>}
                  </div>

                  <form onSubmit={handleSave} className="space-y-3">
                    <div>
                      <label className="block font-medium mb-1">Título</label>
                      <input type="text" value={form.title} onChange={e => setForm({...form, title: e.target.value})} className="w-full p-2 border rounded-xl bg-gray-50" required />
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block font-medium mb-1">Categoría</label>
                        <select value={form.category} onChange={e => setForm({...form, category: e.target.value})} className="w-full p-2 border rounded-xl bg-gray-50">
                          {categoriesList.map(c => <option key={c} value={c}>{c}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="block font-medium mb-1">Precio ($)</label>
                        <input type="number" value={form.price} onChange={e => setForm({...form, price: e.target.value})} className="w-full p-2 border rounded-xl bg-gray-50 font-bold" required />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block font-medium mb-1">Stock</label>
                        <input type="number" value={form.stock} onChange={e => setForm({...form, stock: e.target.value})} className="w-full p-2 border rounded-xl bg-gray-50" required />
                      </div>
                      <div>
                        <label className="block font-medium mb-1">Variantes</label>
                        <input type="text" placeholder="Ej: Rojo, Azul" value={form.variants} onChange={e => setForm({...form, variants: e.target.value})} className="w-full p-2 border rounded-xl bg-gray-50" />
                      </div>
                    </div>

                    <div className="bg-gray-50 p-2 rounded-xl border space-y-1">
                      <label className="block font-medium text-gray-700">📸 Foto Principal:</label>
                      <input type="file" accept="image/*" onChange={e => handleFileSelection(e, 'main')} className="w-full text-[10px]" />
                      <input type="text" placeholder="O pegá URL..." value={form.image} onChange={e => setForm({...form, image: e.target.value})} className="w-full p-1.5 border rounded bg-white text-[11px]" />
                    </div>

                    <div className="bg-gray-50 p-2 rounded-xl border space-y-1">
                      <label className="block font-medium text-gray-700">🖼️ Galería Secundaria:</label>
                      <input type="file" accept="image/*" multiple onChange={e => handleFileSelection(e, 'gallery')} className="w-full text-[10px]" />
                      {additionalImages.length > 0 && (
                        <div className="flex gap-1 mt-1 overflow-x-auto">
                          {additionalImages.map((img, idx) => (
                            <div key={idx} className="relative">
                              <img src={img} className="w-10 h-10 object-cover rounded border" />
                              <button type="button" onClick={() => setAdditionalImages(additionalImages.filter((_, i) => i !== idx))} className="absolute -top-1 -right-1 bg-red-500 text-white rounded-full w-3.5 h-3.5 text-[8px] flex items-center justify-center">×</button>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>

                    <div className="bg-gray-50 p-2 rounded-xl border space-y-1">
                      <label className="block font-medium text-gray-700">🎬 Video Demostrativo:</label>
                      <input type="file" accept="video/*" onChange={e => handleFileSelection(e, 'video')} className="w-full text-[10px]" />
                    </div>

                    <div>
                      <label className="block font-medium mb-1">Descripción</label>
                      <textarea value={form.description} onChange={e => setForm({...form, description: e.target.value})} className="w-full p-2 border rounded-xl h-20 bg-gray-50"></textarea>
                    </div>

                    <button type="submit" className="w-full bg-[#768C77] text-white py-2.5 rounded-xl font-medium shadow">
                      {editingId ? 'Actualizar Producto' : 'Guardar Producto'}
                    </button>
                  </form>
                </div>

                {/* Tabla de Inventario */}
                <div className="bg-white p-5 rounded-2xl border space-y-3 text-xs md:col-span-2">
                  <h3 className="font-serif font-bold text-sm">Inventario en Supabase ({products.length})</h3>
                  {loading ? (
                    <p className="text-center py-10 text-gray-400">Cargando...</p>
                  ) : products.length === 0 ? (
                    <p className="text-center py-10 text-gray-400">No hay productos cargados todavía.</p>
                  ) : (
                    <div className="overflow-x-auto">
                      <table className="w-full text-left">
                        <thead>
                          <tr className="border-b bg-gray-50 text-gray-600">
                            <th className="p-2">Foto</th>
                            <th className="p-2">Título</th>
                            <th className="p-2">Categoría</th>
                            <th className="p-2">Precio</th>
                            <th className="p-2">Stock</th>
                            <th className="p-2 text-right">Acciones</th>
                          </tr>
                        </thead>
                        <tbody>
                          {products.map(p => (
                            <tr key={p.id} className="border-b hover:bg-gray-50">
                              <td className="p-2"><img src={p.image} className="w-8 h-8 object-cover rounded border" /></td>
                              <td className="p-2 font-semibold">{p.title}</td>
                              <td className="p-2 text-gray-500">{p.category}</td>
                              <td className="p-2 font-bold text-[#768C77]">${Number(p.price).toLocaleString('es-AR')}</td>
                              <td className="p-2"><span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${Number(p.stock) > 0 ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}`}>{p.stock} un.</span></td>
                              <td className="p-2 text-right space-x-2">
                                <button onClick={() => handleEdit(p)} className="text-blue-500" title="Editar"><i className="fa-solid fa-pen"></i></button>
                                <button onClick={() => handleDelete(p.id)} className="text-red-400" title="Eliminar"><i className="fa-solid fa-trash"></i></button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>

              </div>
            ) : activeTab === 'design' ? (
              /* ÁREA DE DISEÑO GRÁFICO Y CONTROL VISUAL */
              <div className="bg-white p-6 rounded-2xl border space-y-6 text-xs">
                <div>
                  <h3 className="font-serif font-bold text-sm text-gray-800 flex items-center gap-2">
                    <i className="fa-solid fa-palette text-[#768C77]"></i> Área de Diseño Gráfico y Personalización
                  </h3>
                  <p className="text-gray-500 mt-1">Configurá la identidad visual, colores y textos de tu tienda pública en tiempo real.</p>
                </div>

                <form onSubmit={handleSaveDesign} className="space-y-4 max-w-lg">
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block font-semibold text-gray-700 mb-1">Color Principal (Botones/Detalles):</label>
                      <div className="flex items-center gap-2">
                        <input type="color" value={storeConfig.brandColor} onChange={e => setStoreConfig({...storeConfig, brandColor: e.target.value})} className="w-10 h-10 rounded cursor-pointer border" />
                        <span className="font-mono text-gray-600">{storeConfig.brandColor}</span>
                      </div>
                    </div>

                    <div>
                      <label className="block font-semibold text-gray-700 mb-1">Color Cabecera (Header):</label>
                      <div className="flex items-center gap-2">
                        <input type="color" value={storeConfig.headerBg} onChange={e => setStoreConfig({...storeConfig, headerBg: e.target.value})} className="w-10 h-10 rounded cursor-pointer border" />
                        <span className="font-mono text-gray-600">{storeConfig.headerBg}</span>
                      </div>
                    </div>
                  </div>

                  <div>
                    <label className="block font-semibold text-gray-700 mb-1">Título del Banner Principal:</label>
                    <input type="text" value={storeConfig.bannerTitle} onChange={e => setStoreConfig({...storeConfig, bannerTitle: e.target.value})} className="w-full p-2 border rounded-xl bg-gray-50" />
                  </div>

                  <div>
                    <label className="block font-semibold text-gray-700 mb-1">Texto descriptivo del Banner:</label>
                    <input type="text" value={storeConfig.bannerText} onChange={e => setStoreConfig({...storeConfig, bannerText: e.target.value})} className="w-full p-2 border rounded-xl bg-gray-50" />
                  </div>

                  <button type="submit" className="bg-[#768C77] text-white px-6 py-2.5 rounded-xl font-medium shadow">
                    Guardar Configuración Visual
                  </button>
                </form>

                <div className="border-t pt-4">
                  <h4 className="font-serif font-bold text-gray-800 mb-2">💡 Consejos de Diseño Gráfico para L&V HOGAR:</h4>
                  <ul className="list-disc list-inside space-y-1 text-gray-600">
                    <li>Utilizá fotos de productos con fondo blanco o neutro para mantener una estética profesional y limpia.</li>
                    <li>Asegurate de que las fotos secundarias de la galería muestren detalles o ángulos de uso del producto.</li>
                    <li>Mantené actualizados los precios y el stock para generar confianza inmediata en tus clientes.</li>
                  </ul>
                </div>
              </div>
            ) : (
              /* Historial de Pedidos */
              <div className="bg-white p-5 rounded-2xl border space-y-4 text-xs">
                <h3 className="font-serif font-bold text-sm">Historial de Pedidos Generados</h3>
                {orderHistory.length === 0 ? (
                  <p className="text-center py-10 text-gray-400">No hay pedidos registrados todavía.</p>
                ) : (
                  <div className="space-y-3">
                    {orderHistory.map(ord => (
                      <div key={ord.id} className="p-4 border rounded-xl bg-gray-50 flex flex-col sm:flex-row justify-between gap-4">
                        <div>
                          <p className="font-bold text-gray-700">Pedido #{ord.id} - <span className="text-gray-500">{ord.date}</span></p>
                          <p className="text-[#768C77] font-semibold mt-1">Estado: {ord.status}</p>
                          <div className="mt-2 space-y-1">
                            {ord.items.map((it, idx) => (
                              <p key={idx} className="text-gray-600">• {it.title} {it.selectedVariant ? `[${it.selectedVariant}]` : ''} x{it.qty} (${Number(it.price * it.qty)})</p>
                            ))}
                          </div>
                        </div>
                        <div className="text-right flex flex-col justify-center">
                          <span className="text-gray-400 text-[10px] uppercase">Total</span>
                          <span className="text-base font-serif font-bold text-gray-800">${Number(ord.total).toLocaleString('es-AR')}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(AdminApp));
  </script>
</body>
</html>
