<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - L&V HOGAR</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    h1, h2, h3, .font-serif-custom { font-family: 'Outfit', sans-serif; }
    .num-style { font-variant-numeric: tabular-nums; letter-spacing: -0.025em; }
    @media print {
      body * { visibility: hidden; }
      #printable-receipt, #printable-receipt * { visibility: visible; }
      #printable-receipt { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-[#FAFAF7] text-gray-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const supabaseClient = supabase.createClient(
      "https://cleduaakmebcnldqeaoo.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsZWR1YWFrbWViY25sZHFlYW9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMjYxMzgsImV4cCI6MjEwODgwMjEzOH0.Wl1DsflvOJLNDCaCjdNyaGe91KpCH7zpqZGJVDOpH2s"
    );

    function AdminApp() {
      const [authConfig, setAuthConfig] = useState(() => {
        return JSON.parse(localStorage.getItem('lv_admin_credentials')) || {
          user: 'admin',
          pass: 'admin123',
          email: 'luisveron@ejemplo.com',
          wsp: '3512102238'
        };
      });

      const [isAuth, setIsAuth] = useState(false);
      const [user, setUser] = useState('');
      const [pass, setPass] = useState('');
      const [error, setError] = useState('');
      
      const [isRecovering, setIsRecovering] = useState(false);
      const [recoveryMethod, setRecoveryMethod] = useState('wsp');
      const [recoveryInput, setRecoveryInput] = useState('');
      const [recoveryMsg, setRecoveryMsg] = useState('');

      const [newAdminUser, setNewAdminUser] = useState(authConfig.user);
      const [newAdminPass, setNewAdminPass] = useState(authConfig.pass);
      const [newAdminEmail, setNewAdminEmail] = useState(authConfig.email);
      const [newAdminWsp, setNewAdminWsp] = useState(authConfig.wsp);

      const [activeTab, setActiveTab] = useState('sales');

      const [orderHistory, setOrderHistory] = useState(() => {
        return JSON.parse(localStorage.getItem('lv_order_history')) || [
          {
            id: 'LV-1001',
            date: new Date().toLocaleDateString('es-AR'),
            clientName: 'Cliente Ejemplo',
            clientAddress: 'Malvinas Argentinas 1ra Sección',
            clientPhone: '3512102238',
            paymentMethod: 'Efectivo contra entrega',
            fulfillmentType: 'delivery',
            deliveryCost: 0,
            status: 'Entregado',
            total: 12500,
            items: [
              { title: 'Humidificador Ultrasónico', qty: 1, price: 12500, selectedOptions: 'Blanco' }
            ]
          }
        ];
      });

      const [costSheet, setCostSheet] = useState(() => {
        return JSON.parse(localStorage.getItem('lv_cost_sheet')) || [];
      });

      const [costForm, setCostForm] = useState({
        date: new Date().toISOString().split('T')[0],
        itemTitle: '',
        category: 'Hogar',
        qty: '',
        costUsd: '',
        dolarRate: '',
        costArsDirect: '',
        salePriceArs: ''
      });

      const [selectedReceipt, setSelectedReceipt] = useState(null);

      const [categoriesList, setCategoriesList] = useState(() => {
        return JSON.parse(localStorage.getItem('lv_store_categories')) || [
          "Hogar", "Cuidado Personal", "Electrodomésticos", "Bazar y Cocina", "Aromas y Decoración", "Accesorios"
        ];
      });
      const [newCategoryName, setNewCategoryName] = useState('');

      const [storeConfig, setStoreConfig] = useState(() => {
        return JSON.parse(localStorage.getItem('lv_store_design')) || {
          brandColor: '#768C77',
          headerBg: '#1C1F1D',
          bgLogoUrl: '',
          bgOpacity: 0.1,
          bgSize: 50,
          bgRepeat: 'no-repeat'
        };
      });

      const [products, setProducts] = useState([]);
      const [loading, setLoading] = useState(true);
      const [editingId, setEditingId] = useState(null);
      const [msg, setMsg] = useState('');

      const [form, setForm] = useState({
        title: '', price: '', stock: '10', category: categoriesList[0] || 'Hogar', image: '', video: '', description: '', variants: '', colors: '', specifications: ''
      });
      const [additionalImages, setAdditionalImages] = useState([]);

      const fetchProducts = async () => {
        try {
          const { data, error } = await supabaseClient.from('productos').select('*').order('id', { ascending: false });
          if (error) throw error;
          setProducts(data || []);
        } catch (err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        if (isAuth) {
          fetchProducts();
        }
      }, [isAuth]);

      const handleFileSelection = (e, type) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        if (type === 'main') {
          const reader = new FileReader();
          reader.onload = evt => setForm(prev => ({ ...prev, image: evt.target.result }));
          reader.readAsDataURL(files[0]);
        } else if (type === 'gallery') {
          files.forEach(file => {
            const reader = new FileReader();
            reader.onload = evt => setAdditionalImages(prev => [...prev, evt.target.result]);
            reader.readAsDataURL(file);
          });
        } else if (type === 'video') {
          const reader = new FileReader();
          reader.onload = evt => setForm(prev => ({ ...prev, video: evt.target.result }));
          reader.readAsDataURL(files[0]);
        } else if (type === 'bgLogo') {
          const reader = new FileReader();
          reader.onload = evt => setStoreConfig(prev => ({ ...prev, bgLogoUrl: evt.target.result }));
          reader.readAsDataURL(files[0]);
        }
      };

      const handleLogin = e => {
        e.preventDefault();
        if (user.trim() === authConfig.user && pass.trim() === authConfig.pass) {
          setIsAuth(true);
          setError('');
        } else {
          setError('Usuario o contraseña incorrectos.');
        }
      };

      const handleRecovery = e => {
        e.preventDefault();
        const inputClean = recoveryInput.trim().toLowerCase();

        if (recoveryMethod === 'wsp') {
          if (inputClean.includes(authConfig.wsp) || authConfig.wsp.includes(inputClean)) {
            const wspMessage = `¡Hola Luis! Solicitaste la recuperación de acceso a L&V HOGAR.\n\n👤 *Usuario:* ${authConfig.user}\n🔑 *Contraseña:* ${authConfig.pass}`;
            window.open(`https://wa.me/549${authConfig.wsp}?text=${encodeURIComponent(wspMessage)}`, '_blank');
            setRecoveryMsg('✅ Te abrimos WhatsApp con tus datos de acceso.');
          } else {
            setRecoveryMsg('❌ El número ingresado no coincide con el registrado.');
          }
        } else {
          if (inputClean === authConfig.email.toLowerCase()) {
            setRecoveryMsg(`✅ Clave de acceso enviada a: ${authConfig.email}.\nUsuario: ${authConfig.user}\nContraseña: ${authConfig.pass}`);
          } else {
            setRecoveryMsg('❌ El correo ingresado no coincide con el registrado.');
          }
        }
      };

      const handleUpdateCredentials = e => {
        e.preventDefault();
        const updated = {
          user: newAdminUser.trim(),
          pass: newAdminPass.trim(),
          email: newAdminEmail.trim(),
          wsp: newAdminWsp.trim()
        };
        setAuthConfig(updated);
        localStorage.setItem('lv_admin_credentials', JSON.stringify(updated));
        setMsg('¡Credenciales actualizadas con éxito!');
        setTimeout(() => setMsg(''), 3000);
      };

      const handleAddCategory = e => {
        e.preventDefault();
        if (!newCategoryName.trim()) return;
        if (categoriesList.includes(newCategoryName.trim())) {
          alert('Esa categoría ya existe.');
          return;
        }
        const updated = [...categoriesList, newCategoryName.trim()];
        setCategoriesList(updated);
        localStorage.setItem('lv_store_categories', JSON.stringify(updated));
        setNewCategoryName('');
        setMsg('¡Categoría agregada con éxito!');
        setTimeout(() => setMsg(''), 3000);
      };

      const handleDeleteCategory = (catToDelete) => {
        if (categoriesList.length <= 1) {
          alert('Debes mantener al menos una categoría.');
          return;
        }
        if (!confirm(`¿Estás seguro de eliminar la categoría "${catToDelete}"?`)) return;
        const updated = categoriesList.filter(c => c !== catToDelete);
        setCategoriesList(updated);
        localStorage.setItem('lv_store_categories', JSON.stringify(updated));
        setMsg('Categoría eliminada.');
        setTimeout(() => setMsg(''), 3000);
      };

      const handleUpdateOrderStatus = (orderId, newStatus) => {
        const updated = orderHistory.map(ord => ord.id === orderId ? { ...ord, status: newStatus } : ord);
        setOrderHistory(updated);
        localStorage.setItem('lv_order_history', JSON.stringify(updated));
        setMsg(`Estado del pedido ${orderId} actualizado a "${newStatus}"`);
        setTimeout(() => setMsg(''), 3000);
      };

      const handleDeleteOrder = (orderId) => {
        if (!confirm(`¿Eliminar el registro de venta ${orderId}?`)) return;
        const updated = orderHistory.filter(ord => ord.id !== orderId);
        setOrderHistory(updated);
        localStorage.setItem('lv_order_history', JSON.stringify(updated));
      };

      const handleAddCostItem = e => {
        e.preventDefault();
        if (!costForm.itemTitle || !costForm.qty || !costForm.salePriceArs) {
          alert('Por favor completá los campos obligatorios (Artículo, Unidades y Precio de Venta).');
          return;
        }

        const costUsd = parseFloat(costForm.costUsd) || 0;
        const dolarRate = parseFloat(costForm.dolarRate) || 0;
        const costArsDirect = parseFloat(costForm.costArsDirect) || 0;
        const finalUnitCostArs = (costUsd > 0 && dolarRate > 0) ? (costUsd * dolarRate) : costArsDirect;

        const newItem = {
          id: Date.now(),
          date: costForm.date,
          itemTitle: costForm.itemTitle.trim(),
          category: costForm.category,
          qty: parseInt(costForm.qty),
          costUsd: costUsd,
          dolarRate: dolarRate,
          costArsDirect: costArsDirect,
          unitCostArs: finalUnitCostArs,
          salePriceArs: parseFloat(costForm.salePriceArs)
        };

        const updatedSheet = [newItem, ...costSheet];
        setCostSheet(updatedSheet);
        localStorage.setItem('lv_cost_sheet', JSON.stringify(updatedSheet));

        setCostForm({
          date: new Date().toISOString().split('T')[0],
          itemTitle: '',
          category: categoriesList[0] || 'Hogar',
          qty: '',
          costUsd: '',
          dolarRate: '',
          costArsDirect: '',
          salePriceArs: ''
        });
        setMsg('¡Registro agregado a la planilla!');
        setTimeout(() => setMsg(''), 3000);
      };

      const handleDeleteCostItem = (id) => {
        if (!confirm('¿Eliminar este registro de la planilla?')) return;
        const updatedSheet = costSheet.filter(item => item.id !== id);
        setCostSheet(updatedSheet);
        localStorage.setItem('lv_cost_sheet', JSON.stringify(updatedSheet));
      };

      // NUEVO: Enviar ítem de la planilla directamente a la tienda (Supabase)
      const handleSyncItemToStore = async (item) => {
        try {
          // Buscamos si ya existe un producto con el mismo título en Supabase
          const existing = products.find(p => p.title.toLowerCase() === item.itemTitle.toLowerCase());

          if (existing) {
            // Si ya existe, actualizamos stock sumando las nuevas unidades y actualizamos el precio
            const newStock = Number(existing.stock || 0) + Number(item.qty);
            const { error } = await supabaseClient.from('productos').update({
              price: item.salePriceArs,
              stock: newStock
            }).eq('id', existing.id);

            if (error) throw error;
            setMsg(`¡Producto "${item.itemTitle}" actualizado en la tienda! (Stock sumado: +${item.qty})`);
          } else {
            // Si no existe, lo creamos como nuevo producto en Supabase
            const payload = {
              title: item.itemTitle,
              price: item.salePriceArs,
              stock: item.qty,
              category: item.category || categoriesList[0],
              image: 'https://images.unsplash.com/photo-1583847268964-b28dc8f51f92?auto=format&fit=crop&w=600&q=80',
              description: 'Cargado desde Planilla de Costos',
              variants: '',
              colors: '',
              specifications: ''
            };

            const { error } = await supabaseClient.from('productos').insert([payload]);
            if (error) throw error;
            setMsg(`¡Nuevo producto "${item.itemTitle}" publicado en la tienda con éxito!`);
          }

          fetchProducts();
          setTimeout(() => setMsg(''), 4000);
        } catch (err) {
          alert('Error al sincronizar con la tienda: ' + err.message);
        }
      };

      const handleSave = async e => {
        e.preventDefault();
        try {
          const payload = {
            title: form.title.trim(),
            price: parseFloat(form.price),
            stock: parseInt(form.stock) || 10,
            category: form.category,
            image: form.image || 'https://images.unsplash.com/photo-1583847268964-b28dc8f51f92?auto=format&fit=crop&w=600&q=80',
            video: form.video ? form.video.trim() : '',
            gallery: additionalImages,
            description: form.description ? form.description.trim() : '',
            variants: form.variants ? form.variants.trim() : '',
            colors: form.colors ? form.colors.trim() : '',
            specifications: form.specifications ? form.specifications.trim() : ''
          };

          if (editingId) {
            const { error } = await supabaseClient.from('productos').update(payload).eq('id', editingId);
            if (error) throw error;
            setMsg('¡Producto actualizado con éxito en Supabase!');
          } else {
            const { error } = await supabaseClient.from('productos').insert([payload]);
            if (error) throw error;
            setMsg('¡Producto guardado con éxito en Supabase!');
          }

          resetForm();
          fetchProducts();
          setTimeout(() => setMsg(''), 3000);
        } catch (err) {
          alert('Error al guardar: ' + err.message);
        }
      };

      const handleEdit = p => {
        setEditingId(p.id);
        setForm({
          title: p.title || '',
          price: p.price || '',
          stock: p.stock || 10,
          category: p.category || categoriesList[0],
          image: p.image || '',
          video: p.video || '',
          description: p.description || '',
          variants: p.variants || '',
          colors: p.colors || '',
          specifications: p.specifications || ''
        });
        setAdditionalImages(p.gallery || []);
        setActiveTab('inventory');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleDelete = async id => {
        if (!confirm('¿Seguro que querés eliminar este producto?')) return;
        try {
          const { error } = await supabaseClient.from('productos').delete().eq('id', id);
          if (error) throw error;
          fetchProducts();
        } catch (err) {
          alert('Error al eliminar: ' + err.message);
        }
      };

      const resetForm = () => {
        setEditingId(null);
        setForm({ title: '', price: '', stock: '10', category: categoriesList[0], image: '', video: '', description: '', variants: '', colors: '', specifications: '' });
        setAdditionalImages([]);
      };

      const handleSaveDesign = e => {
        e.preventDefault();
        localStorage.setItem('lv_store_design', JSON.stringify(storeConfig));
        setMsg('¡Diseño y fondo calibrado guardados con éxito!');
        setTimeout(() => setMsg(''), 3000);
      };

      const totalInventoryValue = products.reduce((acc, p) => acc + (Number(p.price) * Number(p.stock || 0)), 0);
      const totalSalesRevenue = orderHistory.filter(o => o.status !== 'Cancelado').reduce((acc, o) => acc + Number(o.total || 0), 0);

      if (!isAuth) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-gray-100">
            <div className="bg-white p-8 rounded-2xl shadow-lg border w-full max-w-sm space-y-4">
              <div className="text-center">
                <h2 className="text-xl font-serif-custom font-bold text-gray-800">L&V HOGAR</h2>
                <p className="text-xs text-gray-500">Panel de Administración</p>
              </div>

              {!isRecovering ? (
                <>
                  {error && <p className="text-xs text-red-500 bg-red-50 p-2 rounded text-center">{error}</p>}
                  <form onSubmit={handleLogin} className="space-y-3">
                    <div>
                      <label className="block text-xs font-semibold mb-1">Usuario</label>
                      <input type="text" value={user} onChange={e => setUser(e.target.value)} className="w-full p-2.5 border rounded-xl text-xs bg-gray-50" required />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold mb-1">Contraseña</label>
                      <input type="password" value={pass} onChange={e => setPass(e.target.value)} className="w-full p-2.5 border rounded-xl text-xs bg-gray-50" required />
                    </div>
                    <button type="submit" className="w-full bg-[#768C77] text-white py-2.5 rounded-xl text-xs font-medium shadow">Ingresar</button>
                  </form>
                  <div className="text-center pt-2 space-y-1">
                    <button onClick={() => { setIsRecovering(true); setRecoveryMsg(''); }} className="text-xs text-[#768C77] underline hover:font-bold">¿Olvidaste tu contraseña?</button>
                    <a href="index.html" className="block text-xs text-gray-400 underline">Volver a la tienda</a>
                  </div>
                </>
              ) : (
                <>
                  <div className="text-center text-xs text-gray-600">
                    <p className="font-semibold mb-1">Recuperar Acceso</p>
                    <p>Elegí dónde querés recibir tus datos de ingreso:</p>
                  </div>

                  <div className="flex gap-2 text-xs">
                    <button type="button" onClick={() => setRecoveryMethod('wsp')} className={`w-1/2 p-2 rounded-xl border font-medium ${recoveryMethod === 'wsp' ? 'bg-[#25D366] text-white border-[#25D366]' : 'bg-gray-50'}`}>💬 WhatsApp</button>
                    <button type="button" onClick={() => setRecoveryMethod('email')} className={`w-1/2 p-2 rounded-xl border font-medium ${recoveryMethod === 'email' ? 'bg-[#768C77] text-white border-[#768C77]' : 'bg-gray-50'}`}>✉️ Email</button>
                  </div>

                  {recoveryMsg && <div className="text-xs p-2.5 rounded bg-gray-50 border text-center font-medium whitespace-pre-line">{recoveryMsg}</div>}
                  
                  <form onSubmit={handleRecovery} className="space-y-3">
                    <div>
                      <label className="block text-xs font-semibold mb-1">
                        {recoveryMethod === 'wsp' ? 'Tu WhatsApp (ej: 3512102238):' : 'Tu Correo Electrónico:'}
                      </label>
                      <input 
                        type={recoveryMethod === 'wsp' ? 'text' : 'email'} 
                        placeholder={recoveryMethod === 'wsp' ? '3512102238' : 'tu-email@gmail.com'} 
                        value={recoveryInput} 
                        onChange={e => setRecoveryInput(e.target.value)} 
                        className="w-full p-2.5 border rounded-xl text-xs bg-gray-50 num-style" 
                        required 
                      />
                    </div>
                    <button type="submit" className="w-full bg-[#768C77] text-white py-2.5 rounded-xl text-xs font-medium shadow">
                      Enviar Datos de Ingreso
                    </button>
                  </form>
                  <button onClick={() => { setIsRecovering(false); setRecoveryMsg(''); }} className="w-full text-xs text-gray-500 underline text-center pt-2">Volver al Login</button>
                </>
              )}
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col">
          <header className="bg-[#1C1F1D] text-white p-4 flex justify-between items-center text-xs no-print">
            <span className="font-serif-custom font-bold text-[#C8B297] tracking-wider">L&V HOGAR | Panel Admin</span>
            <div className="space-x-4">
              <a href="index.html" target="_blank" className="text-[#C8B297] underline">Ver Tienda</a>
              <button onClick={() => setIsAuth(false)} className="text-red-400">Salir</button>
            </div>
          </header>

          <main className="max-w-7xl mx-auto p-6 w-full flex-grow space-y-6 no-print">
            {msg && <div className="p-3 bg-emerald-50 text-emerald-800 text-xs rounded-xl font-medium">{msg}</div>}

            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs">
              <div className="bg-white p-4 rounded-2xl border shadow-sm flex items-center justify-between">
                <div>
                  <p className="text-gray-400 uppercase font-semibold">Recaudación Total</p>
                  <h4 className="text-2xl font-serif-custom font-bold text-[#768C77] mt-1 num-style">${totalSalesRevenue.toLocaleString('es-AR')}</h4>
                </div>
                <div className="w-10 h-10 rounded-full bg-emerald-100 text-emerald-800 flex items-center justify-center text-base"><i className="fa-solid fa-receipt"></i></div>
              </div>

              <div className="bg-white p-4 rounded-2xl border shadow-sm flex items-center justify-between">
                <div>
                  <p className="text-gray-400 uppercase font-semibold">Total de Pedidos</p>
                  <h4 className="text-2xl font-serif-custom font-bold text-gray-800 mt-1 num-style">{orderHistory.length}</h4>
                </div>
                <div className="w-10 h-10 rounded-full bg-blue-100 text-blue-800 flex items-center justify-center text-base"><i className="fa-solid fa-cart-shopping"></i></div>
              </div>

              <div className="bg-white p-4 rounded-2xl border shadow-sm flex items-center justify-between">
                <div>
                  <p className="text-gray-400 uppercase font-semibold">Valor del Inventario</p>
                  <h4 className="text-2xl font-serif-custom font-bold text-gray-800 mt-1 num-style">${totalInventoryValue.toLocaleString('es-AR')}</h4>
                </div>
                <div className="w-10 h-10 rounded-full bg-[#768C77]/10 text-[#768C77] flex items-center justify-center text-base"><i className="fa-solid fa-boxes-stacked"></i></div>
              </div>
            </div>

            <div className="flex gap-2 border-b pb-2 overflow-x-auto">
              <button onClick={() => setActiveTab('sales')} className={`px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap ${activeTab === 'sales' ? 'bg-[#768C77] text-white' : 'bg-white border text-gray-700'}`}>📊 Ventas & Comprobantes</button>
              <button onClick={() => setActiveTab('inventory')} className={`px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap ${activeTab === 'inventory' ? 'bg-[#768C77] text-white' : 'bg-white border text-gray-700'}`}>📦 Inventario Supabase</button>
              <button onClick={() => setActiveTab('costsheet')} className={`px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap ${activeTab === 'costsheet' ? 'bg-[#768C77] text-white' : 'bg-white border text-gray-700'}`}>📋 Planilla de Costos & Precios</button>
              <button onClick={() => setActiveTab('categories')} className={`px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap ${activeTab === 'categories' ? 'bg-[#768C77] text-white' : 'bg-white border text-gray-700'}`}>🏷️ Pestañas</button>
              <button onClick={() => setActiveTab('design')} className={`px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap ${activeTab === 'design' ? 'bg-[#768C77] text-white' : 'bg-white border text-gray-700'}`}>🎨 Diseño & Logo Fondo</button>
              <button onClick={() => setActiveTab('security')} className={`px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap ${activeTab === 'security' ? 'bg-[#768C77] text-white' : 'bg-white border text-gray-700'}`}>🔐 Seguridad & Claves</button>
            </div>

            {activeTab === 'sales' && (
              <div className="bg-white p-5 rounded-2xl border space-y-4 text-xs">
                <div className="flex justify-between items-center">
                  <h3 className="font-serif-custom font-bold text-sm text-gray-800">Historial de Ventas & Emisión de Comprobantes</h3>
                  <span className="text-gray-400">Total: {orderHistory.length} registros</span>
                </div>

                {orderHistory.length === 0 ? (
                  <p className="text-center py-10 text-gray-400">No hay ventas registradas todavía.</p>
                ) : (
                  <div className="overflow-x-auto">
                    <table className="w-full text-left">
                      <thead>
                        <tr className="border-b bg-gray-50 text-gray-600">
                          <th className="p-2">ID</th>
                          <th className="p-2">Fecha</th>
                          <th className="p-2">Cliente</th>
                          <th className="p-2">Método Pago</th>
                          <th className="p-2">Total</th>
                          <th className="p-2">Estado</th>
                          <th className="p-2 text-right">Comprobante / Acciones</th>
                        </tr>
                      </thead>
                      <tbody>
                        {orderHistory.map(ord => (
                          <tr key={ord.id} className="border-b hover:bg-gray-50">
                            <td className="p-2 font-mono font-bold text-[#768C77]">{ord.id}</td>
                            <td className="p-2 text-gray-500 num-style">{ord.date}</td>
                            <td className="p-2 font-medium">{ord.clientName || 'Cliente Web'}</td>
                            <td className="p-2 text-gray-600">{ord.paymentMethod || 'Efectivo'}</td>
                            <td className="p-2 font-bold text-gray-800 num-style">${Number(ord.total).toLocaleString('es-AR')}</td>
                            <td className="p-2">
                              <select 
                                value={ord.status || 'Pendiente'} 
                                onChange={e => handleUpdateOrderStatus(ord.id, e.target.value)}
                                className="p-1 border rounded text-[11px] font-semibold bg-white"
                              >
                                <option value="Pendiente">⏳ Pendiente</option>
                                <option value="Pagado">💳 Pagado</option>
                                <option value="Entregado">✅ Entregado</option>
                                <option value="Cancelado">❌ Cancelado</option>
                              </select>
                            </td>
                            <td className="p-2 text-right space-x-2">
                              <button 
                                onClick={() => setSelectedReceipt(ord)} 
                                className="bg-[#768C77] text-white px-2.5 py-1 rounded-lg font-medium text-[11px]"
                              >
                                📄 Comprobante
                              </button>
                              <button onClick={() => handleDeleteOrder(ord.id)} className="text-red-400" title="Eliminar"><i className="fa-solid fa-trash"></i></button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            )}

            {/* PLANILLA DE CARGA DE MERCADERÍA CONECTADA A TIENDA */}
            {activeTab === 'costsheet' && (
              <div className="space-y-6">
                <div className="bg-white p-6 rounded-2xl border space-y-4 text-xs">
                  <div>
                    <h3 className="font-serif-custom font-bold text-sm text-gray-800">📋 Carga de Mercadería (Con conexión directa al Stock de la Tienda)</h3>
                    <p className="text-gray-500 mt-1">Registrá tus costos y precios. Luego, hacé clic en <b>"Sincronizar a Tienda"</b> en cualquier fila para publicar o actualizar automáticamente el stock y precio en Supabase.</p>
                  </div>

                  <form onSubmit={handleAddCostItem} className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-8 gap-3 items-end">
                    <div>
                      <label className="block font-semibold mb-1 text-gray-700">Fecha:</label>
                      <input type="date" value={costForm.date} onChange={e => setCostForm({...costForm, date: e.target.value})} className="w-full p-2 border rounded-xl bg-gray-50 num-style" required />
                    </div>
                    <div>
                      <label className="block font-semibold mb-1 text-gray-700">Artículo:</label>
                      <input type="text" placeholder="Ej: Humidificador" value={costForm.itemTitle} onChange={e => setCostForm({...costForm, itemTitle: e.target.value})} className="w-full p-2 border rounded-xl bg-gray-50" required />
                    </div>
                    <div>
                      <label className="block font-semibold mb-1 text-gray-700">Categoría:</label>
                      <select value={costForm.category} onChange={e => setCostForm({...costForm, category: e.target.value})} className="w-full p-2 border rounded-xl bg-gray-50">
                        {categoriesList.map(c => <option key={c} value={c}>{c}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block font-semibold mb-1 text-gray-700">Unidades:</label>
                      <input type="number" placeholder="Ej: 10" value={costForm.qty} onChange={e => setCostForm({...costForm, qty: e.target.value})} className="w-full p-2 border rounded-xl bg-gray-50 num-style" required />
                    </div>
                    <div>
                      <label className="block font-semibold mb-1 text-gray-700">Costo USD / <span className="text-[#768C77]">ARS $</span>:</label>
                      <div className="grid grid-cols-2 gap-1">
                        <input type="number" step="0.01" placeholder="USD" value={costForm.costUsd} onChange={e => setCostForm({...costForm, costUsd: e.target.value})} className="w-full p-2 border rounded-xl bg-gray-50 num-style" />
                        <input type="number" step="0.01" placeholder="ARS" value={costForm.costArsDirect} onChange={e => setCostForm({...costForm, costArsDirect: e.target.value})} className="w-full p-2 border rounded-xl bg-gray-50 num-style font-bold text-[#768C77]" />
                      </div>
                    </div>
                    <div>
                      <label className="block font-semibold mb-1 text-gray-700">Cotiz. Dólar:</label>
                      <input type="number" step="0.01" placeholder="Ej: 1250" value={costForm.dolarRate} onChange={e => setCostForm({...costForm, dolarRate: e.target.value})} className="w-full p-2 border rounded-xl bg-gray-50 num-style" />
                    </div>
                    <div>
                      <label className="block font-semibold mb-1 text-gray-700">Precio Venta Unit. ($):</label>
                      <input type="number" step="0.01" placeholder="Ej: 25000" value={costForm.salePriceArs} onChange={e => setCostForm({...costForm, salePriceArs: e.target.value})} className="w-full p-2 border rounded-xl bg-gray-50 num-style font-bold text-blue-700" required />
                    </div>
                    <div>
                      <button type="submit" className="bg-[#768C77] text-white px-4 py-2.5 rounded-xl font-bold shadow hover:opacity-95 transition w-full">
                        ➕ Agregar
                      </button>
                    </div>
                  </form>
                </div>

                <div className="bg-white p-6 rounded-2xl border space-y-4 text-xs">
                  <div className="flex justify-between items-center">
                    <h3 className="font-serif-custom font-bold text-sm text-gray-800">📊 Planilla General y Sincronización de Stock</h3>
                    <span className="text-gray-400">Total Registros: {costSheet.length}</span>
                  </div>

                  {costSheet.length === 0 ? (
                    <p className="text-center py-12 text-gray-400">No hay mercadería cargada en la planilla todavía.</p>
                  ) : (
                    <div className="overflow-x-auto">
                      <table className="w-full text-left border-collapse">
                        <thead>
                          <tr className="border-b bg-gray-100 text-gray-700 font-bold">
                            <th className="p-2.5">Fecha</th>
                            <th className="p-2.5">Artículo / Cat.</th>
                            <th className="p-2.5 text-center">Unidades</th>
                            <th className="p-2.5 text-right">Costo Unit. ARS ($)</th>
                            <th className="p-2.5 text-right">Costo Total ARS ($)</th>
                            <th className="p-2.5 text-right text-blue-700">Venta Unit. ARS ($)</th>
                            <th className="p-2.5 text-right text-blue-700">Venta Total ARS ($)</th>
                            <th className="p-2.5 text-center">Sincronizar Tienda</th>
                            <th className="p-2.5 text-center">Eliminar</th>
                          </tr>
                        </thead>
                        <tbody>
                          {costSheet.map(item => {
                            const unitCostArs = item.unitCostArs || 0;
                            const totalCostArs = unitCostArs * item.qty;
                            const totalSaleArs = item.salePriceArs * item.qty;

                            return (
                              <tr key={item.id} className="border-b hover:bg-gray-50 num-style">
                                <td className="p-2.5 text-gray-500">{item.date}</td>
                                <td className="p-2.5">
                                  <p className="font-bold text-gray-800">{item.itemTitle}</p>
                                  <span className="text-[10px] text-gray-400 uppercase">{item.category}</span>
                                </td>
                                <td className="p-2.5 text-center font-semibold">{item.qty} un.</td>
                                <td className="p-2.5 text-right font-bold text-[#768C77]">${unitCostArs.toLocaleString('es-AR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                                <td className="p-2.5 text-right text-gray-600">${totalCostArs.toLocaleString('es-AR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                                <td className="p-2.5 text-right font-bold text-blue-700">${item.salePriceArs.toLocaleString('es-AR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                                <td className="p-2.5 text-right text-gray-600">${totalSaleArs.toLocaleString('es-AR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                                <td className="p-2.5 text-center">
                                  <button 
                                    onClick={() => handleSyncItemToStore(item)} 
                                    className="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg font-semibold text-[11px] shadow-xs transition flex items-center gap-1 mx-auto"
                                    title="Envía este producto al inventario de la tienda o actualiza su stock y precio"
                                  >
                                    <i className="fa-solid fa-cloud-arrow-up"></i> Sincronizar
                                  </button>
                                </td>
                                <td className="p-2.5 text-center">
                                  <button onClick={() => handleDeleteCostItem(item.id)} className="text-red-400 hover:text-red-600 p-1"><i className="fa-solid fa-trash-can"></i></button>
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                        <tfoot>
                          <tr className="bg-gray-50 font-bold border-t-2 border-gray-200 num-style">
                            <td colSpan="2" className="p-3 text-right">TOTALES GENERALES PLANILLA:</td>
                            <td className="p-3 text-center">{costSheet.reduce((acc, i) => acc + i.qty, 0)} un.</td>
                            <td></td>
                            <td className="p-3 text-right text-[#768C77]">
                              ${costSheet.reduce((acc, i) => acc + ((i.unitCostArs || 0) * i.qty), 0).toLocaleString('es-AR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}
                            </td>
                            <td></td>
                            <td className="p-3 text-right text-blue-700">
                              ${costSheet.reduce((acc, i) => acc + (i.salePriceArs * i.qty), 0).toLocaleString('es-AR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}
                            </td>
                            <td colSpan="2"></td>
                          </tr>
                        </tfoot>
                      </table>
                    </div>
                  )}
                </div>
              </div>
            )}

            {activeTab === 'inventory' && (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div className="bg-white p-5 rounded-2xl border space-y-3 text-xs">
                  <div className="flex justify-between items-center">
                    <h3 className="font-serif-custom font-bold text-sm">{editingId ? '✏️ Editar Producto' : '📦 Cargar Producto'}</h3>
                    {editingId && <button onClick={resetForm} className="text-gray-400 underline">Cancelar</button>}
                  </div>

                  <form onSubmit={handleSave} className="space-y-3">
                    <div>
                      <label className="block font-medium mb-1">Título</label>
                      <input type="text" value={form.title} onChange={e => setForm({...form, title: e.target.value})} className="w-full p-2 border rounded-xl bg-gray-50" required />
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block font-medium mb-1">Categoría</label>
                        <select value={form.category} onChange={e => setForm({...form, category: e.target.value})} className="w-full p-2 border rounded-xl bg-gray-50">
                          {categoriesList.map(c => <option key={c} value={c}>{c}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="block font-medium mb-1">Precio ($)</label>
                        <input type="number" value={form.price} onChange={e => setForm({...form, price: e.target.value})} className="w-full p-2 border rounded-xl bg-gray-50 font-bold num-style" required />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block font-medium mb-1">Stock</label>
                        <input type="number" value={form.stock} onChange={e => setForm({...form, stock: e.target.value})} className="w-full p-2 border rounded-xl bg-gray-50 num-style" required />
                      </div>
                      <div>
                        <label className="block font-medium mb-1">Talles / Medidas</label>
                        <input type="text" placeholder="Ej: S, M, L" value={form.variants} onChange={e => setForm({...form, variants: e.target.value})} className="w-full p-2 border rounded-xl bg-gray-50" />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block font-medium mb-1">Colores / Modelos</label>
                        <input type="text" placeholder="Ej: Rojo, Negro" value={form.colors} onChange={e => setForm({...form, colors: e.target.value})} className="w-full p-2 border rounded-xl bg-gray-50" />
                      </div>
                      <div>
                        <label className="block font-medium mb-1">Especificaciones</label>
                        <input type="text" placeholder="Ej: Acero, 220V" value={form.specifications} onChange={e => setForm({...form, specifications: e.target.value})} className="w-full p-2 border rounded-xl bg-gray-50" />
                      </div>
                    </div>

                    <div className="bg-gray-50 p-2 rounded-xl border space-y-1">
                      <label className="block font-medium text-gray-700">📸 Foto Principal:</label>
                      <input type="file" accept="image/*" onChange={e => handleFileSelection(e, 'main')} className="w-full text-[10px]" />
                      <input type="text" placeholder="O pegá URL..." value={form.image} onChange={e => setForm({...form, image: e.target.value})} className="w-full p-1.5 border rounded bg-white text-[11px]" />
                    </div>

                    <div className="bg-gray-50 p-2 rounded-xl border space-y-1">
                      <label className="block font-medium text-gray-700">🖼️ Galería Secundaria:</label>
                      <input type="file" accept="image/*" multiple onChange={e => handleFileSelection(e, 'gallery')} className="w-full text-[10px]" />
                      {additionalImages.length > 0 && (
                        <div className="flex gap-1 mt-1 overflow-x-auto">
                          {additionalImages.map((img, idx) => (
                            <div key={idx} className="relative">
                              <img src={img} className="w-10 h-10 object-cover rounded border" />
                              <button type="button" onClick={() => setAdditionalImages(additionalImages.filter((_, i) => i !== idx))} className="absolute -top-1 -right-1 bg-red-500 text-white rounded-full w-3.5 h-3.5 text-[8px] flex items-center justify-center">×</button>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>

                    <div className="bg-gray-50 p-2 rounded-xl border space-y-1">
                      <label className="block font-medium text-gray-700">🎬 Video Demostrativo:</label>
                      <input type="file" accept="video/*" onChange={e => handleFileSelection(e, 'video')} className="w-full text-[10px]" />
                    </div>

                    <div>
                      <label className="block font-medium mb-1">Descripción</label>
                      <textarea value={form.description} onChange={e => setForm({...form, description: e.target.value})} className="w-full p-2 border rounded-xl h-20 bg-gray-50"></textarea>
                    </div>

                    <button type="submit" className="w-full bg-[#768C77] text-white py-2.5 rounded-xl font-medium shadow">
                      {editingId ? 'Actualizar Producto' : 'Guardar Producto'}
                    </button>
                  </form>
                </div>

                <div className="bg-white p-5 rounded-2xl border space-y-3 text-xs md:col-span-2">
                  <h3 className="font-serif-custom font-bold text-sm">Inventario en Supabase ({products.length})</h3>
                  {loading ? (
                    <p className="text-center py-10 text-gray-400">Cargando...</p>
                  ) : products.length === 0 ? (
                    <p className="text-center py-10 text-gray-400">No hay productos cargados todavía.</p>
                  ) : (
                    <div className="overflow-x-auto">
                      <table className="w-full text-left">
                        <thead>
                          <tr className="border-b bg-gray-50 text-gray-600">
                            <th className="p-2">Foto</th>
                            <th className="p-2">Título</th>
                            <th className="p-2">Categoría</th>
                            <th className="p-2">Precio</th>
                            <th className="p-2">Stock</th>
                            <th className="p-2 text-right">Acciones</th>
                          </tr>
                        </thead>
                        <tbody>
                          {products.map(p => (
                            <tr key={p.id} className="border-b hover:bg-gray-50">
                              <td className="p-2"><img src={p.image} className="w-8 h-8 object-cover rounded border" /></td>
                              <td className="p-2 font-semibold">{p.title}</td>
                              <td className="p-2 text-gray-500">{p.category}</td>
                              <td className="p-2 font-bold text-[#768C77] num-style">${Number(p.price).toLocaleString('es-AR')}</td>
                              <td className="p-2"><span className={`px-2 py-0.5 rounded-full text-[10px] font-bold num-style ${Number(p.stock) > 0 ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}`}>{p.stock} un.</span></td>
                              <td className="p-2 text-right space-x-2">
                                <button onClick={() => handleEdit(p)} className="text-blue-500" title="Editar"><i className="fa-solid fa-pen"></i></button>
                                <button onClick={() => handleDelete(p.id)} className="text-red-400" title="Eliminar"><i className="fa-solid fa-trash"></i></button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              </div>
            )}

            {activeTab === 'categories' && (
              <div className="bg-white p-6 rounded-2xl border space-y-6 text-xs max-w-xl">
                <div>
                  <h3 className="font-serif-custom font-bold text-sm text-gray-800 flex items-center gap-2">
                    <i className="fa-solid fa-tags text-[#768C77]"></i> Gestor de Pestañas y Categorías
                  </h3>
                  <p className="text-gray-500 mt-1">Agregá nuevas pestañas o eliminá las que ya no uses en tu tienda.</p>
                </div>

                <form onSubmit={handleAddCategory} className="flex gap-2">
                  <input 
                    type="text" 
                    placeholder="Nombre de nueva categoría..." 
                    value={newCategoryName} 
                    onChange={e => setNewCategoryName(e.target.value)} 
                    className="flex-grow p-2.5 border rounded-xl bg-gray-50 text-xs" 
                    required 
                  />
                  <button type="submit" className="bg-[#768C77] text-white px-5 py-2.5 rounded-xl font-medium shadow">
                    Agregar Pestaña
                  </button>
                </form>

                <div className="space-y-2 pt-2">
                  <p className="font-semibold text-gray-700">Pestañas Actuales en la Tienda:</p>
                  <div className="divide-y border rounded-xl overflow-hidden bg-gray-50">
                    {categoriesList.map((cat, idx) => (
                      <div key={idx} className="p-3 flex items-center justify-between bg-white">
                        <span className="font-semibold text-gray-800"><i className="fa-solid fa-tag text-[#768C77] mr-2"></i>{cat}</span>
                        <button onClick={() => handleDeleteCategory(cat)} className="text-red-400 hover:text-red-600 p-1" title="Eliminar categoría">
                          <i className="fa-solid fa-trash-can"></i>
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'design' && (
              <div className="bg-white p-6 rounded-2xl border space-y-6 text-xs">
                <div>
                  <h3 className="font-serif-custom font-bold text-sm text-gray-800 flex items-center gap-2">
                    <i className="fa-solid fa-sliders text-[#768C77]"></i> Calibrador de Fondo de Pantalla (Logo de Marca)
                  </h3>
                  <p className="text-gray-500 mt-1">Subí tu logo y ajustá la transparencia y el tamaño para que aparezca como marca de agua en la tienda.</p>
                </div>

                <form onSubmit={handleSaveDesign} className="space-
